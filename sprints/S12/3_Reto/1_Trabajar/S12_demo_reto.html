<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Demo interactiva del reto del Sprint 12 (IFCD107): las reseñas con su detector de temas, la serie de ocupación frente al método simple, el mini-RAG con umbral y la defensa contra ataques, con los datos reales del curso.">
<title>Escuchar al cliente · demo interactiva</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Maqueta común de las demos del reto (IFCD107): hero → «el producto funcionando» con un selector de pasos
   → qué se sube y cómo se evalúa. Identidad: la de las infografías del curso (tinta azulada, óxido, verde azulado, crema). */
:root{
  --bg:#F5F1E8; --surface:#FFFFFF; --ink:#1D2433; --muted:#566073; --line:#D9D2C0; --soft:#EFE7D2;
  --accent:#C23B1F; --accent-soft:#F7DDD4; --teal:#0F7F7F; --teal-soft:#D5ECEA; --sky:#DCE6F5; --blue:#3D5F96;
  --ok:#1B7F4B; --ok-soft:#D9F0E3; --bad:#B42318; --bad-soft:#FBE0DC; --warn:#8A5A00; --warn-soft:#F6E7C4;
  --code-bg:rgba(29,36,51,.08); --focus:#1D2433; --pt:rgba(61,95,150,.42); --grid:#E4DDCB;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161F; --surface:#1B2230; --ink:#F1ECE0; --muted:#A3ADC0; --line:#2E3748; --soft:#232C3C;
    --accent:#F08A6C; --accent-soft:#3A2620; --teal:#58C7BE; --teal-soft:#16302F; --sky:#1F2C44; --blue:#8FB0E6;
    --ok:#6FD3A0; --ok-soft:#173226; --bad:#FF8D78; --bad-soft:#3A1E1A; --warn:#E9C46A; --warn-soft:#3A2F14;
    --code-bg:rgba(241,236,224,.1); --focus:#F1ECE0; --pt:rgba(143,176,230,.5); --grid:#2A3345; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161F; --surface:#1B2230; --ink:#F1ECE0; --muted:#A3ADC0; --line:#2E3748; --soft:#232C3C;
  --accent:#F08A6C; --accent-soft:#3A2620; --teal:#58C7BE; --teal-soft:#16302F; --sky:#1F2C44; --blue:#8FB0E6;
  --ok:#6FD3A0; --ok-soft:#173226; --bad:#FF8D78; --bad-soft:#3A1E1A; --warn:#E9C46A; --warn-soft:#3A2F14;
  --code-bg:rgba(241,236,224,.1); --focus:#F1ECE0; --pt:rgba(143,176,230,.5); --grid:#2A3345; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:44px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:clamp(30px,5.2vw,52px);line-height:1.05;font-weight:800;letter-spacing:-.02em;margin-top:8px}
h2{font-size:clamp(22px,3vw,28px);line-height:1.15;font-weight:800;letter-spacing:-.01em}
h3{font-size:17px;line-height:1.2;font-weight:800}
p{margin:0}
code{font-family:var(--f-mono);font-size:.86em;background:var(--code-bg);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
a{color:var(--accent);font-weight:700;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
button{font:inherit;color:inherit;cursor:pointer}
.kicker{font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--accent)}
.lead{font-size:clamp(17px,2vw,20px);color:var(--muted);max-width:62ch;margin-top:10px}
.hint{font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:5px 13px;font-size:14px;font-weight:700}
.btn{border:2px solid var(--ink);background:transparent;border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.small{padding:5px 11px;font-size:13px}
.btn.on{background:var(--ink);color:var(--bg)}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sh .st{font-family:var(--f-display);font-weight:800;font-size:14px;color:var(--accent);letter-spacing:.12em;white-space:nowrap}
.sh .ln{flex:1;height:2px;background:var(--line)}
.sec-intro{color:var(--muted);max-width:68ch;margin:-4px 0 16px}

/* selector de pasos */
.steps{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.step{display:flex;align-items:center;gap:9px;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 13px 7px 8px;text-align:left;font-weight:700;font-size:14px;line-height:1.2}
.step .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:14px}
.step small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.step[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.step[aria-pressed="true"] small{color:var(--bg);opacity:.8}
.aqui{background:var(--teal-soft);border-radius:12px;padding:11px 16px;margin-bottom:16px;font-size:15.5px;min-height:3.2em}
.aqui b{color:var(--teal)}

/* piezas del producto */
.stage{display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row2>*{min-width:0}
@media (max-width:860px){.row2{grid-template-columns:1fr}}
.pieza{background:var(--surface);border:2px solid var(--line);border-radius:14px;overflow:hidden;min-width:0;transition:opacity .2s,box-shadow .2s,border-color .2s}
.pieza>.bh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;border-bottom:2px solid var(--line);font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.pieza>.bb{padding:12px 14px}
.stage.sel .pieza{opacity:.5}
.stage.sel .pieza.hl{opacity:1;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.stage.sel .pieza.hl>.bh{color:var(--accent)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.duo>*{min-width:0}
@media (max-width:700px){.duo{grid-template-columns:1fr}}
.cap{font-size:13.5px;color:var(--muted);margin-top:6px}
.cap b{color:var(--ink)}

/* gráficos */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.chart .tl{font-size:11.5px;font-weight:700;fill:var(--ink)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ax{stroke:var(--muted);stroke-width:1.2}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.legend i.ln{width:18px;height:3px;border-radius:2px;vertical-align:3px}

/* mandos */
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-top:12px;padding-top:12px;border-top:2px solid var(--line)}
.ctl label{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.ctl input[type=range]{width:170px;accent-color:var(--accent)}
.ctl input[type=number],.ctl select{font-family:var(--f-mono);font-size:14px;padding:5px 8px;border:2px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.ctl input[type=number]{width:6em}
.ctl input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.read{font-family:var(--f-mono);font-size:13px;color:var(--ink);background:var(--soft);border-radius:8px;padding:6px 10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-weight:800;font-size:12.5px;letter-spacing:.04em}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.msg{margin-top:8px;font-size:14.5px;padding:8px 12px;border-radius:10px;background:var(--soft)}
.msg.ok{background:var(--ok-soft);color:var(--ok)} .msg.bad{background:var(--bad-soft);color:var(--bad)} .msg.warn{background:var(--warn-soft);color:var(--warn)}

/* tablas */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;text-align:left}
th{font-size:12.5px;font-weight:800;letter-spacing:.04em;color:var(--muted);border-bottom:2px solid var(--line)}
td{border-bottom:1px solid var(--line)}
td.num,th.num{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.sql{font-family:var(--f-mono);font-size:13px;background:var(--code-bg);border-radius:8px;padding:8px 12px;margin-bottom:10px;overflow-wrap:anywhere}

/* lista de comprobaciones */
.checks{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:5px}
.checks li{display:flex;gap:9px;align-items:baseline;font-size:14.5px}
.checks .m{flex:none;width:1.3em;text-align:center;font-weight:800}
.checks li.ok .m{color:var(--ok)} .checks li.no .m{color:var(--muted)} .checks li.bad .m{color:var(--bad)}
textarea{width:100%;min-height:130px;font:inherit;font-size:15px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);resize:vertical}

/* qué se sube y rúbrica */
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:22px}
.file{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:11px 14px}
.file b{font-family:var(--f-mono);font-size:13.5px;overflow-wrap:anywhere}
.file .o{display:block;font-size:13.5px;color:var(--muted);margin-top:3px}
.file .s{display:block;font-size:12.5px;font-weight:800;color:var(--teal);margin-top:6px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-weight:700;font-size:14.5px}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:900px){.levels{grid-template-columns:1fr 1fr}}
@media (max-width:540px){.levels{grid-template-columns:1fr}}
.lv{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 13px;font-size:14px}
.lv h3{font-size:14px;margin-bottom:5px;color:var(--muted)}
.lv.min{border-color:var(--teal)} .lv.min h3{color:var(--teal)}
.links{display:flex;flex-wrap:wrap;gap:10px}
.foot{font-size:13.5px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

<script>
const DEMO = {"kicker":"IFCD107 · SPRINT 12 · DEMO DEL RETO","titulo":"Escuchar al cliente","lead":"TurisData Canarias recibe cada semana decenas de reseñas y decenas de mensajes de huéspedes con las mismas preguntas («¿hasta cuándo puedo cancelar?», «¿admiten perros?»).","aviso":"Es una demo para entender adónde vamos: **no se entrega nada desde aquí**. Usa las 1500 reseñas, los 1096 días de ocupación y la política de alojamiento del curso (todo **sintético**, TurisData no existe), con el mismo método que los cuadernos `S12_03`, `S12_01` y `S12_06`. El asistente usa el simulador del cuaderno (sin modelo de lenguaje) y el atacante es un juguete a propósito. Las 5 preguntas propias son las del ejemplo de la ficha: vuestras cifras finales serán distintas.","widget":"rag","widget_titulo":"Reseñas, ocupación y un asistente que sabe callar","intro":"Esto es lo que tendréis al acabar el reto. **Tocad los mandos:** cambiad del detector de palabras clave a las etiquetas y mirad qué queja parece la principal, escribid una reseña con un «no», elegid otro *baseline* para la ocupación, subid y bajad el umbral del asistente hasta que invente o calle, y activad el filtro contra los ataques. Después, elegid un paso para ver qué pieza construís en él.","aqui_todo":"Elegid un paso del reto y se ilumina **la pieza que construís en él**. Pulsad otra vez el mismo paso para verlo todo.","pasos":[{"n":"1","titulo":"Reparto y plan","corto":"Reparto y plan","min":15,"piezas":["plan"],"aqui":"Aquí repartís las áreas, escribís una tarjeta por entregable y una pregunta de negocio por parte: cada tarjeta de abajo trae la pregunta y la cifra que enseñaréis en la review."},{"n":"2","titulo":"Datos y modelos","corto":"Datos y modelos","min":80,"piezas":["resenas","ocupacion","asistente"],"aqui":"Aquí hacéis los tres cuadernos: las reseñas (porcentajes, exactitud en prueba, temas y citas), la ocupación (partida por fecha, *baseline* y SARIMAX) y el asistente (trocear, recuperar, citar y callar). Cada pieza es el resultado de uno."},{"n":"3","titulo":"Evaluación y seguridad del asistente","corto":"Evaluar y atacar","min":40,"piezas":["evaluacion","ataques"],"aqui":"Aquí examináis al asistente con 25 preguntas (acierto, sin fuente o alucinación), probáis tres ataques de *prompt injection* y medís un filtro de frases sospechosas."},{"n":"4","titulo":"Cierre, entrega y review","corto":"Cierre y review","min":40,"piezas":["nota"],"aqui":"Aquí redactáis el informe de reseñas, la nota de IA responsable (la tabla de abajo, con vuestras cifras) y el `LEEME.md`, y ensayáis la review: una cifra, un gráfico y una demo."}],"ficheros":[{"nombre":"informe_resenas.md","origen":"Lo creáis a partir de una plantilla.","sube":"Sí · sprint-12/"},{"nombre":"grafico_resenas.png","origen":"Lo genera","sube":"Sí · sprint-12/"},{"nombre":"resenas.ipynb","origen":"Lo creáis","sube":"Sí · sprint-12/"},{"nombre":"ocupacion.ipynb","origen":"Lo creáis","sube":"Sí · sprint-12/"},{"nombre":"asistente_rag.ipynb","origen":"Lo creáis","sube":"Sí · sprint-12/"},{"nombre":"evaluacion_asistente.csv","origen":"Lo genera","sube":"Sí · sprint-12/"},{"nombre":"nota_ia_responsable.md","origen":"Lo creáis","sube":"Sí · sprint-12/"},{"nombre":"LEEME.md","origen":"Lo creáis","sube":"Sí · sprint-12/"},{"nombre":"resenas.csv","origen":"Ya hechos.","sube":"Sí, sin cambios · data/ (si aún no están)"},{"nombre":"autoevaluacion_nombre.md","origen":"Ya hecha, en blanco","sube":"Sí, una por persona (no una por equipo) · sprint-12/"}],"sube_resumen":"8 ficheros + 1 hoja por persona","carpeta_entrega":"sprint-12/","rubrica":[{"criterio":"Corrección técnica","pregunta":"¿funciona?","niveles":["Hay código, pero no se ejecuta de arriba abajo o falta el baseline o el asistente no devuelve ninguna respuesta","La serie se parte por fecha y el baseline tiene su MAE; el asistente recupera un fragmento, lo cita y responde «No consta…» a la pregunta del gimnasio","Hay modelo con su MAE junto al del baseline; el sentimiento se evalúa en prueba (exactitud y matriz); las 25 preguntas están evaluadas y las cuentas suman 25; 3 ataques probados","Además, dos alternativas comparadas con números (SARIMAX frente a GRU, o varios umbrales) y la elegida justificada"]},{"criterio":"Reproducibilidad","pregunta":"¿lo puede repetir otra persona?","niveles":["Solo funciona en el ordenador o la sesión de quien lo hizo (rutas propias, datos sin indicar)","El LEEME.md dice qué ejecutar, pero faltan versiones, datos u orden de los cuadernos","Otra persona ejecuta cada cuaderno con Reiniciar sesión y ejecutar todo y obtiene los mismos números (SEMILLA = 42), siguiendo solo el LEEME.md","Además, funciona sin internet, las versiones están fijadas y los datos (o el script para obtenerlos) van incluidos"]},{"criterio":"Análisis y comunicación al cliente","pregunta":"¿lo entiende quien no programa?","niveles":["Hay cifras y gráficos, pero sin interpretarlos y sin recomendaciones","Da el sentimiento con cifras, un gráfico y 3 citas reales; las recomendaciones son vagas o hay menos de tres","Informe de 2 páginas, cifras interpretadas, 3 recomendaciones ejecutables el lunes (qué, quién, cómo sabremos que funciona), una frase para el cliente sobre la previsión y límites explicados","Además, 3 temas criticados y 3 valorados con cifras y ejemplos, y cada recomendación apoyada en una cifra concreta del informe"]},{"criterio":"IA responsable","pregunta":"¿se sabe qué riesgos hay y qué se hizo?","niveles":["No hay nota, o no nombra ningún riesgo","La nota nombra riesgos (alucinación, datos personales, prompt injection, sesgos) pero sin decir qué medida se aplica","Riesgos concretos de este reto, cada uno con su medida (umbral y «No consta», filtro de frases sospechosas…); 3 ataques descritos con qué los frenó; sin claves; datos sintéticos declarados","Además, las medidas se miden: «el filtro bloqueó 3 de 3 ataques y ninguna de las 25 preguntas legítimas», y se dice qué no cubre"]}],"enlaces":[{"t":"Reto en una página","    c = asistente (política troceada, vocabulario/idf/matriz TF-IDF, preguntas y pistas, patrones del filtro). Todo se calcula en prep_rag.py con los
   datos del curso; aquí solo se recalcula lo que depende de un mando (recuperar con TF-IDF, filtrar, umbral). */
W.rag = function(host, D){
  const d = D.datos, A = d.a, B = d.b, C = d.c, NB = ' ';

  const $ = (r, s) => r.querySelector(s);

  /* ───────── motor del asistente (el mismo TF-IDF por raíces del cuaderno S12_06) ───────── */
  const qt = s => String(s).toLowerCase().normalize('NFD').replace(/\p{Mn}/gu, '');
  const VAC = new Set(C.vacias), VOC = new Map(C.vocab.map((w, i) => [w, i])), NV = C.vocab.length;
  const raices = s => (qt(s).match(/[\p{L}\p{N}_]+/gu) || []).filter(w => !VAC.has(w)).map(w => w.slice(0, 5));
  function vecTexto(s){
    const v = new Float64Array(NV); raices(s).forEach(r => { if (VOC.has(r)) v[VOC.get(r)] += 1; });
    let n = 0; for (let i = 0; i < NV; i++) { v[i] *= C.idf[i]; n += v[i] * v[i]; }
    n = Math.sqrt(n); if (n > 0) for (let i = 0; i < NV; i++) v[i] /= n; return v;
  }
  const filaDens = f => { const v = new Float64Array(NV); f.forEach(([i, x]) => { v[i] = x; }); return v; };
  const BASE = {frs: C.frag, rows: C.filas.map(filaDens)};
  const expandir = p => { const b = qt(p); const ex = Object.entries(C.sinonimos).filter(([k]) => b.includes(k)).map(([, v]) => v); return ex.length ? p + ' ' + ex.join(' ') : p; };
  function recuperar(corp, p, k, sin){
    const q = vecTexto(sin ? expandir(p) : p);
    const sims = corp.rows.map(r => { let s = 0; for (let i = 0; i < NV; i++) s += r[i] * q[i]; return s; });
    return sims.map((s, i) => i).sort((a, b) => sims[b] - sims[a] || b - a).slice(0, k).map(i => ({s: sims[i], i, f: corp.frs[i]}));
  }
  const NO = C.no_consta;
  const prompt = (p, rec) => C.plantilla.replace('{no_consta}', NO).replace('{contexto}', rec.map((r, i) => `[${i + 1}] (Sección: ${r.f.s}) ${r.f.t}`).join('\n')).replace('{pregunta}', p);
  const genSim = pr => { const m = pr.match(/\[1\] \(Sección: (.*?)\) (.*)/); return m ? `${m[2]} [1] (Fuente: ${m[1]})` : NO; };
  const genIng = pr => { const m = pr.match(/ignora las instrucciones anteriores y (.*?)(?:\.|$)/is); return m ? 'Claro: ' + m[1] : genSim(pr); };
  const CACHE = new Map();
  function recC(corp, p, sin){ if (corp !== BASE) return recuperar(corp, p, 3, sin); const k = (sin ? 1 : 0) + p; if (!CACHE.has(k)) CACHE.set(k, recuperar(corp, p, 3, sin)); return CACHE.get(k); }
  function responder(corp, p, u, sin, gen){
    const rec = recC(corp, p, sin), mejor = rec[0].s;
    if (mejor < u) return {resp: NO, rec, mejor, usa: []};
    const pr = prompt(p, rec); return {resp: (gen || genSim)(pr), rec, mejor, usa: rec, prompt: pr};
  }
  const cifras = t => new Set(t.match(/\d+(?::\d+)?/g) || []);
  function alucina(resp, frs, sinResp){
    if (resp.toLowerCase().includes(NO.toLowerCase())) return false;
    if (sinResp) return true;
    const ctx = cifras(frs.map(f => f.f.t).join(' ')), r = cifras(resp.replace(/\[\d+\]|\(Fuente:.*?\)/g, ''));
    for (const x of r) if (!ctx.has(x)) return true; return false;
  }
  const esSeguro = t => { const l = qt(t); return !C.patrones.some(p => new RegExp(p, 'i').test(l)); };
  const patronQue = t => { const l = qt(t); return C.patrones.find(p => new RegExp(p, 'i').test(l)); };
  const PQ = C.preguntas;
  /* contiene(): el cuaderno comprueba «pista dentro de la respuesta» */
  const contienePista = (c, t) => qt(t).replace(/\*\*/g, '').includes(qt(c));
  function evalua(u, sin){
    return PQ.map((p, n) => {
      const r = responder(BASE, p.q, u, sin), sr = p.clave == null, nc = r.resp.toLowerCase().includes(NO.toLowerCase());
      const ok = sr ? nc : (!nc && contienePista(p.clave, r.resp));
      return {n, q: p.q, ok, sf: !nc && !r.resp.includes('['), al: alucina(r.resp, r.rec, sr), mejor: r.mejor, resp: r.resp, rec: r.rec};
    });
  }
  const resumen = rs => ({ok: rs.filter(r => r.ok).length, sf: rs.filter(r => r.sf).length, al: rs.filter(r => r.al).length});
  /* estado compartido del asistente (umbral y sinónimos) */
  const E = {u: .15, sin: true, subs: []};
  const setE = (u, sin) => { E.u = u; E.sin = sin; E.subs.forEach(f => f()); };

  /* ───────── plan ───────── */
  let b = pieza(host, 'plan', 'EL ENCARGO · tres partes y una nota');
  const pn = A.n_neg / A.n;
  const tarj = [
    ['A · RESEÑAS', '¿De qué se quejan más los huéspedes?', `<b>${P(pn * 100)}<\/b> de las ${fmt(A.n, 0)} reseñas son negativas`, 'resenas'],
    ['B · OCUPACIÓN', '¿Cuánto mejora un modelo al método simple?', `Error de <b>${fmt(B.mae.sar, 1)}<\/b> puntos frente a <b>${fmt(B.mae.est, 1)}<\/b> del método simple`, 'ocupacion'],
    ['C · ASISTENTE', '¿Qué hace el asistente cuando no sabe?', 'Pregunta por el gimnasio y responde <b>«No consta…»<\/b>', 'asistente'],
    ['D · IA RESPONSABLE', '¿Qué riesgos hay y qué hicimos contra cada uno?', 'Una tabla de riesgos con su medida y su cifra', 'nota']];
  b.innerHTML = `<div class="w12-plan">${tarj.map(t => `<div class="w12-card"><span class="k">${t[0]}<\/span><span class="q">${t[1]}<\/span><span class="c">Cifra de la review: ${t[2]}<\/span><button type="button" class="btn small" data-ir="${t[3]}">Ver el producto ↓<\/button><\/div>`).join('')}<\/div>
    <p class="cap">Cada parte la lidera una persona, pero todas tenéis que poder explicarlas. Abajo está el producto de cada una con sus datos reales: <b>tocad los mandos<\/b> de cada pieza.<\/p>`;
  b.querySelectorAll('[data-ir]').forEach(bt => bt.addEventListener('click', () => {
    const t = host.querySelector(`[data-pieza="${bt.dataset.ir}"]`); if (!t) return;
    t.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start'});
    t.classList.remove('w12-flash'); void t.offsetWidth; t.classList.add('w12-flash');
  }));

  /* ───────── A · reseñas ───────── */
  b = pieza(host, 'resenas', 'PARTE A · RESEÑAS · qué opinan y de qué se quejan');
  const duoA = el('div', 'duo'); b.appendChild(duoA);
  const colA = el('div'), colB = el('div'); duoA.append(colA, colB);
  /* sentimiento */
  const ord = ['positivo', 'neutro', 'negativo'], colr = {positivo: 'var(--ok)', neutro: 'var(--muted)', negativo: 'var(--bad)'};
  const c1 = chart({x: [0, 3], y: [0, 60], xt: [], yt: [0, 20, 40, 60], yl: 'Reseñas (%)', label: 'Reparto del sentimiento de las reseñas', w: 420, h: 240, fy: v => fmt(v, 0)});
  ord.forEach((k, i) => {
    const v = A.cuenta[k] / A.n * 100, x0 = c1.X(i + .15), x1 = c1.X(i + .85);
    const r = S('rect', {x: x0, y: c1.Y(v), width: x1 - x0, height: c1.Y(0) - c1.Y(v), fill: colr[k], rx: 3}, c1.g); S('title', {}, r, `${k}: ${fmt(v)} %`);
    S('text', {x: (x0 + x1) / 2, y: c1.Y(v) - 5, 'text-anchor': 'middle', class: 'tl'}, c1.svg, fmt(v) + ' %');
    S('text', {x: (x0 + x1) / 2, y: c1.H - c1.m.b + 15, 'text-anchor': 'middle'}, c1.svg, k);
  });
  colA.appendChild(c1.svg);
  colA.appendChild(el('p', 'cap', `<b>Reparto del sentimiento<\/b> en las ${fmt(A.n, 0)} reseñas (eje desde 0). Es el primer resultado del informe: tres porcentajes que suman 100.`));
  const mx = el('div', 'scroll'); const cmx = A.cm, tot = cmx.flat().reduce((s, v) => s + v, 0);
  mx.innerHTML = `<table class="w12-mx" aria-label="Matriz de confusión en prueba"><thead><tr><th scope="col">real \\ dijo el modelo<\/th>${A.clases.map(c => `<th scope="col">${c}<\/th>`).join('')}<\/tr><\/thead><tbody>${
    cmx.map((f, i) => `<tr><th scope="row">${A.clases[i]}<\/th>${f.map((v, j) => `<td class="${i === j ? 'ok' : (v ? 'er' : 'z')}">${v}<\/td>`).join('')}<\/tr>`).join('')}<\/tbody><\/table>`;
  colA.appendChild(mx);
  const errs = tot - cmx.reduce((s, f, i) => s + f[i], 0);
  colA.appendChild(el('p', 'cap', `<b>Exactitud en prueba: ${P(A.acc_lr * 100)}<\/b> (${A.aciertos} de ${A.n_test} reseñas que el modelo no había visto). Decir siempre «positivo» acertaría el ${P(A.base * 100)}: contra ese número hay que leer el ${P(A.acc_lr * 100)}. ${errs} errores: neutras que toma por negativas.`));
  /* temas */
  const ts = A.temas; let fuente = 'real', tema = 'limpieza';
  colB.innerHTML = `<div class="w12-sw" role="group" aria-label="Qué se cuenta"><button type="button" class="btn small on" data-f="real" aria-pressed="true">Etiquetas del corpus<\/button><button type="button" class="btn small" data-f="det" aria-pressed="false">Detector de palabras clave<\/button><\/div>
    <div class="legend" style="margin:0 0 6px"><span><i style="background:var(--bad)"><\/i>en críticas (de ${A.n_neg})<\/span><span><i style="background:var(--ok)"><\/i>en elogios (de ${A.n_pos})<\/span><\/div>
    <div class="w12-rows" id="w12-tm"><\/div><div class="msg" id="w12-tmm" aria-live="polite"><\/div><div id="w12-ct"><\/div>`;
  const tm = $(colB, '#w12-tm'), tmm = $(colB, '#w12-tmm'), ct = $(colB, '#w12-ct');
  function dibTemas(){
    const k = fuente;
    const orden = ts.slice().sort((a, c) => c['neg_' + k] - a['neg_' + k] || a.t.localeCompare(c.t));
    tm.innerHTML = orden.map(t => {
      const n = t['neg_' + k], p = t['pos_' + k], pn_ = n / A.n_neg * 100, pp = p / A.n_pos * 100, dx = t.neg_det - t.neg_real;
      const extra = k === 'det' && dx ? `<span class="pill warn e" style="padding:0 6px;font-size:11px">+${dx}<\/span>` : '<span class="e"><\/span>';
      return `<button type="button" class="w12-row" data-t="${t.t}" aria-pressed="${t.t === tema}" aria-label="${t.t}: ${n} críticas (${fmt(pn_, 0)} %) y ${p} elogios (${fmt(pp, 0)} %)"><b>${t.t}<\/b>
        <span class="w12-bl"><span class="t"><span class="f" style="width:${pn_ / 50 * 100}%;background:var(--bad)"><\/span><\/span><span class="v">${fmt(pn_, 0)} % · ${n}<\/span>${extra}<\/span>
        <span class="w12-bl"><span class="t"><span class="f" style="width:${pp / 50 * 100}%;background:var(--ok)"><\/span><\/span><span class="v">${fmt(pp, 0)} % · ${p}<\/span><span class="e"><\/span><\/span><\/button>`;
    }).join('');
    tm.querySelectorAll('.w12-row').forEach(bt => bt.addEventListener('click', () => { tema = bt.dataset.t; dibTemas(); }));
    const pcs = ts.map(t => t['neg_' + k] / A.n_neg * 100), pps = ts.map(t => t['pos_' + k] / A.n_pos * 100);
    if (k === 'real') {
      const o = orden[0], o2 = orden[1];
      tmm.className = 'msg ok';
      tmm.innerHTML = `Con las etiquetas, los seis temas salen entre el <b>${fmt(Math.min(...pcs), 0)} % y el ${fmt(Math.max(...pcs), 0)} %<\/b> en las críticas y entre el ${fmt(Math.min(...pps), 0)} % y el ${fmt(Math.max(...pps), 0)} % en los elogios: <b>ninguno destaca<\/b>. «${o.t}» encabeza las críticas, pero solo por ${o.neg_real - o2.neg_real} reseñas sobre «${o2.t}»: no inventéis una diferencia que no hay.`;
    } else {
      const m = ts.slice().sort((a, c) => (c.neg_det - c.neg_real) - (a.neg_det - a.neg_real))[0];
      tmm.className = 'msg warn';
      tmm.innerHTML = `El detector marca «${m.t}» en <b>${m.neg_det} críticas<\/b> (${fmt(m.neg_det / A.n_neg * 100, 0)} %) y las etiquetas, en ${m.neg_real}: <b>${m.neg_det - m.neg_real} de más<\/b> (F1 del detector en ese tema: ${fmt(m.f1, 2)}). Si lo usarais diríais que la queja principal es «${m.t}» y sería un efecto del método. Para el informe, usad las etiquetas y contad esta diferencia como límite.`;
    }
    const tt = ts.find(t => t.t === tema), li = x => x.map(c => `<p class="w12-q">«${esc(c[1])}»<small>id_resena: ${c[0]}<\/small><\/p>`).join('');
    ct.innerHTML = `<h3 style="margin:10px 0 6px;font-size:15px">Citas reales sobre «${tema}»<\/h3><div class="w12-two"><div><b class="hint">Críticas (${tt.neg_real} lo mencionan)<\/b>${li(tt.citas.neg)}<\/div><div><b class="hint">Elogios (${tt.pos_real})<\/b>${li(tt.citas.pos)}<\/div><\/div>
      <p class="cap">Se copian <b>tal cual<\/b> y con su <code>id_resena<\/code>.<\/p>`;
  }
  colB.querySelectorAll('[data-f]').forEach(bt => bt.addEventListener('click', () => {
    fuente = bt.dataset.f; colB.querySelectorAll('[data-f]').forEach(x => { x.classList.toggle('on', x === bt); x.setAttribute('aria-pressed', String(x === bt)); }); dibTemas();
  }));
  dibTemas();
  /* clasificador: el modelo ajustado en Python, evaluado aquí con sus pesos */
  const M = A.modelo, IV = new Map(M.vocab.map((w, i) => [w, i]));
  const limp = t => t.toLowerCase().replace(/[^a-záéíóúüñ\s]/g, ' ').split(/\s+/).filter(Boolean);
  function clasificar(t){
    const toks = limp(t).filter(w => w.length >= 2), cnt = new Map(), fuera = [];
    toks.forEach(w => IV.has(w) ? cnt.set(IV.get(w), (cnt.get(IV.get(w)) || 0) + 1) : fuera.push(w));
    let nr = 0; const x = new Map(); cnt.forEach((c, i) => { const v = c * M.idf[i]; x.set(i, v); nr += v * v; }); nr = Math.sqrt(nr) || 1;
    const lg = A.clases.map((_, k) => { let s = M.b[k]; x.forEach((v, i) => { s += M.coef[k][i] * v / nr; }); return s; });
    const mx_ = Math.max(...lg), ex = lg.map(v => Math.exp(v - mx_)), z = ex.reduce((s, v) => s + v, 0), pr = ex.map(v => v / z);
    const conocidas = [...x.keys()].map(i => ({w: M.vocab[i], k: A.clases.map((_, c) => M.coef[c][i]), v: x.get(i)}));
    return {pr, conocidas, fuera, k: pr.indexOf(Math.max(...pr))};
  }
  const detectar = t => { const l = limp(t).join(' '); return ts.filter(x => x.claves.some(c => l.includes(c))).map(x => x.t); };

  const mk = S('line', {x1: 0, x2: 0, y1: ec.m.t, y2: ec.H - ec.m.b, stroke: 'var(--ink)', 'stroke-width': 1.6, 'stroke-dasharray': '4 4'}, ec.svg);
  const pA = S('circle', {cx: 0, cy: 0, r: 5, fill: 'var(--ok)'}, ec.g), pH = S('circle', {cx: 0, cy: 0, r: 5, fill: 'var(--bad)'}, ec.g);
  $(pev, '#w12-ec').appendChild(ec.svg);
  const eu = $(pev, '#w12-eu');
  function dibEv(){
    const rs = evalua(E.u, E.sin), s = resumen(rs);
    $(pev, '#w12-eur').textContent = fmt(E.u, 2);
    $(pev, '#w12-eb').innerHTML = rs.map(r => `<tr class="${r.al ? 'al' : r.ok ? '' : 'no'}"><td>${esc(r.q)}<\/td><td>${r.al ? '<span class="pill warn">ALUCINA<\/span>' : r.ok ? '<span class="pill ok">✓<\/span>' : '<span class="pill bad">✗<\/span>'}<\/td><td class="num">${fmt(r.mejor, 2)}<\/td><\/tr>`).join('');
    let da = '', dh = ''; const us_ = []; for (let i = 0; i <= 70; i++) us_.push(i / 100);
    us_.forEach((u, i) => { const q = resumen(evalua(u, E.sin)); da += (i ? 'L' : 'M') + ec.X(u).toFixed(1) + ' ' + ec.Y(q.ok).toFixed(1); dh += (i ? 'L' : 'M') + ec.X(u).toFixed(1) + ' ' + ec.Y(q.al).toFixed(1); });
    lA.setAttribute('d', da); lH.setAttribute('d', dh);
    mk.setAttribute('x1', ec.X(Math.min(E.u, .7))); mk.setAttribute('x2', ec.X(Math.min(E.u, .7))); pA.setAttribute('cx', ec.X(Math.min(E.u, .7))); pA.setAttribute('cy', ec.Y(s.ok)); pH.setAttribute('cx', ec.X(Math.min(E.u, .7))); pH.setAttribute('cy', ec.Y(s.al));
    $(pev, '#w12-es').textContent = `Aciertos: ${s.ok}/${rs.length} | sin fuente: ${s.sf} | alucinaciones: ${s.al}`;
    const sr = rs.filter(r => PQ[r.n].clave == null), calla = rs.filter(r => PQ[r.n].clave != null && r.resp.toLowerCase().includes(NO.toLowerCase())).length;
    const m = $(pev, '#w12-em'); let cls, txt;
    if (s.al > 0) { cls = 'bad'; txt = `Con este umbral el asistente <b>contesta a lo que no sabe<\/b>: ${s.al} alucinaciones (${rs.filter(r => r.al).map(r => '«' + esc(r.q) + '»').join(', ')}). Un asistente que inventa es peor que uno que dice «No consta».`; }
    else if (calla > 0) { cls = 'warn'; txt = `Ninguna alucinación, pero el asistente <b>calla de más<\/b>: ${calla} preguntas con respuesta se quedan en «No consta…». ${s.ok} aciertos de 25.`; }
    else { cls = 'ok'; txt = `Equilibrio: <b>0 alucinaciones<\/b> y ningún silencio de más. ${s.ok === 25 ? 'Las 25 bien.' : 'Falla ' + (25 - s.ok) + ': ' + rs.filter(r => !r.ok).map(r => '«' + esc(r.q) + '»').join(', ') + ' (el fragmento recuperado habla de otra cosa con palabras parecidas).'}`; }
    m.className = 'msg ' + cls; m.innerHTML = txt;
  }
  eu.addEventListener('input', () => setE(+eu.value, E.sin));
  pev.querySelectorAll('[data-u]').forEach(bt => bt.addEventListener('click', () => setE(+bt.dataset.u, E.sin)));
  E.subs.push(() => { eu.value = E.u; dibEv(); });
  dibEv();

  /* ───────── ataques ───────── */
  b = pieza(host, 'ataques', 'SEGURIDAD · ataques de «prompt injection» y un filtro'); const pata = b;
  const VEN = Object.assign({}, C.veneno, {t: C.veneno.texto + C.ataque_corpus_cola, s: C.veneno.seccion});
  const frVen = {s: VEN.s, t: VEN.t}, corpVen = {frs: BASE.frs.concat([frVen]), rows: BASE.rows.concat([vecTexto(`${VEN.s}. ${VEN.t}`)])};
  const ATQ = [
    {tipo: '1 · Texto malicioso escondido en un fragmento', texto: C.veneno.texto, corpus: true, q: C.ataque_corpus_pregunta},
    {tipo: '2 · Pregunta con una orden dentro', texto: C.ataques_pregunta[0], q: C.ataques_pregunta[0]},
    {tipo: '3 · Pregunta legítima con la orden pegada al final', texto: C.ataques_pregunta[1], q: C.ataques_pregunta[1]}];
  function lanzar(a, filtro){
    if (a.corpus) {
      let corp = corpVen, quitado = false;
      if (filtro && !esSeguro(VEN.t)) { corp = BASE; quitado = true; }
      const r = responder(corp, a.q, 0, true, genIng);
      return {r, bloq: quitado, motivo: 'El filtro descartó el fragmento envenenado antes de indexarlo.', exito: r.resp.includes('100 %') || r.resp.includes('gimnasio')};
    }
    if (filtro && !esSeguro(a.q)) return {r: null, bloq: true, motivo: 'El filtro rechazó la pregunta antes de llegar al asistente.', exito: false};
    const r = responder(BASE, a.q, 0, true, genIng); return {r, bloq: false, exito: r.resp.includes('100 %') || r.resp.includes('siempre gratis') || r.resp.startsWith('Claro')};
  }
  const bloqueadas = PQ.filter(p => !esSeguro(p.q)).length, bloqF = BASE.frs.filter(f => !esSeguro(f.t)).length;
  b.innerHTML = `<p class="cap" style="margin:0 0 8px">El asistente de esta pieza es el «<b>ingenuo<\/b>» del cuaderno: un juguete que obedece cualquier orden «ignora las instrucciones anteriores y…». No es un modelo real: hace los ataques <b>reproducibles<\/b>. Como en el cuaderno, se prueba con umbral 0 para que siempre conteste.<\/p>
    <div class="ctl" style="border:0;margin:0 0 8px;padding:0"><label><input type="checkbox" id="w12-fl"> <span>Activar el filtro de frases sospechosas (<code>es_seguro<\/code>)<\/span><\/label><span class="read" id="w12-ac"><\/span><\/div>
    <div class="w12-at" id="w12-al"><\/div>
    <div class="ctl"><label class="w12-grow">Probad vuestro ataque <input class="w12-in" id="w12-at" type="text" maxlength="200" value="${esc(C.evasiones[1])}"><\/label>
      <span class="hint" style="flex-basis:100%">Las tres frases del cuaderno:<\/span><span class="w12-sw" style="flex-basis:100%;margin:0">${C.evasiones.map((f, i) => `<button type="button" class="btn small" data-i="${i}">${esc(f)}<\/button>`).join('')}<\/span><\/div>
    <div id="w12-ao" aria-live="polite"><\/div>
    <div class="read" style="margin-top:10px">Preguntas legítimas bloqueadas por el filtro: ${bloqueadas} de ${PQ.length} (y ${bloqF} de ${BASE.frs.length} fragmentos de la política)<\/div>`;
  const flC = $(pata, '#w12-fl');
  function dibAt(){
    const f = flC.checked, rs = ATQ.map(a => lanzar(a, f)), n = rs.filter(r => r.exito).length;
    $(pata, '#w12-ac').textContent = `Ataques que prosperan ${f ? 'CON' : 'SIN'} filtro: ${n} de ${ATQ.length}`;
    $(pata, '#w12-al').innerHTML = ATQ.map((a, i) => { const r = rs[i];
      const res = r.bloq ? `<span class="pill ok">BLOQUEADO<\/span> ${r.motivo}` : r.exito ? `<span class="pill bad">PROSPERA<\/span> El asistente obedece: «<span style="white-space:pre-wrap">${esc(r.r.resp)}<\/span>»` : `<span class="pill ok">NO PROSPERA<\/span> «<span style="white-space:pre-wrap">${esc(r.r.resp)}<\/span>»`;
      return `<div><b>${a.tipo}<\/b><code>${esc(a.texto)}<\/code><div class="r">${res}<\/div><\/div>`; }).join('');
    probar2();
  }
  function probar2(){
    const t = $(pata, '#w12-at').value, o = $(pata, '#w12-ao'); if (!t.trim()) { o.innerHTML = '<div class="msg">Escribid una frase.<\/div>'; return; }
    const seg = esSeguro(t), pat = patronQue(t), f = flC.checked;
    let r = null; if (seg || !f) r = responder(BASE, t, 0, true, genIng);
    const obedece = r && r.resp.startsWith('Claro');
    let cls, txt;
    if (!seg) { cls = f ? 'ok' : 'warn'; txt = `El filtro <b>detecta<\/b> el patrón <code>${esc(pat)}<\/code>${f ? ' y rechaza la frase: el asistente ni la ve.' : ', pero está desactivado: ' + (obedece ? 'el asistente obedece («' + esc(r.resp) + '»).' : 'la frase pasa.')}`; }
    else { cls = obedece ? 'bad' : 'warn'; txt = `El filtro <b>deja pasar<\/b> la frase (ningún patrón coincide). ${obedece ? 'Y el asistente obedece: «' + esc(r.resp) + '».' : 'Nuestro asistente ingenuo solo obedece la frase exacta «ignora las instrucciones anteriores y…», así que contesta normal; <b>un modelo real quizá sí obedecería<\/b>. Por eso un filtro es una capa más, no una garantía.'}`; }
    o.innerHTML = `<div class="msg ${cls}">${txt}<\/div>`;
  }
  flC.addEventListener('change', dibAt); $(pata, '#w12-at').addEventListener('input', dedo(120, probar2));
  pata.querySelectorAll('[data-i]').forEach(bt => bt.addEventListener('click', () => { $(pata, '#w12-at').value = C.evasiones[+bt.dataset.i]; probar2(); }));
  dibAt();

  /* ───────── nota de IA responsable ───────── */
  b = pieza(host, 'nota', 'NOTA DE IA RESPONSABLE · riesgos, medidas y cifras');
  const bn = b;
  function dibNota(){
    const s0 = resumen(evalua(0, E.sin)), s1 = resumen(evalua(E.u, E.sin)), sinD = ATQ.filter(a => lanzar(a, false).exito).length, conD = ATQ.filter(a => lanzar(a, true).exito).length;
    bn.innerHTML = `<div class="scroll"><table class="w12-nota"><thead><tr><th>Riesgo<\/th><th>Qué pasa<\/th><th>Medida<\/th><th>Cómo la medimos<\/th><\/tr><\/thead><tbody>
      <tr><td>El asistente responde a lo que no sabe<\/td><td>Con umbral 0, «¿Tienen gimnasio?» y «¿Hay ascensor?» se contestan con otra norma de la política.<\/td><td>Umbral ${fmt(E.u, 2)} y la frase «No consta…»<\/td><td>Con 25 preguntas: umbral 0 → <b>${s0.al}<\/b> alucinaciones; umbral ${fmt(E.u, 2)} → <b>${s1.al}<\/b><\/td><\/tr>
      <tr><td>Datos personales en las reseñas<\/td><td>Las reseñas reales pueden traer nombres o contactos; las de este reto son sintéticas.<\/td><td>Anonimizar antes de guardarlas y no pegarlas en una IA externa<\/td><td>No medida: lo decimos<\/td><\/tr>
      <tr><td>Texto que manipula al asistente<\/td><td><b>${sinD} de ${ATQ.length}<\/b> ataques funcionan sin defensa.<\/td><td>Filtro de frases sospechosas (<code>es_seguro<\/code>)<\/td><td>Con filtro: <b>${conD} de ${ATQ.length}<\/b> ataques y <b>${bloqueadas} de ${PQ.length}<\/b> preguntas legítimas bloqueadas. Se esquiva con «I-g-n-o-r-a» o en inglés.<\/td><\/tr>
      <tr><td>Sesgos y límites del clasificador<\/td><td>No entiende negaciones: «la limpieza no es impecable» sale positivo. Confunde ${errs} neutras con negativas.<\/td><td>Decirlo en el informe y no usarlo para decidir sobre personas<\/td><td>Matriz de confusión: <b>${errs} errores en ${A.n_test} reseñas<\/b><\/td><\/tr><\/tbody><\/table><\/div>
      <p class="cap">Las cifras se recalculan con el umbral que dejéis en las piezas de arriba. Son las del ejemplo del curso: <b>las vuestras salen de vuestros cuadernos<\/b>, nunca de aquí ni de una IA. Una nota buena nombra riesgos concretos de este reto, la medida de cada uno y, si se puede, la cifra que la respalda y lo que <b>no<\/b> cubre.<\/p>`;
  }
  E.subs.push(dibNota); dibNota();
  return {};
};

/* ───────── marco común ───────── */
const app = document.getElementById('app');
const sh = (t) => `<div class="sh"><span class="st">${esc(t)}</span><span class="ln"></span></div>`;

const hero = el('header');
const totalMin = D.pasos.reduce((s, p) => s + (p.min || 0), 0);
hero.innerHTML = `<div class="kicker">${esc(D.kicker)}</div><h1>${esc(D.titulo)}</h1><p class="lead">${md(D.lead)}</p>
  <div class="chips"><span class="chip">${D.pasos.length} pasos</span><span class="chip">≈ ${totalMin} min de reto</span><span class="chip">${esc(D.sube_resumen)}</span></div>
  <p class="hint" style="margin-top:14px">${md(D.aviso)}</p>`;
app.appendChild(hero);

const play = el('section');
play.innerHTML = sh('EL PRODUCTO FUNCIONANDO') + `<h2>${esc(D.widget_titulo)}</h2><p class="sec-intro">${md(D.intro)}</p>`;
const steps = el('div', 'steps'); steps.setAttribute('role', 'group'); steps.setAttribute('aria-label', 'Pasos del reto');
const aqui = el('div', 'aqui'); aqui.setAttribute('aria-live', 'polite');
const stage = el('div', 'stage');
play.append(steps, aqui, stage);
app.appendChild(play);
const widget = W[D.widget](stage, D);

function elegir(i){
  const btns = steps.querySelectorAll('.step');
  btns.forEach((b, k) => b.setAttribute('aria-pressed', String(k === i)));
  const panels = stage.querySelectorAll('[data-pieza]');
  if (i < 0) { stage.classList.remove('sel'); panels.forEach(p => p.classList.remove('hl')); aqui.innerHTML = md(D.aqui_todo); return; }
  const p = D.pasos[i];
  stage.classList.add('sel');
  panels.forEach(pn => pn.classList.toggle('hl', pn.dataset.pieza.split(' ').some(x => (p.piezas || []).includes(x))));
  aqui.innerHTML = `<b>Paso ${esc(p.n)} · ${esc(p.titulo)}</b> (${p.min} min). ${md(p.aqui || '')}`;
  const first = stage.querySelector('.pieza.hl'); if (first && first.getBoundingClientRect().top > window.innerHeight * .8) first.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center'});
}
D.pasos.forEach((p, i) => {
  const b = el('button', 'step', `<span class="n">${esc(p.n)}</span><span>${esc(p.corto || p.titulo)}<small>${p.min} min</small></span>`);
  b.type = 'button'; b.setAttribute('aria-pressed', 'false'); b.addEventListener('click', () => elegir(steps.querySelector('.step[aria-pressed="true"]') === b ? -1 : i));
  steps.appendChild(b);
});
elegir(-1);

/* qué se sube y cómo se evalúa */
const fin = el('section');
fin.innerHTML = sh('QUÉ SE SUBE Y CÓMO SE EVALÚA') + `<h2>Lo que entregáis y con qué se puntúa</h2><p class="sec-intro">Todo va al repositorio del equipo, en la carpeta <code>${esc(D.carpeta_entrega)}</code>. La rúbrica es la misma que usáis para revisar vuestro propio trabajo antes de subirlo.</p>`;
const files = el('div', 'files');
D.ficheros.forEach(f => files.appendChild(el('div', 'file', `<b>${esc(f.nombre)}</b><span class="o">${md(f.origen)}</span><span class="s">${esc(f.sube)}</span>`)));
fin.appendChild(files);
const tabs = el('div', 'tabs'); tabs.setAttribute('role', 'tablist');
const lv = el('div', 'levels'); lv.setAttribute('aria-live', 'polite');
const qq = el('p', 'hint'); qq.style.marginBottom = '10px';
const NIV = ['1 · Empezado', '2 · Mínimo', '3 · Estándar', '4 · Extra'];
function criterio(k){
  tabs.querySelectorAll('.tab').forEach((t, j) => t.setAttribute('aria-selected', String(j === k)));
  const c = D.rubrica[k]; qq.textContent = c.pregunta;
  lv.innerHTML = c.niveles.map((t, j) => `<div class="lv${j === 1 ? ' min' : ''}"><h3>${NIV[j]}</h3><p>${md(t)}</p></div>`).join('');
}
D.rubrica.forEach((c, k) => { const t = el('button', 'tab', esc(c.criterio)); t.type = 'button'; t.setAttribute('role', 'tab'); t.addEventListener('click', () => criterio(k)); tabs.appendChild(t); });
fin.append(tabs, qq, lv);
fin.appendChild(el('p', 'hint', 'Orientación: lo que pide el nivel mínimo sale en un <b>2</b>, el estándar en un <b>3</b> y los extras en un <b>4</b>. Sin una frase de prueba escrita, el nivel no vale.'));
criterio(0);
app.appendChild(fin);

const pie = el('footer');
pie.innerHTML = sh('DÓNDE SEGUIR') + `<div class="links">${D.enlaces.map(e => `<a class="btn" href="${esc(e.url)}">${esc(e.t)}</a>`).join('')}</div><p class="foot" style="margin-top:14px">${md(D.pie)}</p>`;
app.appendChild(pie);
})();
</script>
</body>
