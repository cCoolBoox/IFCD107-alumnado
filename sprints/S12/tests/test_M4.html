<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test de M4 · Redes neuronales</title>
<style>
:root{--bg:#f7f7fb;--fg:#1c1c28;--card:#fff;--mut:#5b5b70;--ac:#4f46e5;--ok:#15803d;--ko:#b91c1c;--bd:#d9d9e6}
@media (prefers-color-scheme:dark){:root{--bg:#14141c;--fg:#ececf4;--card:#1e1e2a;--mut:#a3a3b8;--ac:#8b85ff;--ok:#4ade80;--ko:#f87171;--bd:#34344a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}h1{font-size:1.4rem;margin:.2em 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:14px 0}
.mut{color:var(--mut)}.tag{font-size:.8rem;color:var(--ac);font-weight:600}
label.o{display:block;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;margin:6px 0;cursor:pointer}
label.o:hover{border-color:var(--ac)}input[type=radio]{margin-right:8px}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:1rem;cursor:pointer}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
input[type=text]{width:100%;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:1rem}
.ok{border-color:var(--ok)}.ko{border-color:var(--ko)}.res-ok{color:var(--ok);font-weight:600}.res-ko{color:var(--ko);font-weight:600}
.big{font-size:2rem;font-weight:700}
</style></head><body><main>
<h1 id="t"></h1><div id="app"></div>
<script>
const C={"titulo": "Test de M4 · Redes neuronales", "salt": "3267a2e33adf55d5", "qs": [{"id": 1, "tag": "UD 4.1", "q": "¿Qué hace una neurona artificial?", "o": ["Guarda datos en una tabla", "Calcula una suma ponderada de sus entradas y le aplica una función de activación", "Ordena los datos de menor a mayor", "Elige al azar una salida"], "h": "40d86227ec39d0e0d4221feea2af560613119c55a04bd0bfee154f32fef958d4"}, {"id": 2, "tag": "UD 4.1", "q": "¿Por qué hacen falta funciones de activación no lineales?", "o": ["Para que el modelo ocupe menos memoria", "Para evitar usar datos de test", "Sin ellas, aunque apiles capas, la red solo puede representar relaciones lineales", "Para que el entrenamiento sea determinista"], "h": "c4fc7d42ed10c07b32380bd138a060733e37b7bad8bd996452af5e369fd024e5"}, {"id": 3, "tag": "UD 4.2", "q": "¿Qué papel tiene el descenso del gradiente en el entrenamiento?", "o": ["Ajusta los pesos en la dirección que reduce la pérdida", "Divide los datos en train y test", "Elimina las variables irrelevantes", "Descarga el modelo preentrenado"], "h": "ff210b700defcf5c0d7a28cab64ee264592008be717ce595481cc49110a700cc"}, {"id": 4, "tag": "UD 4.3", "q": "Durante el entrenamiento, la pérdida en train baja pero la de validación sube. ¿Qué ocurre?", "o": ["El modelo infraajusta", "La tasa de aprendizaje es cero", "El modelo está perfecto", "Hay sobreajuste: se puede usar early stopping, dropout o regularización"], "h": "0f21c8e8c9cdf7dc2d1d5ad2560f2305970877111b78c38af68a0fefbbeb0cc0"}, {"id": 5, "tag": "UD 4.3", "q": "¿Qué hace la capa Dropout?", "o": ["Apaga al azar una parte de las neuronas durante el entrenamiento para reducir el sobreajuste", "Aumenta el número de épocas", "Convierte imágenes a blanco y negro", "Guarda el modelo en disco"], "h": "d4eef75e7010491713519c140dd9103149c6f534cae2aa17a64b7546a0ed682f"}, {"id": 6, "tag": "UD 4.4", "q": "¿Por qué las CNN funcionan bien con imágenes?", "o": ["Porque ignoran los píxeles", "Porque solo funcionan con texto", "Porque comparten filtros que detectan patrones locales (bordes, texturas) en cualquier parte de la imagen", "Porque no necesitan datos de entrenamiento"], "h": "c41371463ca2649ba5b3d7867161e693614c0f3b8a36ce6072f9d210b38b49c2"}, {"id": 7, "tag": "UD 4.5", "q": "Tienes pocas fotos propias. ¿Qué ofrece el transfer learning?", "o": ["Reutilizar un modelo preentrenado y ajustar solo las últimas capas con tus datos", "Entrenar siempre desde cero", "Eliminar la necesidad de datos etiquetados por completo", "Subir las fotos a internet"], "h": "66cc43b011008a71361ed2d8d5abd8195b84dd39b15377ccd37f2cacaf4d691f"}, {"id": 8, "tag": "UD 4.7", "q": "¿Por qué las LSTM y GRU mejoran a las RNN simples?", "o": ["Porque son más pequeñas", "Porque controlan qué información se recuerda u olvida y sufren menos el desvanecimiento del gradiente en secuencias largas", "Porque no necesitan secuencias", "Porque solo procesan imágenes"], "h": "043b0c24e9a20656c80e9f42aa3a14b2e8af4faac0f0146a5c0622a5c7b01f50"}, {"id": 9, "tag": "UD 4.7", "q": "Vas a validar un modelo de serie temporal (ocupación diaria). ¿Cómo debes dividir los datos?", "o": ["Barajando todas las filas al azar", "Usando solo los datos de test", "Tomando un día de cada tres", "De forma cronológica: entrenas con el pasado y evalúas con el futuro"], "h": "b2d5e654be1f1836a4ef0b209add15ff4c675b7882f7f25587f1365b75b67f20"}, {"id": 10, "tag": "UD 4.8", "q": "¿Qué es un embedding de palabras?", "o": ["Un diccionario ordenado alfabéticamente", "Una traducción automática", "Un vector numérico donde las palabras de significado parecido quedan cercanas", "Un tipo de base de datos"], "h": "6d008b194467cb017de336ac98a959b60ee7885e122223aee3a3a2a9b172b8d9"}, {"id": 11, "tag": "UD 4.9", "q": "¿Qué aporta el mecanismo de atención en un Transformer?", "o": ["Permite que cada palabra se fije en las partes más relevantes del resto del texto", "Reduce el texto a una sola palabra", "Elimina la necesidad de datos de entrenamiento", "Garantiza que la respuesta sea siempre verdadera"], "h": "98cd8291f1ba29fab4e50b21eda6e4064d41c68f5421533d3201dd05feb65830"}, {"id": 12, "tag": "UD 4.9", "q": "¿Qué hace un sistema RAG?", "o": ["Entrena un modelo nuevo cada vez que se le pregunta", "Borra documentos antiguos", "Elimina la necesidad de revisar las respuestas", "Busca fragmentos relevantes en tus documentos y se los da al modelo para que responda apoyándose en ellos"], "h": "91398e358b870c6c27bb86d82bf8a37b3402cc5bc6237d23a7837353c0c604a4"}], "minutos": 20, "sprint": "S12"};
const $=s=>document.querySelector(s);
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const hoy=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Atlantic/Canary'}).format(new Date());
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
$('#t').textContent=C.titulo;
start();
function start(){
 const qs=C.qs.map(q=>({...q,idx:shuffle(q.o.map((_,i)=>i))}));
 let html=`<div class="card"><p class="mut">${C.qs.length} preguntas · unos ${C.minutos} minutos · una respuesta correcta por pregunta. Sin penalización por fallo.</p><label>Tu nombre<input type="text" id="nom" placeholder="Nombre y apellidos" autocomplete="off"></label></div><form id="f">`;
 qs.forEach((q,i)=>{html+=`<div class="card" id="q${i}"><div class="tag">${i+1}${q.tag?' · '+q.tag:''}</div><p><b>${esc(q.q)}</b></p>`+q.idx.map((k,j)=>`<label class="o"><input type="radio" name="q${i}" value="${k}">${esc(q.o[k])}</label>`).join('')+`<div class="r mut"></div></div>`});
 html+=`<button type="submit">Terminar y ver mi nota</button></form><div id="res"></div>`;
 $('#app').innerHTML=html;
 $('#f').onsubmit=async e=>{e.preventDefault();
  const sin=qs.filter((q,i)=>!document.querySelector(`input[name=q${i}]:checked`)).length;
  if(sin&&!confirm(`Te quedan ${sin} sin responder. ¿Terminar igualmente?`))return;
  let ok=0;
  for(let i=0;i<qs.length;i++){const q=qs[i];const sel=document.querySelector(`input[name=q${i}]:checked`);
   let corr=-1;for(let k=0;k<4;k++){if(await sha(`${C.salt}|${q.id}|${q.o[k]}`)===q.h)corr=k}
   const acierto=sel&&+sel.value===corr;if(acierto)ok++;
   const box=$('#q'+i);box.classList.add(acierto?'ok':'ko');
   box.querySelector('.r').innerHTML=acierto?'<span class="res-ok">✔ Correcta</span>':`<span class="res-ko">✘ ${sel?'Incorrecta':'Sin responder'}.</span> Correcta: ${esc(q.o[corr])}`;}
  document.querySelectorAll('input[type=radio]').forEach(x=>x.disabled=true);$('#f button').remove();
  const n=qs.length,p=Math.round(ok/n*100),nom=($('#nom').value||'(sin nombre)').trim();
  const txt=`${nom} · ${C.titulo} · ${ok}/${n} (${p} %) · ${h()}`;
  $('#res').innerHTML=`<div class="card"><p class="big">${ok} / ${n}</p><p>${p>=50?'✅ Apto':'⚠️ Por debajo del 50 %'} (se aprueba con el 50 %).</p><p class="mut">Copia tu resultado y envíaselo al docente:</p><input type="text" readonly value="${esc(txt)}" id="cp"><p><button class="sec" id="cb" type="button">Copiar resultado</button></p></div>`;
  $('#cb').onclick=()=>{$('#cp').select();navigator.clipboard&&navigator.clipboard.writeText(txt);$('#cb').textContent='¡Copiado!'};
  scrollTo({top:document.body.scrollHeight,behavior:'smooth'});};
 function h(){return hoy()}
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
</script></main></body></html>
