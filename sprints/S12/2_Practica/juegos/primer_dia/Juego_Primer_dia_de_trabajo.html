<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primer día de trabajo · IFCD107</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* TEMA ÚNICO de los juegos y del panel (IFCD107). Cambiad aquí colores y tipografías y regenerad:
     python3 herramientas/juegos_comun/regenerar_todo.py
   Identidad: la de las infografías y demos del curso (tinta azulada, óxido, verde azulado, crema). */
:root{
  --bg:#F5F1E8; --card:#FFFFFF; --ink:#1D2433; --mut:#566073; --line:#D9D2C0;
  --ac:#C23B1F; --ac2:#F7DDD4;                 /* acento (botones, enlaces, pieza activa) y su fondo suave */
  --ok:#1B7F4B; --okbg:#D9F0E3;                /* acierto */
  --ko:#B42318; --kobg:#FBE0DC;                /* fallo */
  --mv:#8A5A00; --mvbg:#F6E7C4; --mvl:#D9B85A; /* aviso / «casi» */
  --hint:#F6E7C4; --hintl:#D9B85A;             /* pistas */
  --sky:#DCE6F5; --blue:#3D5F96;               /* apoyo (tablas, etiquetas neutras) */
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12161F; --card:#1B2230; --ink:#F1ECE0; --mut:#A3ADC0; --line:#2E3748;
    --ac:#F08A6C; --ac2:#3A2620;
    --ok:#6FD3A0; --okbg:#173226; --ko:#FF8D78; --kobg:#3A1E1A;
    --mv:#E9C46A; --mvbg:#3A2F14; --mvl:#7A6A28; --hint:#3A2F14; --hintl:#7A6A28;
    --sky:#1F2C44; --blue:#8FB0E6;
  }
}
h1,h2,h3{font-family:var(--f-display)}
code,pre,.mono{font-family:var(--f-mono)}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
main{max-width:860px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:1.7rem;margin:.2em 0 .1em}h2{font-size:1.25rem;margin:.2em 0}
.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
input[type=text]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0;flex:1 1 220px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px}
button:hover:not(:disabled){border-color:var(--ac)}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.room{text-align:left;display:flex;flex-direction:column;gap:2px;padding:14px;min-height:96px}
.room .ic{font-size:1.8rem;line-height:1}
.room b{font-size:1.02rem}
.room small{color:var(--mut)}
.room.done{border-color:var(--ok);background:var(--okbg)}
.room .w{font-weight:700;color:var(--ok);letter-spacing:.08em}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.slot{min-width:84px;text-align:center;padding:8px 10px;border:2px dashed var(--line);border-radius:10px;font-weight:700;letter-spacing:.08em;color:var(--mut)}
.slot.on{border:2px solid var(--ok);color:var(--ok);background:var(--okbg)}
.tag{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:99px;padding:2px 10px;font-size:.82rem;font-weight:600}
.dots{display:flex;gap:6px;margin:10px 0}
.dot{flex:1;height:8px;border-radius:99px;background:var(--line)}.dot.ok{background:var(--ok)}.dot.now{background:var(--ac)}
.q{font-size:1.15rem;font-weight:700;margin:10px 0 6px}
.opts{display:grid;gap:10px;margin:10px 0}
.opt{display:flex;gap:12px;text-align:left;align-items:flex-start;padding:12px 14px;width:100%}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ac2);color:var(--ac);display:grid;place-items:center;font-weight:700}
.opt .t{flex:1}
.opt .why{display:block;margin-top:6px;font-size:.93rem;color:var(--mut)}
.opt.ko{background:var(--kobg);border-color:var(--ko);cursor:default}
.opt.ko .l{background:var(--ko);color:#fff}
.opt.ok{background:var(--okbg);border-color:var(--ok);cursor:default}
.opt.ok .l{background:var(--ok);color:var(--bg)}
.hint{background:var(--hint);border:1px solid var(--hintl);border-radius:10px;padding:8px 12px;margin:8px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:12px}
.pts{font-weight:700}
.ficha li{margin:6px 0}
.big{font-size:1.5rem;font-weight:800;letter-spacing:.06em;text-align:center;padding:14px;color:var(--ok)}
.sit{border-left:4px solid var(--ac);padding-left:12px}
.mut{color:var(--mut)}
@media print{button,input{display:none}.card{break-inside:avoid}}
</style>
</head>

const KEY = "ifcd107_primer_dia_v1";
const LET = "ABCD";
let S = {equipo: "", hechas: {}};
try { const g = localStorage.getItem(KEY); if (g) S = Object.assign(S, JSON.parse(g)); } catch (e) {}
const guardar = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const $app = document.getElementById("app");
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
};
const total = () => Object.values(S.hechas).reduce((a, h) => a + h.pts, 0);
const MAX = D.misiones.length * 5 * 3;
let cur = null;

function portada() {
  cur = null; document.title = "Primer día de trabajo · IFCD107";
  const hechas = Object.keys(S.hechas).length, n = D.misiones.length;

  nom.addEventListener("input", () => { S.equipo = nom.value; guardar(); });

    const m = D.misiones[i], ok = S.hechas[m.id];

    el("h1", {}, "🔑 Primer día de trabajo"),

    el("div", {class: "card"}, el("div", {class: "bar"}, nom, el("span", {class: "pts"}, "Puntos: " + total() + " / " + MAX)),
      el("p", {class: "mut", style: "margin:.6em 0 0"}, "Por paso: 3 puntos a la primera, 2 a la segunda, 1 a la tercera. Pedir pista cuesta 1 punto. Salas libres, en el orden que queráis.")),
    el("h2", {}, "La frase de la puerta (" + hechas + "/" + n + ")"), slots,
    hechas === n ? el("div", {class: "row"}, el("button", {class: "pri", onclick: final}, "🚪 Abrir la puerta")) : "",
    el("h2", {style: "margin-top:18px"}, "Salas"), salas,
    el("div", {class: "row"}, el("span", {class: "mut"}, "El progreso se guarda en este navegador."),
      el("button", {onclick: () => { if (confirm("¿Borrar el progreso y empezar de cero?")) { S = {equipo: S.equipo, hechas: {}}; guardar(); portada(); } }}, "Empezar de cero")));
  window.scrollTo(0, 0);
}

function empezar(i) { cur = {i, paso: 0, tried: [], pista: false, resuelto: false, pts: 0}; document.title = D.misiones[i].titulo + " · IFCD107"; paso(); }

function paso() {
  const m = D.misiones[cur.i], p = m.pasos[cur.paso];
  const dots = el("div", {class: "dots", "aria-label": "Paso " + (cur.paso + 1) + " de 5"}, m.pasos.map((_, k) => el("div", {class: "dot" + (k < cur.paso ? " ok" : k === cur.paso ? " now" : "")})));
  const lista = el("div", {class: "opts"});
  const fb = el("div", {"aria-live": "polite"});
  const ptsEl = el("span", {class: "pts"}, "Puntos: " + (total() + cur.pts));
  const sig = el("button", {class: "pri", disabled: ""}, cur.paso === 4 ? "Terminar sala ▶" : "Siguiente paso ▶");
  sig.addEventListener("click", () => { cur.paso++; cur.tried = []; cur.pista = false; cur.resuelto = false; cur.paso > 4 ? sala() : paso(); });
  const pistaBtn = el("button", {onclick: () => { if (cur.pista || cur.resuelto) return; cur.pista = true; pistaBtn.disabled = true; fb.prepend(el("div", {class: "hint"}, "💡 " + p.pista + " (−1 punto)")); }}, "💡 Pista (−1)");
  p.ops.forEach((o, k) => {
    const b = el("button", {class: "card opt"}, el("span", {class: "l"}, LET[k]), el("span", {class: "t"}, o.t));
    b.addEventListener("click", () => {
      if (cur.resuelto || cur.tried.includes(k)) return;
      if (k === p.ok) {
        cur.resuelto = true; cur.tried.push(k);
        const pts = Math.max(0, 3 - (cur.tried.length - 1) - (cur.pista ? 1 : 0)); cur.pts += pts; ptsEl.textContent = "Puntos: " + (total() + cur.pts);
        b.classList.add("ok"); b.querySelector(".t").append(el("span", {class: "why"}, "✔ " + o.por + "  (+" + pts + ")"));
        lista.querySelectorAll(".opt").forEach(x => { if (!x.classList.contains("ok")) x.classList.add("ko"), x.disabled = true; });
        sig.disabled = false; pistaBtn.disabled = true; sig.focus();
      } else {
        cur.tried.push(k); b.classList.add("ko"); b.disabled = true; b.querySelector(".t").append(el("span", {class: "why"}, "✘ " + o.por));
      }
    });
    lista.append(b);
  });
  $app.replaceChildren(
    el("div", {class: "bar"}, el("button", {onclick: () => { if (confirm("¿Salir de la sala? Se pierde el avance de esta sala.")) portada(); }}, "◀ Mapa"), ptsEl),
    el("h1", {}, m.icono + " " + m.titulo), el("p", {class: "sit"}, m.situacion), dots,
    el("div", {class: "q"}, "Paso " + (cur.paso + 1) + " · " + D.pasos[cur.paso]), lista, fb,
    el("div", {class: "row"}, pistaBtn, sig));
  window.scrollTo(0, 0);
}

function sala() {
  const m = D.misiones[cur.i], palabra = D.palabras[cur.i];
  if (!S.hechas[m.id] || S.hechas[m.id].pts < cur.pts) S.hechas[m.id] = {pts: cur.pts}; guardar();
  const ficha = el("ol", {class: "ficha"}, m.pasos.map((p, k) => el("li", {}, el("b", {}, D.cortos[k] + " — "), p.ops[p.ok].t)));
  const todas = Object.keys(S.hechas).length === D.misiones.length;
  $app.replaceChildren(
    el("h1", {}, "✅ Sala superada: " + m.titulo),
    el("div", {class: "card"}, el("div", {class: "mut"}, "Palabra ganada"), el("div", {class: "big"}, palabra), el("div", {class: "pts", style: "text-align:center"}, cur.pts + " / 15 puntos")),
    el("div", {class: "card"}, el("h2", {}, "Ficha de la solución"), el("p", {class: "mut"}, "Estas son las cinco decisiones correctas. Guardadla: es el patrón que repetiréis en el trabajo."), ficha),
    el("div", {class: "row"}, el("button", {onclick: () => empezar(cur.i)}, "↻ Repetir sala"), el("button", {class: "pri", onclick: todas ? final : portada}, todas ? "🚪 Abrir la puerta" : "Volver al mapa ▶")));
  window.scrollTo(0, 0);
}

function final() {
  const t = total(), pc = Math.round(100 * t / MAX);
  const nivel = pc >= 90 ? "Equipo senior: decisiones casi sin tropiezos." : pc >= 70 ? "Equipo sólido: algún paso os hizo dudar." : "Equipo en formación: repetid las salas con más puntos perdidos.";
  $app.replaceChildren(
    el("h1", {}, "🚪 ¡Puerta abierta!"),
    el("p", {class: "sub"}, (S.equipo ? S.equipo + " · " : "") + t + " / " + MAX + " puntos (" + pc + " %). " + nivel),
    el("div", {class: "card"}, el("div", {class: "mut"}, "La frase de la puerta"), el("div", {class: "big"}, D.palabras.join(" "))),
    el("div", {class: "card"}, el("h2", {}, "Las ocho situaciones"), el("ul", {}, D.misiones.map(m => el("li", {}, m.icono + " " + m.titulo + " → " + m.tipo + " (" + S.hechas[m.id].pts + "/15)")))),
    el("div", {class: "row"}, el("button", {onclick: portada}, "◀ Mapa"), el("button", {class: "pri", onclick: () => window.print()}, "Imprimir o guardar PDF")));
  window.scrollTo(0, 0);
}
portada();
</script>
</body>
</html>
