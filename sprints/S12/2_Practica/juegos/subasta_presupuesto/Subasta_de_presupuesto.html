<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subasta de presupuesto · IFCD107</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* TEMA ÚNICO de los juegos y del panel (IFCD107). Cambiad aquí colores y tipografías y regenerad:
     python3 herramientas/juegos_comun/regenerar_todo.py
   Identidad: la de las infografías y demos del curso (tinta azulada, óxido, verde azulado, crema). */
:root{
  --bg:#F5F1E8; --card:#FFFFFF; --ink:#1D2433; --mut:#566073; --line:#D9D2C0;
  --ac:#C23B1F; --ac2:#F7DDD4;                 /* acento (botones, enlaces, pieza activa) y su fondo suave */
  --ok:#1B7F4B; --okbg:#D9F0E3;                /* acierto */
  --ko:#B42318; --kobg:#FBE0DC;                /* fallo */
  --mv:#8A5A00; --mvbg:#F6E7C4; --mvl:#D9B85A; /* aviso / «casi» */
  --hint:#F6E7C4; --hintl:#D9B85A;             /* pistas */
  --sky:#DCE6F5; --blue:#3D5F96;               /* apoyo (tablas, etiquetas neutras) */
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12161F; --card:#1B2230; --ink:#F1ECE0; --mut:#A3ADC0; --line:#2E3748;
    --ac:#F08A6C; --ac2:#3A2620;
    --ok:#6FD3A0; --okbg:#173226; --ko:#FF8D78; --kobg:#3A1E1A;
    --mv:#E9C46A; --mvbg:#3A2F14; --mvl:#7A6A28; --hint:#3A2F14; --hintl:#7A6A28;
    --sky:#1F2C44; --blue:#8FB0E6;
  }
}
h1,h2,h3{font-family:var(--f-display)}
code,pre,.mono{font-family:var(--f-mono)}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
main{max-width:860px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:1.7rem;margin:.2em 0 .1em}h2{font-size:1.15rem;margin:1em 0 .3em}
.sub,.mut{color:var(--mut)}.sub{margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
input[type=text]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0;flex:1 1 220px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px}
button:hover:not(:disabled){border-color:var(--ac)}button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.room{text-align:left;display:flex;flex-direction:column;gap:2px;padding:12px;min-height:92px;margin:0}
.room .ic{font-size:1.6rem;line-height:1}.room b{font-size:1rem}.room small{color:var(--mut)}
.room.done{border-color:var(--ok);background:var(--okbg)}.room .w{font-weight:700;color:var(--ok)}
.pts{font-weight:700}
.sit{border-left:4px solid var(--ac);padding-left:12px}
.alerta{background:var(--kobg);border:1px solid var(--ko);border-radius:10px;padding:8px 12px;margin:10px 0}
.code{display:grid;gap:4px;margin:8px 0}
.ln{display:grid;grid-template-columns:30px 1fr;gap:8px;text-align:left;font-family:var(--f-mono);font-size:.9rem;padding:8px 10px;border-radius:8px;width:100%}
.ln .n{color:var(--mut)}
.ln.ko{background:var(--kobg);border-color:var(--ko)}.ln.ok{background:var(--okbg);border-color:var(--ok)}
.ln .why{display:block;font-family:var(--f-body);color:var(--mut);margin-top:3px}
.opts{display:grid;gap:10px;margin:10px 0}
.opt{display:flex;gap:12px;text-align:left;align-items:flex-start;padding:12px 14px;width:100%}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ac2);color:var(--ac);display:grid;place-items:center;font-weight:700}
.opt .t{flex:1}.opt .why{display:block;margin-top:6px;font-size:.93rem;color:var(--mut)}
.opt.ko{background:var(--kobg);border-color:var(--ko);cursor:default}.opt.ko .l{background:var(--ko);color:#fff}
.opt.ok{background:var(--okbg);border-color:var(--ok);cursor:default}.opt.ok .l{background:var(--ok);color:var(--bg)}
.hint{background:var(--hint);border:1px solid var(--hintl);border-radius:10px;padding:8px 12px;margin:8px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:12px}
.big{font-size:1.5rem;font-weight:800;text-align:center;padding:10px;color:var(--ok)}
.ficha li{margin:6px 0}
@media print{button,input{display:none}.card{break-inside:avoid}}

.bud{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line)}
.bud .barra{height:14px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bud .barra i{display:block;height:100%;background:var(--ok);transition:width .2s}
.bud.pasa .barra i{background:var(--ko)}
.piezas{display:grid;gap:8px;margin:12px 0}
.pz{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;text-align:left;width:100%;padding:10px 12px;margin:0}
.pz .cb{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:#fff}
.pz[aria-pressed=true]{border-color:var(--ac);background:var(--ac2)}
.pz[aria-pressed=true] .cb{background:var(--ac);border-color:var(--ac)}
.pz .nums{text-align:right;font-family:var(--f-mono);font-size:.85rem;white-space:nowrap}
.pz .req{display:inline-block;font-size:.72rem;font-weight:700;color:var(--blue);background:var(--sky);border-radius:99px;padding:1px 8px;margin-left:6px}
.pz.ok{border-color:var(--ok);background:var(--okbg)}.pz.ko{border-color:var(--ko);background:var(--kobg)}.pz.opt{border-style:dashed}
.pz .por{display:block;color:var(--mut);font-size:.9rem;margin-top:3px}

</style>
</head>

    el("div", {class: "bar"}, el("button", {onclick: () => { if (confirm("¿Salir del proyecto?")) portada(); }}, "◀ Proyectos"), el("span", {class: "pts"}, "Puntos: " + total())),
    el("h1", {}, c.icono + " " + c.titulo), el("p", {class: "sit"}, c.escenario),
    el("p", {class: "mut"}, "Pulsad las piezas que contratáis. Ojo: algunas parecen baratas y útiles… y estropean el trabajo."), bud, lista, aviso, el("div", {class: "row"}, el("span", {class: "mut"}, "Intentos inválidos: " + cur.fallos), pres));
  if (aviso) aviso.scrollIntoView({block: "nearest"});
}

function presentar() {
  const c = D.escenarios[cur.i], msgs = [], H = horas();
  const faltan = c.piezas.filter((p, k) => p.rol === "req" && !cur.sel.has(k));
  const malas = c.piezas.filter((p, k) => p.rol === "mal" && cur.sel.has(k));
  if (H > c.presupuesto) msgs.push("Os pasáis " + (H - c.presupuesto) + " horas de presupuesto.");
  faltan.forEach(p => msgs.push("Falta una pieza imprescindible: «" + p.t + "». " + p.por));
  malas.forEach(p => msgs.push("«" + p.t + "» invalida el trabajo. " + p.por));
  if (msgs.length) { cur.fallos++; vista(msgs); return; }
  cur.fin = true;
  const v = valor(), ratio = v / c.optimo.valor;
  const base = ratio >= 1 ? 10 : ratio >= 0.85 ? 7 : ratio >= 0.7 ? 5 : 3, pts = Math.max(1, base - cur.fallos);
  if (!S.hechas[c.id] || S.hechas[c.id].pts < pts) S.hechas[c.id] = {pts}; guardar();
  const sig = D.escenarios.findIndex((x, i) => i > cur.i && !S.hechas[x.id]), hechas = Object.keys(S.hechas).length;
  const opt = new Set(c.optimo.piezas);
  const fila = (p, k) => {
    const elegida = cur.sel.has(k), enOpt = opt.has(k), req = p.rol === "req", mal = p.rol === "mal";
    const cls = req ? "ok" : mal ? "" : (elegida && enOpt) ? "ok" : (elegida && !enOpt) ? "ko" : enOpt ? "opt" : "";
    const marca = req ? "imprescindible" : mal ? "trampa: no se contrata" : elegida && enOpt ? "elegida · en el mejor reparto" : elegida ? "elegida · no está en el mejor reparto" : enOpt ? "no elegida · sí está en el mejor reparto" : "no elegida";
    return el("div", {class: "card pz " + cls, style: "cursor:default"}, el("span", {class: "cb", style: "background:transparent;border:0;color:var(--ink)"}, elegida ? "✓" : ""), el("span", {}, p.t, el("span", {class: "por"}, marca + " — " + p.por)), el("span", {class: "nums"}, p.h + " h", el("br"), req ? "base" : "+" + p.v));
  };
  $app.replaceChildren(
    el("h1", {}, "✅ Propuesta aceptada: " + c.titulo),
    el("div", {class: "card"}, el("div", {class: "big"}, pts + " / 10 puntos"),
      el("p", {style: "text-align:center;margin:0"}, "Valor logrado: " + v + " de " + c.optimo.valor + " posibles (" + Math.round(100 * ratio) + " %) en " + H + " de " + c.presupuesto + " horas."),
      el("p", {class: "mut", style: "text-align:center;margin:.3em 0 0"}, ratio >= 1 ? "El mejor reparto posible." : "Hay un reparto mejor: mirad las piezas con borde discontinuo.")),
    el("div", {class: "piezas"}, c.piezas.map(fila)),
    el("div", {class: "row"}, el("button", {onclick: () => empezar(cur.i)}, "↻ Repetir"), el("button", {onclick: portada}, "Proyectos"),
      hechas === N ? el("button", {class: "pri", onclick: final}, "🏁 Ver el resumen") : sig >= 0 ? el("button", {class: "pri", onclick: () => empezar(sig)}, "Siguiente proyecto ▶") : null));
  window.scrollTo(0, 0);
}

function final() {
  const t = total(), pc = Math.round(100 * t / MAX);
  $app.replaceChildren(
    el("h1", {}, "🏁 Subastas cerradas"),
    el("p", {class: "sub"}, (S.equipo ? S.equipo + " · " : "") + t + " / " + MAX + " puntos (" + pc + " %)."),
    el("div", {class: "card"}, el("h2", {style: "margin-top:0"}, "Lo que se repite en los cinco proyectos"),
      el("ol", {}, ["Lo imprescindible va siempre: separar los datos y medir un rival simple.", "Lo que «no cuesta nada» pero usa la prueba para decidir sale carísimo.", "Primero lo que decide el coste (umbral, matriz de confusión); después, más datos o más modelos.", "Un presupuesto no se gasta entero por gastarlo: se gasta donde más valor da."].map(x => el("li", {}, x)))),
    el("div", {class: "row"}, el("button", {onclick: portada}, "◀ Proyectos"), el("button", {class: "pri", onclick: () => window.print()}, "Imprimir o guardar PDF")));
  window.scrollTo(0, 0);
}
portada();

</script>
