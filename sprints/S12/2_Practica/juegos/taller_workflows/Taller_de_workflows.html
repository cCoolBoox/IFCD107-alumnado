<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taller de workflows · IFCD107</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* TEMA ÚNICO de los juegos y del panel (IFCD107). Cambiad aquí colores y tipografías y regenerad:
     python3 herramientas/juegos_comun/regenerar_todo.py
   Identidad: la de las infografías y demos del curso (tinta azulada, óxido, verde azulado, crema). */
:root{
  --bg:#F5F1E8; --card:#FFFFFF; --ink:#1D2433; --mut:#566073; --line:#D9D2C0;
  --ac:#C23B1F; --ac2:#F7DDD4;                 /* acento (botones, enlaces, pieza activa) y su fondo suave */
  --ok:#1B7F4B; --okbg:#D9F0E3;                /* acierto */
  --ko:#B42318; --kobg:#FBE0DC;                /* fallo */
  --mv:#8A5A00; --mvbg:#F6E7C4; --mvl:#D9B85A; /* aviso / «casi» */
  --hint:#F6E7C4; --hintl:#D9B85A;             /* pistas */
  --sky:#DCE6F5; --blue:#3D5F96;               /* apoyo (tablas, etiquetas neutras) */
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12161F; --card:#1B2230; --ink:#F1ECE0; --mut:#A3ADC0; --line:#2E3748;
    --ac:#F08A6C; --ac2:#3A2620;
    --ok:#6FD3A0; --okbg:#173226; --ko:#FF8D78; --kobg:#3A1E1A;
    --mv:#E9C46A; --mvbg:#3A2F14; --mvl:#7A6A28; --hint:#3A2F14; --hintl:#7A6A28;
    --sky:#1F2C44; --blue:#8FB0E6;
  }
}
h1,h2,h3{font-family:var(--f-display)}
code,pre,.mono{font-family:var(--f-mono)}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
main{max-width:860px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:1.7rem;margin:.2em 0 .1em}h2{font-size:1.2rem;margin:.9em 0 .3em}
.sub{color:var(--mut);margin:0 0 16px}.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
input[type=text]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0;flex:1 1 220px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px}
button:hover:not(:disabled){border-color:var(--ac)}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.room{text-align:left;display:flex;flex-direction:column;gap:2px;padding:12px;min-height:92px;margin:0}
.room .ic{font-size:1.6rem;line-height:1}.room b{font-size:1rem}.room small{color:var(--mut)}
.room.done{border-color:var(--ok);background:var(--okbg)}.room .w{font-weight:700;color:var(--ok)}
.tag{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:99px;padding:2px 10px;font-size:.82rem;font-weight:600}
.pts{font-weight:700}
.sit{border-left:4px solid var(--ac);padding-left:12px}
.board{list-style:none;margin:10px 0;padding:0;display:grid;gap:6px}
.slot{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;border:2px dashed var(--line);border-radius:12px;padding:8px 10px;min-height:52px;background:var(--card)}
.slot .n{width:28px;height:28px;border-radius:50%;background:var(--ac2);color:var(--ac);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.slot.full{border-style:solid;border-color:var(--ac)}
.slot.ok{border-color:var(--ok);background:var(--okbg)}.slot.ok .n{background:var(--ok);color:var(--bg)}
.slot.mov{border-color:var(--mvl);background:var(--mvbg)}.slot.mov .n{background:var(--mv);color:var(--bg)}
.slot.ko{border-color:var(--ko);background:var(--kobg)}.slot.ko .n{background:var(--ko);color:#fff}
.slot .ph{color:var(--mut);font-style:italic}
.slot .why{display:block;font-size:.9rem;color:var(--mut);margin-top:4px}
.ctl{display:flex;gap:4px}.ctl button{padding:4px 9px;border-radius:8px}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{text-align:left;border-radius:10px;border:1px solid var(--ac);background:var(--ac2);padding:8px 12px;max-width:100%}
.chip:hover:not(:disabled){background:var(--card)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:12px}
.msg{margin:8px 0;font-weight:600}
.flow{list-style:none;margin:0;padding:0}
.flow li{position:relative;padding:8px 10px 8px 40px;border-left:3px solid var(--ok);margin-left:12px}
.flow li::before{content:attr(data-n);position:absolute;left:-14px;top:8px;width:26px;height:26px;border-radius:50%;background:var(--ok);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.flow b{display:block}.flow span{color:var(--mut);font-size:.93rem}
.trap{margin:6px 0}.trap b{color:var(--ko)}
.big{font-size:1.5rem;font-weight:800;text-align:center;padding:10px;color:var(--ok)}
@media print{button,input{display:none}.card{break-inside:avoid}}
</style>
</head>

function empezar(i) {

function comprobarYa() {

function final() {
  const t = total(), pc = Math.round(100 * t / MAX);
  const nivel = pc >= 90 ? "Equipo senior: workflows casi a la primera." : pc >= 70 ? "Equipo sólido: algunos workflows os hicieron dudar." : "Equipo en formación: repetid los puzzles con menos puntos.";
  const lista = Object.keys(D.bloques).map(b => [el("h2", {}, D.bloques[b]), el("ul", {}, D.puzzles.filter(p => p.bloque === b).map(p => el("li", {}, p.icono + " " + p.modelo + " (" + S.hechas[p.id].pts + "/5)")))]);
  $app.replaceChildren(
    el("h1", {}, "🏁 Taller completo"),
    el("p", {class: "sub"}, (S.equipo ? S.equipo + " · " : "") + t + " / " + MAX + " puntos (" + pc + " %). " + nivel),
    el("div", {class: "card"}, el("div", {class: "mut"}, "Lo que se repite en todos los workflows"),
      el("ol", {}, ["Separar antes de tocar nada", "Ajustar escalados y vocabularios solo con el entrenamiento", "Elegir con la validación (y compararse con un rival simple)", "Mirar la prueba una sola vez", "Contar con cifra, un gráfico honesto y un límite"].map(x => el("li", {}, x)))),
    ...lista.flat(),
    el("div", {class: "row"}, el("button", {onclick: portada}, "◀ Mapa"), el("button", {class: "pri", onclick: () => window.print()}, "Imprimir o guardar PDF")));
  window.scrollTo(0, 0);
}
portada();
</script>
