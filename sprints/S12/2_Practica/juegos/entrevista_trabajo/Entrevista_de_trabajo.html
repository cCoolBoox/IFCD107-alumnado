<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrevista de trabajo · IFCD107</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* TEMA ÚNICO de los juegos y del panel (IFCD107). Cambiad aquí colores y tipografías y regenerad:
     python3 herramientas/juegos_comun/regenerar_todo.py
   Identidad: la de las infografías y demos del curso (tinta azulada, óxido, verde azulado, crema). */
:root{
  --bg:#F5F1E8; --card:#FFFFFF; --ink:#1D2433; --mut:#566073; --line:#D9D2C0;
  --ac:#C23B1F; --ac2:#F7DDD4;                 /* acento (botones, enlaces, pieza activa) y su fondo suave */
  --ok:#1B7F4B; --okbg:#D9F0E3;                /* acierto */
  --ko:#B42318; --kobg:#FBE0DC;                /* fallo */
  --mv:#8A5A00; --mvbg:#F6E7C4; --mvl:#D9B85A; /* aviso / «casi» */
  --hint:#F6E7C4; --hintl:#D9B85A;             /* pistas */
  --sky:#DCE6F5; --blue:#3D5F96;               /* apoyo (tablas, etiquetas neutras) */
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12161F; --card:#1B2230; --ink:#F1ECE0; --mut:#A3ADC0; --line:#2E3748;
    --ac:#F08A6C; --ac2:#3A2620;
    --ok:#6FD3A0; --okbg:#173226; --ko:#FF8D78; --kobg:#3A1E1A;
    --mv:#E9C46A; --mvbg:#3A2F14; --mvl:#7A6A28; --hint:#3A2F14; --hintl:#7A6A28;
    --sky:#1F2C44; --blue:#8FB0E6;
  }
}
h1,h2,h3{font-family:var(--f-display)}
code,pre,.mono{font-family:var(--f-mono)}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
main{max-width:860px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:1.7rem;margin:.2em 0 .1em}h2{font-size:1.15rem;margin:1em 0 .3em}
.sub,.mut{color:var(--mut)}.sub{margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
input[type=text]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0;flex:1 1 220px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px}
button:hover:not(:disabled){border-color:var(--ac)}button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.room{text-align:left;display:flex;flex-direction:column;gap:2px;padding:12px;min-height:92px;margin:0}
.room .ic{font-size:1.6rem;line-height:1}.room b{font-size:1rem}.room small{color:var(--mut)}
.room.done{border-color:var(--ok);background:var(--okbg)}.room .w{font-weight:700;color:var(--ok)}
.pts{font-weight:700}
.sit{border-left:4px solid var(--ac);padding-left:12px}
.alerta{background:var(--kobg);border:1px solid var(--ko);border-radius:10px;padding:8px 12px;margin:10px 0}
.code{display:grid;gap:4px;margin:8px 0}
.ln{display:grid;grid-template-columns:30px 1fr;gap:8px;text-align:left;font-family:var(--f-mono);font-size:.9rem;padding:8px 10px;border-radius:8px;width:100%}
.ln .n{color:var(--mut)}
.ln.ko{background:var(--kobg);border-color:var(--ko)}.ln.ok{background:var(--okbg);border-color:var(--ok)}
.ln .why{display:block;font-family:var(--f-body);color:var(--mut);margin-top:3px}
.opts{display:grid;gap:10px;margin:10px 0}
.opt{display:flex;gap:12px;text-align:left;align-items:flex-start;padding:12px 14px;width:100%}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ac2);color:var(--ac);display:grid;place-items:center;font-weight:700}
.opt .t{flex:1}.opt .why{display:block;margin-top:6px;font-size:.93rem;color:var(--mut)}
.opt.ko{background:var(--kobg);border-color:var(--ko);cursor:default}.opt.ko .l{background:var(--ko);color:#fff}
.opt.ok{background:var(--okbg);border-color:var(--ok);cursor:default}.opt.ok .l{background:var(--ok);color:var(--bg)}
.hint{background:var(--hint);border:1px solid var(--hintl);border-radius:10px;padding:8px 12px;margin:8px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:12px}
.big{font-size:1.5rem;font-weight:800;text-align:center;padding:10px;color:var(--ok)}
.ficha li{margin:6px 0}
@media print{button,input{display:none}.card{break-inside:avoid}}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border-radius:99px;padding:6px 14px;font-size:.93rem}
.chip[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff}
.tarj{border:2px solid var(--ac);border-radius:18px;padding:20px;background:var(--card);margin:12px 0}
.tarj .cat{font-family:var(--f-mono);font-size:.82rem;color:var(--ac);text-transform:uppercase;letter-spacing:.04em}
.tarj .q{font-size:1.35rem;font-weight:700;margin:.4em 0;font-family:var(--f-display);line-height:1.3}
.crono{display:flex;gap:10px;align-items:center;margin:10px 0}
.crono .t{font-family:var(--f-mono);font-size:1.6rem;font-weight:700;min-width:3.2ch}
.crono .b{flex:1;height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.crono .b i{display:block;height:100%;background:var(--ac);width:100%}
.crono.fin .t{color:var(--ko)}
.clave{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:var(--okbg);border-left:4px solid var(--ok)}
.clave ol{margin:.3em 0 0;padding-left:1.2em}.clave li{margin:4px 0}
.nota{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.nota button{min-width:56px;font-weight:700}
.todas{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:12px 0}
.todas .tarj{margin:0;break-inside:avoid;padding:12px}
.todas .tarj .q{font-size:1rem}
@media (max-width:620px){.todas{grid-template-columns:1fr}}
@media print{.noprint{display:none!important}.todas{gap:8px}.tarj{border:1px solid #000}}

</style>

  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
};

  const flojas = D.tarjetas.filter(x => S.hechas[x.id] !== undefined && S.hechas[x.id] < 2);
  $app.replaceChildren(
    el("h1", {}, "🏁 Resumen de entrevistas"),
    el("p", {class: "sub"}, (S.equipo ? S.equipo + " · " : "") + t + " puntos en " + hechas + " tarjetas (máximo " + hechas * 3 + ")."),
    flojas.length ? el("div", {class: "card"}, el("h2", {style: "margin-top:0"}, "Para repasar antes de una entrevista de verdad"), el("ul", {}, flojas.map(x => el("li", {}, x.pregunta)))) : el("div", {class: "card"}, "No hay tarjetas flojas: nombrasteis casi todos los puntos clave."),
    el("div", {class: "row"}, el("button", {onclick: portada}, "◀ Tarjetas"), el("button", {class: "pri", onclick: () => window.print()}, "Imprimir o guardar PDF")));
  window.scrollTo(0, 0);
}
portada();

</script>
</body>
</html>
