<html lang="es">

<title>Memorama de modelos · IFCD107</title>

<style>
/* TEMA ÚNICO de los juegos y del panel (IFCD107). Cambiad aquí colores y tipografías y regenerad:
     python3 herramientas/juegos_comun/regenerar_todo.py
   Identidad: la de las infografías y demos del curso (tinta azulada, óxido, verde azulado, crema). */
:root{
  --bg:#F5F1E8; --card:#FFFFFF; --ink:#1D2433; --mut:#566073; --line:#D9D2C0;
  --ac:#C23B1F; --ac2:#F7DDD4;                 /* acento (botones, enlaces, pieza activa) y su fondo suave */
  --ok:#1B7F4B; --okbg:#D9F0E3;                /* acierto */
  --ko:#B42318; --kobg:#FBE0DC;                /* fallo */
  --mv:#8A5A00; --mvbg:#F6E7C4; --mvl:#D9B85A; /* aviso / «casi» */
  --hint:#F6E7C4; --hintl:#D9B85A;             /* pistas */
  --sky:#DCE6F5; --blue:#3D5F96;               /* apoyo (tablas, etiquetas neutras) */
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12161F; --card:#1B2230; --ink:#F1ECE0; --mut:#A3ADC0; --line:#2E3748;
    --ac:#F08A6C; --ac2:#3A2620;
    --ok:#6FD3A0; --okbg:#173226; --ko:#FF8D78; --kobg:#3A1E1A;
    --mv:#E9C46A; --mvbg:#3A2F14; --mvl:#7A6A28; --hint:#3A2F14; --hintl:#7A6A28;
    --sky:#1F2C44; --blue:#8FB0E6;
  }
}
h1,h2,h3{font-family:var(--f-display)}
code,pre,.mono{font-family:var(--f-mono)}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
main{max-width:860px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:1.7rem;margin:.2em 0 .1em}h2{font-size:1.15rem;margin:1em 0 .3em}
.sub,.mut{color:var(--mut)}.sub{margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
input[type=text]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0;flex:1 1 220px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px}
button:hover:not(:disabled){border-color:var(--ac)}button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.room{text-align:left;display:flex;flex-direction:column;gap:2px;padding:12px;min-height:92px;margin:0}
.room .ic{font-size:1.6rem;line-height:1}.room b{font-size:1rem}.room small{color:var(--mut)}
.room.done{border-color:var(--ok);background:var(--okbg)}.room .w{font-weight:700;color:var(--ok)}
.pts{font-weight:700}
.sit{border-left:4px solid var(--ac);padding-left:12px}
.alerta{background:var(--kobg);border:1px solid var(--ko);border-radius:10px;padding:8px 12px;margin:10px 0}
.code{display:grid;gap:4px;margin:8px 0}
.ln{display:grid;grid-template-columns:30px 1fr;gap:8px;text-align:left;font-family:var(--f-mono);font-size:.9rem;padding:8px 10px;border-radius:8px;width:100%}
.ln .n{color:var(--mut)}
.ln.ko{background:var(--kobg);border-color:var(--ko)}.ln.ok{background:var(--okbg);border-color:var(--ok)}
.ln .why{display:block;font-family:var(--f-body);color:var(--mut);margin-top:3px}
.opts{display:grid;gap:10px;margin:10px 0}
.opt{display:flex;gap:12px;text-align:left;align-items:flex-start;padding:12px 14px;width:100%}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ac2);color:var(--ac);display:grid;place-items:center;font-weight:700}
.opt .t{flex:1}.opt .why{display:block;margin-top:6px;font-size:.93rem;color:var(--mut)}
.opt.ko{background:var(--kobg);border-color:var(--ko);cursor:default}.opt.ko .l{background:var(--ko);color:#fff}
.opt.ok{background:var(--okbg);border-color:var(--ok);cursor:default}.opt.ok .l{background:var(--ok);color:var(--bg)}
.hint{background:var(--hint);border:1px solid var(--hintl);border-radius:10px;padding:8px 12px;margin:8px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:12px}
.big{font-size:1.5rem;font-weight:800;text-align:center;padding:10px;color:var(--ok)}
.ficha li{margin:6px 0}
@media print{button,input{display:none}.card{break-inside:avoid}}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.carta{min-height:112px;padding:10px;text-align:center;display:flex;align-items:center;justify-content:center;font-size:.92rem;line-height:1.3;margin:0}
.carta.cerrada{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-size:1.8rem;font-weight:800;font-family:var(--f-display)}
.carta.m{background:var(--sky);border-color:var(--blue);font-weight:700}
.carta.s{background:var(--card)}
.carta.ok{background:var(--okbg);border-color:var(--ok);cursor:default}
.carta.sel{outline:3px solid var(--ac);outline-offset:2px}
.hall{margin:8px 0;padding:10px 12px;border-left:4px solid var(--ok);background:var(--okbg);border-radius:8px}
.hall .sp{font-family:var(--f-mono);font-size:.8rem;color:var(--mut)}

</style>

  cur = null; document.title = "Memorama de modelos · IFCD107";
  const hechas = Object.keys(S.hechas).length;
  const nom = el("input", {type: "text", maxlength: "40", placeholder: "Nombre del equipo", "aria-label": "Nombre del equipo", value: S.equipo});
  nom.addEventListener("input", () => { S.equipo = nom.value; guardar(); });
  $app.replaceChildren(
    el("h1", {}, "🃏 Memorama de modelos"),
    el("p", {class: "sub"}, "Cada modelo del curso tiene su pareja: la situación en la que se usa. Destapad dos cartas por turno; si son pareja, se quedan. Tres rondas de 8 parejas."),
    el("div", {class: "card"}, el("div", {class: "bar"}, nom, el("span", {class: "pts"}, "Puntos: " + total() + " / " + MAX + " · " + hechas + "/" + N)),
      el("p", {class: "mut", style: "margin:.6em 0 0"}, "Cada ronda da 8 puntos si no falláis; cada 2 fallos restan 1 (mínimo 1). Las cartas se barajan cada vez.")),
    el("div", {class: "grid"}, D.rondas.map((r, i) => {
      const h = S.hechas[i];
      return el("button", {class: "card room" + (h ? " done" : ""), onclick: () => empezar(i)}, el("span", {class: "ic"}, ["🧮", "🧭", "🧠"][i]), el("b", {}, "Ronda " + (i + 1) + " · " + r.titulo), el("small", {}, r.pares.length + " parejas"), h ? el("span", {class: "w"}, "✔ " + h.pts + "/8") : null);
    })),
    el("div", {class: "row"}, el("span", {class: "mut"}, "El progreso se guarda en este navegador."),
      el("button", {onclick: () => { if (confirm("¿Borrar el progreso y empezar de cero?")) { S = {equipo: S.equipo, hechas: {}}; guardar(); portada(); } }}, "Empezar de cero")));
  window.scrollTo(0, 0);
}

function empezar(i) {
  const r = D.rondas[i];
  const cartas = barajar(r.pares.flatMap(p => [{id: p.id, tipo: "m", t: p.modelo}, {id: p.id, tipo: "s", t: p.cuando}]));
  cur = {i, cartas, abiertas: [], hechas: new Set(), intentos: 0};
  bloqueo = false; document.title = "Ronda " + (i + 1) + " · IFCD107"; tablero();
}

function tablero() {
  const r = D.rondas[cur.i], falladas = cur.intentos - cur.hechas.size;
  const cont = el("div", {class: "cards"});
  const pintar = () => {
    cont.replaceChildren(...cur.cartas.map((c, k) => {
      const visible = cur.abiertas.includes(k) || cur.hechas.has(c.id);
      const b = el("button", {class: "card carta " + (cur.hechas.has(c.id) ? "ok " : "") + (visible ? c.tipo : "cerrada") + (cur.abiertas.includes(k) ? " sel" : ""), "aria-label": visible ? (c.tipo === "m" ? "Modelo: " : "Situación: ") + c.t : "Carta " + (k + 1) + ", boca abajo", onclick: () => voltear(k)}, visible ? c.t : "?");
      if (cur.hechas.has(c.id)) b.setAttribute("disabled", "");
      return b;
    }));
  };
  const info = el("div", {class: "bar"}, el("button", {onclick: () => { if (confirm("¿Salir de la ronda?")) portada(); }}, "◀ Rondas"), el("span", {class: "pts"}, ""));
  const marcador = () => { info.lastChild.textContent = "Parejas: " + cur.hechas.size + "/" + r.pares.length + " · Intentos: " + cur.intentos; };
  const voltear = k => {
    if (bloqueo || cur.abiertas.includes(k) || cur.hechas.has(cur.cartas[k].id)) return;
    cur.abiertas.push(k); pintar();
    if (cur.abiertas.length === 2) {
      cur.intentos++;
      const [a, b] = cur.abiertas.map(x => cur.cartas[x]);
      if (a.id === b.id && a.tipo !== b.tipo) { cur.hechas.add(a.id); cur.abiertas = []; pintar(); marcador(); if (cur.hechas.size === r.pares.length) setTimeout(cierre, 700); }
      else { bloqueo = true; marcador(); setTimeout(() => { cur.abiertas = []; bloqueo = false; pintar(); }, 1200); }
    }
  };
  pintar(); marcador();
  $app.replaceChildren(info, el("h1", {}, "Ronda " + (cur.i + 1) + " · " + r.titulo), el("p", {class: "sub"}, "Une cada modelo con la situación que lo pide."), cont,
    el("p", {class: "mut", "aria-live": "polite"}, "Cada pareja encontrada enseña dónde se vio y su error típico al terminar la ronda."));
  window.scrollTo(0, 0);
}

function cierre() {
  const r = D.rondas[cur.i], fallos = cur.intentos - r.pares.length, pts = Math.max(1, 8 - Math.floor(fallos / 2));
  if (!S.hechas[cur.i] || S.hechas[cur.i].pts < pts) S.hechas[cur.i] = {pts}; guardar();
  const sig = D.rondas.findIndex((x, i) => i > cur.i && !S.hechas[i]), hechas = Object.keys(S.hechas).length;
  $app.replaceChildren(
    el("h1", {}, "✅ Ronda " + (cur.i + 1) + " completada"),
    el("div", {class: "card"}, el("div", {class: "big"}, pts + " / 8 puntos"), el("p", {class: "mut", style: "text-align:center;margin:0"}, cur.intentos + " intentos para " + r.pares.length + " parejas (" + fallos + " fallos)")),
    el("h2", {}, "Vuestro chuletario de la ronda"),
    ...r.pares.map(p => el("div", {class: "hall"}, el("b", {}, p.modelo), " ", el("span", {class: "sp"}, p.sprint), el("div", {}, p.cuando), el("div", {class: "mut"}, "Ojo: " + p.ojo.replace(/^Ojo: /, "")))),
    el("div", {class: "row"}, el("button", {onclick: () => empezar(cur.i)}, "↻ Repetir"), el("button", {onclick: portada}, "Rondas"),
      hechas === N ? el("button", {class: "pri", onclick: final}, "🏁 Ver el resumen") : sig >= 0 ? el("button", {class: "pri", onclick: () => empezar(sig)}, "Siguiente ronda ▶") : null));
  window.scrollTo(0, 0);
}

function final() {
  const t = total(), pc = Math.round(100 * t / MAX);
  $app.replaceChildren(
    el("h1", {}, "🏁 Memorama completado"),
    el("p", {class: "sub"}, (S.equipo ? S.equipo + " · " : "") + t + " / " + MAX + " puntos (" + pc + " %). " + (pc >= 85 ? "Os sabéis el mapa de modelos." : "Repetid las rondas con menos puntos: el mapa se aprende jugando.")),
    el("div", {class: "card"}, el("p", {style: "margin:0"}, "Tarea de cierre: elegid 3 parejas y contad a otro equipo, sin mirar las cartas, un caso real de TurisData donde usaríais ese modelo y cuál sería su error típico.")),
    el("div", {class: "row"}, el("button", {onclick: portada}, "◀ Rondas"), el("button", {class: "pri", onclick: () => window.print()}, "Imprimir o guardar PDF")));
  window.scrollTo(0, 0);
}
portada();

</script>
</body>
