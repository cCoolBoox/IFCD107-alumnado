*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;

p{margin:0}
code{font-family:var(--f-mono);font-size:.86em;background:var(--code-bg);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}

.btn.on{background:var(--ink);color:var(--bg)}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sh .st{font-family:var(--f-display);font-weight:800;font-size:14px;color:var(--accent);letter-spacing:.12em;white-space:nowrap}

.step[aria-pressed="true"] small{color:var(--bg);opacity:.8}

.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-weight:700;font-size:14.5px}

@media (max-width:900px){.levels{grid-template-columns:1fr 1fr}}

.lv{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 13px;font-size:14px}

.lv.min{border-color:var(--teal)} .lv.min h3{color:var(--teal)}
.links{display:flex;flex-wrap:wrap;gap:10px}

<script>
const DEMO = {"kicker":"IFCD107 · SPRINT 10 · DEMO DEL RETO","titulo":"¿Vale la pena la red?","lead":"La dirección de TurisData oye hablar de redes neuronales en todas partes y pregunta si debe sustituir su modelo de cancelaciones por una red.","aviso":"Es una demo para entender adónde vamos: **no se entrega nada desde aquí**. Usa las 6000 reservas del curso (sintéticas, TurisData no existe) y redes entrenadas de verdad con la receta del cuaderno, pero escritas en NumPy y no en Keras, así que vuestras cifras serán algo distintas (y vuestros tiempos, también).","widget":"curvas","widget_titulo":"¿Vale la pena la red? Curvas, variantes y un veredicto honesto","intro":"Esto es lo que tendréis al acabar el reto. **Tocad los mandos:** cambiad las neuronas, el dropout y el L2, arrastrad la época de parada hasta ver el sobreajuste y cómo lo corta la parada temprana, añadid variantes a la tabla, mirad la prueba (solo una vez) y leed el veredicto. Después, elegid un paso para ver qué pieza construís en él.","aqui_todo":"Elegid un paso del reto y se ilumina **la pieza que construís en él**. Pulsad otra vez el mismo paso para verlo todo.","pasos":[{"n":"1","titulo":"Elegir el problema y reproducir la referencia","corto":"Referencia","min":15,"piezas":["referencia"],"aqui":"Aquí repartís las reservas en entrenamiento, validación y prueba, escribís `evaluar` y entrenáis el boosting: tenéis su AUC y su tiempo para comparar."},{"n":"2","titulo":"Primera red","corto":"Primera red","min":25,"piezas":["curvas"],"aqui":"Aquí entrenáis el MLP (40 épocas como máximo, con parada temprana) y dibujáis su curva de aprendizaje; el ejercicio 2 saca el AUC de cada semilla."},{"n":"3","titulo":"Variantes","corto":"Variantes","min":25,"piezas":["curvas","variantes"],"aqui":"Aquí cambiáis un ajuste cada vez (neuronas, dropout, L2), apuntáis cada receta en la tabla y elegís mirando solo la validación."},{"n":"4","titulo":"Diagnosticar el sobreajuste","corto":"Diagnosticar","min":20,"piezas":["curvas","diagnostico"],"aqui":"Aquí leéis las curvas de vuestra mejor red, escribís `diagnostico` y dejáis una frase: sobreajuste, subajuste o buen ajuste."},{"n":"5","titulo":"Comparación justa","corto":"Comparación justa","min":25,"piezas":["comparar"],"aqui":"Aquí miráis la prueba una sola vez, con 3 semillas y un intervalo (bootstrap), resolvéis el ejercicio 4 y ponéis el coste: tiempo, complejidad y explicabilidad."},{"n":"6","titulo":"Informe, revisión y entrega","corto":"Informe","min":35,"piezas":["informe"],"aqui":"Aquí escribís el informe de una página con la recomendación al principio, el coste y los riesgos, y lo revisáis con la rúbrica."}],"ficheros":[{"nombre":"reto_vale_la_pena.ipynb","origen":"Lo modificáis.","sube":"Sí · sprint-10/"},{"nombre":"informe_comparativo.md","origen":"Lo creáis a partir de una plantilla.","sube":"Sí · sprint-10/"},{"nombre":"README.md","origen":"Lo modificáis.","sube":"Sí · sprint-10/"},{"nombre":"reservas_turisdata.csv","origen":"Ya hecho.","sube":"Sí, sin cambios · data/ (si aún no está)"},{"nombre":"autoevaluacion_nombre.md","origen":"Ya hecha, en blanco","sube":"Sí, una por persona (no una por equipo) · sprint-10/"},{"nombre":"curvas_aprendizaje.png","origen":"Lo generáis","sube":"Solo si lo hacéis · sprint-10/"},{"nombre":"mlp_final.keras","origen":"Lo genera","sube":"Solo si lo hacéis · sprint-10/"}],"sube_resumen":"3 ficheros + 1 hoja por persona","carpeta_entrega":"sprint-10/","rubrica":[{"criterio":"Corrección técnica","pregunta":"¿funciona y se mide bien?","niveles":["Hay cuaderno, pero se rompe al ejecutarlo de arriba abajo, fallan las comprobaciones o se ha mirado la prueba para decidir","Se ejecuta entero con semillas fijas; una sola partición; referencia y MLP medidos con las mismas métricas; curva de aprendizaje con una frase de diagnóstico; la prueba se usa una sola vez","Además, el escalador se ajusta solo con el entrenamiento, hay 2–3 variantes elegidas con la validación (con su tabla) y la comparación usa 3 semillas o bootstrap, con los cuatro ejercicios en verde","Además, la variante de precio con el mismo rigor, o el modelo guardado y recargado dando el mismo resultado"]},{"criterio":"Reproducibilidad","pregunta":"¿lo puede repetir otra persona?","niveles":["Solo funciona en el Colab de quien lo escribió (celdas desordenadas o rutas propias)","El cuaderno se ejecuta de arriba abajo y el README dice qué se entrega, quién hizo qué y cómo abrirlo","Otra persona abre el cuaderno en Colab, pulsa Reiniciar y ejecutar todo y obtiene las cifras del informe siguiendo solo el README; los ficheros están en sprint-10/, subidos desde cuentas distintas","Además, el README indica las versiones (Python, Keras, scikit-learn), las semillas usadas y la ruta exacta de los datos"]},{"criterio":"Análisis y comunicación al cliente","pregunta":"¿lo entiende quien no programa?","niveles":["El informe solo da números, sin decir qué significan","Tiene la tabla de ambos enfoques y la recomendación en una frase («Recomendamos… porque…»)","Responde a «¿vale la pena?» con media ± desviación, dice si la diferencia es real o ruido, añade el coste (tiempo, complejidad, explicabilidad) y los límites, y comenta la curva, sin jerga","Además, dice cuándo cambiaría la recomendación (más datos, imágenes o texto) o qué pasaría con el umbral según lo que cueste un overbooking"]},{"criterio":"IA responsable","pregunta":"¿se sabe qué hizo la IA y qué riesgos hay?","niveles":["No dice si se ha usado IA ni nombra ningún riesgo","Dice dónde se ha usado IA y nombra al menos un riesgo del caso","Dice qué se pidió y qué se comprobó a mano; nombra dos riesgos concretos (por ejemplo, datos sintéticos y overbooking) con una medida para cada uno; quien escribe sabe explicar cualquier celda","Además, aplica una medida y mide su efecto (por ejemplo, el error por país o canal, o un umbral distinto) o cuenta un fallo concreto de la IA que detectaron"]}],"enlaces":[{"t":"Abrir el cuaderno del reto (Colab)","url":"https://col     $m('#w10-bm').innerHTML = hay
      ? `<b>Veredicto estadístico: ${ganador}.<\/b> La diferencia media es ${sg(mu)} y el intervalo del 95 % ([${sg(inf)}, ${sg(sup)}]) <b>no incluye el 0<\/b>: ${ganador === 'MLP' ? 'la red mejora al boosting más allá del ruido. Ahora hay que pesar esa mejora contra su coste.' : 'el boosting es mejor que esta red, más allá del ruido.'}`
      : `<b>Veredicto estadístico: Empate.<\/b> La diferencia media es ${sg(mu)} y el intervalo del 95 % ([${sg(inf)}, ${sg(sup)}]) <b>incluye el 0<\/b>: con ${miles(d.n[2])} reservas no podéis afirmar que la red mejore al boosting. Es una respuesta válida.`;
    ST.res = {c, pb, auc, ap, f1, ac, mu, inf, sup, hay, ganador, pw, mt, st_};
  }

  /* ───── 6 · informe ───── */
  const pInf = pieza(host, 'informe', 'EL INFORME · «Recomendamos… porque…»');
  pInf.innerHTML = '<div id="w10-in"><\/div>';
  function informe(){
    const box = pInf.querySelector('#w10-in');
    if (!ST.vista) { box.innerHTML = `<div class="msg">Todavía no hay cifras de la prueba: medidla en la pieza anterior y las frases del informe se rellenan con ellas.<\/div>`; return; }
    const r = ST.res, mas = r.c.t > d.ref.t * 1.15, menos = r.c.t < d.ref.t * .87;
    const cuando = r.ganador === 'MLP' ? 'la mejora fuese menor que el ruido, o su coste dejara de compensar' : 'la diferencia superase el ruido (más datos) o llegaran otros tipos de datos —imágenes o texto—, donde las redes sí suelen ganar';
    const reco = r.ganador === 'MLP' ? 'cambiar a la red' : 'mantener el boosting';
    const porque = r.ganador === 'MLP' ? `su AUC en la prueba es mayor más allá del ruido (${sg(r.mu)}, intervalo ${sg(r.inf)} a ${sg(r.sup)}), aunque cuesta ${miles(r.pw)} pesos y más ajustes`
      : r.ganador === 'Boosting' ? `el boosting es mejor que la red más allá del ruido (${sg(r.mu)}) y además es más sencillo`
        : `la red no mejora más allá del ruido (diferencia de AUC ${sg(r.mu)}, intervalo ${sg(r.inf)} a ${sg(r.sup)}) y cuesta más: ${miles(r.pw)} pesos y cuatro ajustes frente a 200 árboles`;
    box.innerHTML = `<p class="cap" style="margin:0 0 8px">Las frases del «reto en una página», rellenas con <b>vuestras cifras<\/b> de la prueba. Al escribir el informe, la recomendación va <b>al principio<\/b>.<\/p>
      <div class="w10-doc"><b>1 · Recomendación.<\/b> «Recomendamos <b>${reco}<\/b> porque ${porque}.»<\/div>
      <div class="w10-doc"><b>2 · Con cifras.<\/b> «Con el mismo conjunto de datos, el boosting obtiene un AUC de ${fmt(r.pb.auc, 3)} y la red ${fmt(r.mt, 3)} ± ${fmt(r.st_, 3)} (media de 3 semillas). La diferencia <b>${r.hay ? 'es' : 'no es'}<\/b> mayor que el ruido.»<\/div>
      <div class="w10-doc"><b>3 · Coste.<\/b> «La red ${mas ? 'tarda más' : (menos ? 'tarda menos' : 'tarda parecido')} en entrenar (${fmt(r.c.t, 1)} s frente a ${fmt(d.ref.t, 1)} s en este cálculo), tiene ${miles(r.pw)} pesos frente a 200 iteraciones de árboles y es más difícil de explicar. Solo cambiaría la recomendación si ${cuando}.»<\/div>
      <div class="w10-doc"><b>4 · Riesgos.<\/b> Los datos son sintéticos (las cifras reales serán otras); el umbral y lo que cueste un <i>overbooking<\/i> (equivocarse en un sentido o en otro) cambian las decisiones aunque el AUC no cambie; posibles sesgos por país o canal. Un riesgo sin su medida no vale.<\/div>
      <p class="cap">Si cambiáis la receta elegida o repetís la prueba, estas frases cambian con ella.<\/p>`;
  }
  dibujar(); variantes(); comparar(); informe();
  return {};
};

/* ───────── marco común ───────── */
const app = document.getElementById('app');
const sh = (t) => `<div class="sh"><span class="st">${esc(t)}</span><span class="ln"></span></div>`;

const hero = el('header');
const totalMin = D.pasos.reduce((s, p) => s + (p.min || 0), 0);
hero.innerHTML = `<div class="kicker">${esc(D.kicker)}</div><h1>${esc(D.titulo)}</h1><p class="lead">${md(D.lead)}</p>
  <div class="chips"><span class="chip">${D.pasos.length} pasos</span><span class="chip">≈ ${totalMin} min de reto</span><span class="chip">${esc(D.sube_resumen)}</span></div>
  <p class="hint" style="margin-top:14px">${md(D.aviso)}</p>`;
app.appendChild(hero);

const play = el('section');
play.innerHTML = sh('EL PRODUCTO FUNCIONANDO') + `<h2>${esc(D.widget_titulo)}</h2><p class="sec-intro">${md(D.intro)}</p>`;
const steps = el('div', 'steps'); steps.setAttribute('role', 'group'); steps.setAttribute('aria-label', 'Pasos del reto');
const aqui = el('div', 'aqui'); aqui.setAttribute('aria-live', 'polite');
const stage = el('div', 'stage');
play.append(steps, aqui, stage);
app.appendChild(play);
const widget = W[D.widget](stage, D);

function elegir(i){
  const btns = steps.querySelectorAll('.step');
  btns.forEach((b, k) => b.setAttribute('aria-pressed', String(k === i)));
  const panels = stage.querySelectorAll('[data-pieza]');
  if (i < 0) { stage.classList.remove('sel'); panels.forEach(p => p.classList.remove('hl')); aqui.innerHTML = md(D.aqui_todo); return; }
  const p = D.pasos[i];
  stage.classList.add('sel');
  panels.forEach(pn => pn.classList.toggle('hl', pn.dataset.pieza.split(' ').some(x => (p.piezas || []).includes(x))));
  aqui.innerHTML = `<b>Paso ${esc(p.n)} · ${esc(p.titulo)}</b> (${p.min} min). ${md(p.aqui || '')}`;
  const first = stage.querySelector('.pieza.hl'); if (first && first.getBoundingClientRect().top > window.innerHeight * .8) first.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center'});
}
D.pasos.forEach((p, i) => {
  const b = el('button', 'step', `<span class="n">${esc(p.n)}</span><span>${esc(p.corto || p.titulo)}<small>${p.min} min</small></span>`);
  b.type = 'button'; b.setAttribute('aria-pressed', 'false'); b.addEventListener('click', () => elegir(steps.querySelector('.step[aria-pressed="true"]') === b ? -1 : i));
  steps.appendChild(b);
});
elegir(-1);

/* qué se sube y cómo se evalúa */
const fin = el('section');
fin.innerHTML = sh('QUÉ SE SUBE Y CÓMO SE EVALÚA') + `<h2>Lo que entregáis y con qué se puntúa</h2><p class="sec-intro">Todo va al repositorio del equipo, en la carpeta <code>${esc(D.carpeta_entrega)}</code>. La rúbrica es la misma que usáis para revisar vuestro propio trabajo antes de subirlo.</p>`;
const files = el('div', 'files');
D.ficheros.forEach(f => files.appendChild(el('div', 'file', `<b>${esc(f.nombre)}</b><span class="o">${md(f.origen)}</span><span class="s">${esc(f.sube)}</span>`)));
fin.appendChild(files);
const tabs = el('div', 'tabs'); tabs.setAttribute('role', 'tablist');
const lv = el('div', 'levels'); lv.setAttribute('aria-live', 'polite');
const qq = el('p', 'hint'); qq.style.marginBottom = '10px';
const NIV = ['1 · Empezado', '2 · Mínimo', '3 · Estándar', '4 · Extra'];
function criterio(k){
  tabs.querySelectorAll('.tab').forEach((t, j) => t.setAttribute('aria-selected', String(j === k)));
  const c = D.rubrica[k]; qq.textContent = c.pregunta;
  lv.innerHTML = c.niveles.map((t, j) => `<div class="lv${j === 1 ? ' min' : ''}"><h3>${NIV[j]}</h3><p>${md(t)}</p></div>`).join('');
}
D.rubrica.forEach((c, k) => { const t = el('button', 'tab', esc(c.criterio)); t.type = 'button'; t.setAttribute('role', 'tab'); t.addEventListener('click', () => criterio(k)); tabs.appendChild(t); });
fin.append(tabs, qq, lv);
fin.appendChild(el('p', 'hint', 'Orientación: lo que pide el nivel mínimo sale en un <b>2</b>, el estándar en un <b>3</b> y los extras en un <b>4</b>. Sin una frase de prueba escrita, el nivel no vale.'));
criterio(0);
app.appendChild(fin);

const pie = el('footer');
pie.innerHTML = sh('DÓNDE SEGUIR') + `<div class="links">${D.enlaces.map(e => `<a class="btn" href="${esc(e.url)}">${esc(e.t)}</a>`).join('')}</div><p class="foot" style="margin-top:14px">${md(D.pie)}</p>`;
app.appendChild(pie);
})();
</script>
</body>
</html>
