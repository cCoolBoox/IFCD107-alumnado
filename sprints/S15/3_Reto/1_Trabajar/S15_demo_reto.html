<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Demo interactiva del reto del Sprint 15 (IFCD107): el registro de experimentos con modelos ajustados de verdad, la alarma de la fuga, la elección del candidato dentro del ruido, el test abierto una sola vez y la primera explicación.">
<title>El mejor modelo, demostrado · demo interactiva</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Maqueta común de las demos del reto (IFCD107): hero → «el producto funcionando» con un selector de pasos
   → qué se sube y cómo se evalúa. Identidad: la de las infografías del curso (tinta azulada, óxido, verde azulado, crema). */
:root{
  --bg:#F5F1E8; --surface:#FFFFFF; --ink:#1D2433; --muted:#566073; --line:#D9D2C0; --soft:#EFE7D2;
  --accent:#C23B1F; --accent-soft:#F7DDD4; --teal:#0F7F7F; --teal-soft:#D5ECEA; --sky:#DCE6F5; --blue:#3D5F96;
  --ok:#1B7F4B; --ok-soft:#D9F0E3; --bad:#B42318; --bad-soft:#FBE0DC; --warn:#8A5A00; --warn-soft:#F6E7C4;
  --code-bg:rgba(29,36,51,.08); --focus:#1D2433; --pt:rgba(61,95,150,.42); --grid:#E4DDCB;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161F; --surface:#1B2230; --ink:#F1ECE0; --muted:#A3ADC0; --line:#2E3748; --soft:#232C3C;
    --accent:#F08A6C; --accent-soft:#3A2620; --teal:#58C7BE; --teal-soft:#16302F; --sky:#1F2C44; --blue:#8FB0E6;
    --ok:#6FD3A0; --ok-soft:#173226; --bad:#FF8D78; --bad-soft:#3A1E1A; --warn:#E9C46A; --warn-soft:#3A2F14;
    --code-bg:rgba(241,236,224,.1); --focus:#F1ECE0; --pt:rgba(143,176,230,.5); --grid:#2A3345; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161F; --surface:#1B2230; --ink:#F1ECE0; --muted:#A3ADC0; --line:#2E3748; --soft:#232C3C;
  --accent:#F08A6C; --accent-soft:#3A2620; --teal:#58C7BE; --teal-soft:#16302F; --sky:#1F2C44; --blue:#8FB0E6;
  --ok:#6FD3A0; --ok-soft:#173226; --bad:#FF8D78; --bad-soft:#3A1E1A; --warn:#E9C46A; --warn-soft:#3A2F14;
  --code-bg:rgba(241,236,224,.1); --focus:#F1ECE0; --pt:rgba(143,176,230,.5); --grid:#2A3345; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:44px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:clamp(30px,5.2vw,52px);line-height:1.05;font-weight:800;letter-spacing:-.02em;margin-top:8px}
h2{font-size:clamp(22px,3vw,28px);line-height:1.15;font-weight:800;letter-spacing:-.01em}
h3{font-size:17px;line-height:1.2;font-weight:800}
p{margin:0}
code{font-family:var(--f-mono);font-size:.86em;background:var(--code-bg);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
a{color:var(--accent);font-weight:700;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
button{font:inherit;color:inherit;cursor:pointer}
.kicker{font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--accent)}
.lead{font-size:clamp(17px,2vw,20px);color:var(--muted);max-width:62ch;margin-top:10px}
.hint{font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:5px 13px;font-size:14px;font-weight:700}
.btn{border:2px solid var(--ink);background:transparent;border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.small{padding:5px 11px;font-size:13px}
.btn.on{background:var(--ink);color:var(--bg)}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sh .st{font-family:var(--f-display);font-weight:800;font-size:14px;color:var(--accent);letter-spacing:.12em;white-space:nowrap}
.sh .ln{flex:1;height:2px;background:var(--line)}
.sec-intro{color:var(--muted);max-width:68ch;margin:-4px 0 16px}

/* selector de pasos */
.steps{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.step{display:flex;align-items:center;gap:9px;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 13px 7px 8px;text-align:left;font-weight:700;font-size:14px;line-height:1.2}
.step .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:14px}
.step small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.step[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.step[aria-pressed="true"] small{color:var(--bg);opacity:.8}
.aqui{background:var(--teal-soft);border-radius:12px;padding:11px 16px;margin-bottom:16px;font-size:15.5px;min-height:3.2em}
.aqui b{color:var(--teal)}

/* piezas del producto */
.stage{display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row2>*{min-width:0}
@media (max-width:860px){.row2{grid-template-columns:1fr}}
.pieza{background:var(--surface);border:2px solid var(--line);border-radius:14px;overflow:hidden;min-width:0;transition:opacity .2s,box-shadow .2s,border-color .2s}
.pieza>.bh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;border-bottom:2px solid var(--line);font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.pieza>.bb{padding:12px 14px}
.stage.sel .pieza{opacity:.5}
.stage.sel .pieza.hl{opacity:1;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.stage.sel .pieza.hl>.bh{color:var(--accent)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.duo>*{min-width:0}
@media (max-width:700px){.duo{grid-template-columns:1fr}}
.cap{font-size:13.5px;color:var(--muted);margin-top:6px}
.cap b{color:var(--ink)}

/* gráficos */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.chart .tl{font-size:11.5px;font-weight:700;fill:var(--ink)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ax{stroke:var(--muted);stroke-width:1.2}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.legend i.ln{width:18px;height:3px;border-radius:2px;vertical-align:3px}

/* mandos */
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-top:12px;padding-top:12px;border-top:2px solid var(--line)}
.ctl label{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.ctl input[type=range]{width:170px;accent-color:var(--accent)}
.ctl input[type=number],.ctl select{font-family:var(--f-mono);font-size:14px;padding:5px 8px;border:2px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.ctl input[type=number]{width:6em}
.ctl input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.read{font-family:var(--f-mono);font-size:13px;color:var(--ink);background:var(--soft);border-radius:8px;padding:6px 10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-weight:800;font-size:12.5px;letter-spacing:.04em}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.msg{margin-top:8px;font-size:14.5px;padding:8px 12px;border-radius:10px;background:var(--soft)}
.msg.ok{background:var(--ok-soft);color:var(--ok)} .msg.bad{background:var(--bad-soft);color:var(--bad)} .msg.warn{background:var(--warn-soft);color:var(--warn)}

/* tablas */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;text-align:left}
th{font-size:12.5px;font-weight:800;letter-spacing:.04em;color:var(--muted);border-bottom:2px solid var(--line)}
td{border-bottom:1px solid var(--line)}
td.num,th.num{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.sql{font-family:var(--f-mono);font-size:13px;background:var(--code-bg);border-radius:8px;padding:8px 12px;margin-bottom:10px;overflow-wrap:anywhere}

/* lista de comprobaciones */
.checks{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:5px}
.checks li{display:flex;gap:9px;align-items:baseline;font-size:14.5px}
.checks .m{flex:none;width:1.3em;text-align:center;font-weight:800}
.checks li.ok .m{color:var(--ok)} .checks li.no .m{color:var(--muted)} .checks li.bad .m{color:var(--bad)}
textarea{width:100%;min-height:130px;font:inherit;font-size:15px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);resize:vertical}

/* qué se sube y rúbrica */
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:22px}
.file{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:11px 14px}
.file b{font-family:var(--f-mono);font-size:13.5px;overflow-wrap:anywhere}
.file .o{display:block;font-size:13.5px;color:var(--muted);margin-top:3px}
.file .s{display:block;font-size:12.5px;font-weight:800;color:var(--teal);margin-top:6px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-weight:700;font-size:14.5px}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:900px){.levels{grid-template-columns:1fr 1fr}}
@media (max-width:540px){.levels{grid-template-columns:1fr}}
.lv{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 13px;font-size:14px}
.lv h3{font-size:14px;margin-bottom:5px;color:var(--muted)}
.lv.min{border-color:var(--teal)} .lv.min h3{color:var(--teal)}
.links{display:flex;flex-wrap:wrap;gap:10px}
.foot{font-size:13.5px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

<script>
const DEMO = {"kicker":"IFCD107 · SPRINT 15 · DEMO DEL RETO","titulo":"El mejor modelo, demostrado","lead":"El cliente (el docente) quiere saber qué modelo recomendáis para vuestro proyecto y por qué.","aviso":"Es una demo para entender adónde vamos: **no se entrega nada desde aquí** y no se guarda nada. Los modelos están ajustados de verdad con los datos de práctica (sintéticos, TurisData no existe), con la misma partición, la misma cadena de pasos y la validación cruzada del reto; los tiempos son los de la máquina que generó esta página, no los de vuestro Colab. Los nombres del equipo y la columna `reembolso_emitido` son un ejemplo inventado. Vuestro proyecto tendrá otros datos, otros modelos y otras cifras.","widget":"registro","widget_titulo":"Probar con orden, elegir con honestidad","intro":"Esto es lo que tendréis al acabar el reto, con los datos de práctica de TurisData. Cada fila del registro es un modelo ajustado de verdad. **Tocad los mandos:** anotad una prueba nueva, ordenad y filtrad el registro, subid la fuga hasta que salte la alarma, ensanchad el margen de ruido para ver cuándo gana el modelo simple y abrid el test… que solo se abre una vez. Después, elegid un paso para ver qué pieza construís en él.","aqui_todo":"Elegid un paso del reto y se ilumina **la pieza que construís en él**. Pulsad otra vez el mismo paso para verlo todo.","pasos":[{"n":"1","titulo":"Preparar el terreno y repetir el baseline","corto":"Terreno y baseline","min":130,"piezas":["registro"],"aqui":"Aquí creáis el registro con su cabecera de 12 columnas, anotáis el *baseline* como fila 1 y el primer modelo de verdad; la huella de los datos y la semilla van fijas en todas las filas."},{"n":"2","titulo":"Probar los modelos clásicos y el neuronal","corto":"Probar modelos","min":140,"piezas":["probar","registro"],"aqui":"Aquí cada persona prueba una familia de modelos o un ajuste y lo anota con su nombre. Elegid uno, pulsad «Anotar» y mirad cómo crece el registro y qué comprobaciones pasa."},{"n":"3","titulo":"Comprobar que no hay fugas y tutoría","corto":"Fugas y tutoría","min":60,"piezas":["fuga"],"aqui":"Aquí sospecháis de lo que parece demasiado bueno. Subid la intensidad de la fuga y mirad la métrica, y bajad el umbral de alarma para ver qué fuga pequeña se os cuela."},{"n":"4","titulo":"Elegir el candidato sin tocar el test","corto":"Elegir el candidato","min":70,"piezas":["candidato"],"aqui":"Aquí comparáis media ± desviación, tiempo y explicabilidad y elegís sin mirar el test. Mover el margen de ruido cambia qué modelos empatan con el mejor."},{"n":"5","titulo":"Test una sola vez, explicación, revisión y entrega","corto":"Test y explicación","min":70,"piezas":["test","explicacion"],"aqui":"Aquí abrís el test una única vez con el candidato elegido, guardáis el `metadatos.json` y dibujáis qué pistas pesan más en el modelo."}],"ficheros":[{"nombre":"registro.csv","origen":"Lo creáis a partir de una plantilla.","sube":"Sí · sprint-15/"},{"nombre":"03_modelos.ipynb","origen":"Lo creáis.","sube":"Sí · sprint-15/"},{"nombre":"justificacion_candidato.md","origen":"Lo creáis.","sube":"Sí · sprint-15/"},{"nombre":"modelo_candidato.joblib","origen":"Lo genera el cuaderno","sube":"Sí · sprint-15/"},{"nombre":"metadatos.json","origen":"Lo genera el cuaderno","sube":"Sí · sprint-15/"},{"nombre":"explicacion_modelo.png","origen":"Lo genera el cuaderno.","sube":"Sí · sprint-15/"},{"nombre":"autoevaluacion_nombre.md","origen":"Ya hecha, en blanco","sube":"Sí, una por persona (no una por equipo) · sprint-15/"}],"sube_resumen":"6 ficheros + 1 hoja por persona","carpeta_entrega":"sprint-15/","rubrica":[{"criterio":"Corrección técnica","pregunta":"¿funciona y se ha medido bien?","niveles":["Hay modelos, pero las particiones no coinciden, se ha mirado el test para elegir o el cuaderno no se ejecuta","Baseline y 3 modelos con la misma partición y media ± desviación; candidato elegido con validación; test evaluado una sola vez","Además, un modelo neuronal (o LLM       $(b, '#w15-ts').innerHTML = abierto ? `<div><div class="w15-big">${a3(ST.test)}<\/div><div class="hint">AUC en test<\/div><\/div>` : '<span class="hint">El test está sellado. Se abre después de elegir, y una sola vez.<\/span>';
      $(b, '#w15-to').disabled = abierto; $(b, '#w15-tr').hidden = !abierto;
      if (!abierto) msg(tm, '', 'Elegid el candidato en la pieza anterior (solo con la validación) y abrid el test. Si el resultado no os gusta, <b>no se vuelve a elegir con él<\/b>: se anota y se explica.');
      else { const dif = r.valor_cv - ST.test;
        if (dif > .06) msg(tm, 'bad', `El test sale ${a3(dif)} por debajo de la validación (${a3(r.valor_cv)}): más de seis centésimas. Sospechad sobreajuste o fuga. <b>No cambiéis de candidato por haberlo visto<\/b>: anotadlo y explicad la causa probable.`);
        else msg(tm, 'ok', `En test ${a3(ST.test)}, frente a ${a3(r.valor_cv)} en validación (diferencia ${a3(dif)}): muy cerca, lo esperable. Copiadlo a la justificación. <b>El test ya está gastado:<\/b> el candidato no se cambia.`); }
      const v = x => JSON.stringify(x);
      const hoy = ahora().slice(0, 10);
      $(b, '#w15-tj').textContent = `{\n  "modelo": ${v(r.modelo)},\n  "entrenado": ${v(hoy)},\n  "semilla": ${d.semilla},\n  "datos_hash": ${v(d.hash)},\n  "metrica": "AUC",\n  "valor_validacion": ${r.valor_cv.toFixed(3)},\n  "valor_test": ${abierto ? ST.test.toFixed(3) : 'null   ← se rellena al abrir el test'},\n  "variables": ${v(d.variables)},\n  "versiones": ${v(d.versiones)}\n}`;
    };
    $(b, '#w15-to').addEventListener('click', () => { if (ST.sellado) return; const r = legit().find(x => x.key === ST.cand); ST.test = M[r.key].test; ST.sellado = true; cambio(); });
    $(b, '#w15-tr').addEventListener('click', () => { ST.sellado = false; ST.test = null; cambio(); });
  }

  /* ───────────── 6 · primera explicación: importancia por permutación ───────────── */
  let explRender = () => {};
  {
    const b = pieza(host, 'explicacion', 'PRIMERA EXPLICACIÓN · explicacion_modelo.png');
    b.innerHTML = `<div class="ctl w15-c" style="margin-top:0;padding-top:0;border:0"><label>Explicar <select id="w15-es"><\/select><\/label><label>Variables a mostrar <input type="range" id="w15-en" min="3" max="10" step="1" value="8"><\/label><span class="read" id="w15-ev"><\/span><\/div>
      <div class="w15-bars" id="w15-eb" style="margin-top:10px"><\/div><p class="cap">Importancia por permutación sobre el <b>entrenamiento<\/b> (para no gastar el test una segunda vez): cuánto cae el AUC al desordenar cada variable.<\/p><div class="msg" id="w15-em"><\/div>`;
    const em = live($(b, '#w15-em')), es = $(b, '#w15-es');
    explRender = function(){
      const L = legit().filter(r => r.fam !== 'base'), claves = [...new Map(L.map(r => [r.key, r])).values()], cur = es.value || 'cand';
      es.innerHTML = `<option value="cand">el candidato elegido<\/option>` + claves.map(r => `<option value="${esc(r.key)}">${esc(r.modelo)}<\/option>`).join(''); es.value = [...es.options].some(o => o.value === cur) ? cur : 'cand';
      const key = es.value === 'cand' ? ST.cand : es.value, n = +$(b, '#w15-en').value, m = M[key], nom = legit().find(r => r.key === key).modelo;
      $(b, '#w15-ev').textContent = `${nom} · ${n} variables`;
      if (!m.imp.length) { $(b, '#w15-eb').innerHTML = ''; msg(em, 'warn', 'El <i>baseline<\/i> no mira las pistas: no hay nada que explicar. Elegid otro modelo.'); return; }
      const top = m.imp.slice(0, n), mx = top[0][1];
      $(b, '#w15-eb').innerHTML = top.map((x, i) => `<div class="w15-br"><span class="l">${esc(x[0])}<\/span><div class="w15-tr"><div class="w15-fl ${i === 0 ? 'o' : ''}" style="width:${Math.max(1, x[1] / mx * 100)}%"><\/div><\/div><span class="v">${a3(x[1])}<\/span><\/div>`).join('');
      msg(em, 'ok', `<b>Lectura:<\/b> la variable que más pesa es <code>${esc(top[0][0])}<\/code> (el AUC cae ${a3(top[0][1])} al desordenarla), seguida de <code>${esc(top[1][0])}<\/code> (${a3(top[1][1])}). Eso dice qué pistas <b>usa<\/b> el modelo, no que sean la <b>causa<\/b> de la cancelación.`);
    };
    es.addEventListener('change', explRender); $(b, '#w15-en').addEventListener('input', explRender);
  }

  function cambio(){ regRender(); fugaRender(); candRender(); testRender(); explRender(); }
  cambio();
  return {};
};

/* ───────── marco común ───────── */
const app = document.getElementById('app');
const sh = (t) => `<div class="sh"><span class="st">${esc(t)}</span><span class="ln"></span></div>`;

const hero = el('header');
const totalMin = D.pasos.reduce((s, p) => s + (p.min || 0), 0);
hero.innerHTML = `<div class="kicker">${esc(D.kicker)}</div><h1>${esc(D.titulo)}</h1><p class="lead">${md(D.lead)}</p>
  <div class="chips"><span class="chip">${D.pasos.length} pasos</span><span class="chip">≈ ${totalMin} min de reto</span><span class="chip">${esc(D.sube_resumen)}</span></div>
  <p class="hint" style="margin-top:14px">${md(D.aviso)}</p>`;
app.appendChild(hero);

const play = el('section');
play.innerHTML = sh('EL PRODUCTO FUNCIONANDO') + `<h2>${esc(D.widget_titulo)}</h2><p class="sec-intro">${md(D.intro)}</p>`;
const steps = el('div', 'steps'); steps.setAttribute('role', 'group'); steps.setAttribute('aria-label', 'Pasos del reto');
const aqui = el('div', 'aqui'); aqui.setAttribute('aria-live', 'polite');
const stage = el('div', 'stage');
play.append(steps, aqui, stage);
app.appendChild(play);
const widget = W[D.widget](stage, D);

function elegir(i){
  const btns = steps.querySelectorAll('.step');
  btns.forEach((b, k) => b.setAttribute('aria-pressed', String(k === i)));
  const panels = stage.querySelectorAll('[data-pieza]');
  if (i < 0) { stage.classList.remove('sel'); panels.forEach(p => p.classList.remove('hl')); aqui.innerHTML = md(D.aqui_todo); return; }
  const p = D.pasos[i];
  stage.classList.add('sel');
  panels.forEach(pn => pn.classList.toggle('hl', pn.dataset.pieza.split(' ').some(x => (p.piezas || []).includes(x))));
  aqui.innerHTML = `<b>Paso ${esc(p.n)} · ${esc(p.titulo)}</b> (${p.min} min). ${md(p.aqui || '')}`;
  const first = stage.querySelector('.pieza.hl'); if (first && first.getBoundingClientRect().top > window.innerHeight * .8) first.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center'});
}
D.pasos.forEach((p, i) => {
  const b = el('button', 'step', `<span class="n">${esc(p.n)}</span><span>${esc(p.corto || p.titulo)}<small>${p.min} min</small></span>`);
  b.type = 'button'; b.setAttribute('aria-pressed', 'false'); b.addEventListener('click', () => elegir(steps.querySelector('.step[aria-pressed="true"]') === b ? -1 : i));
  steps.appendChild(b);
});
elegir(-1);

/* qué se sube y cómo se evalúa */
const fin = el('section');
fin.innerHTML = sh('QUÉ SE SUBE Y CÓMO SE EVALÚA') + `<h2>Lo que entregáis y con qué se puntúa</h2><p class="sec-intro">Todo va al repositorio del equipo, en la carpeta <code>${esc(D.carpeta_entrega)}</code>. La rúbrica es la misma que usáis para revisar vuestro propio trabajo antes de subirlo.</p>`;
const files = el('div', 'files');
D.ficheros.forEach(f => files.appendChild(el('div', 'file', `<b>${esc(f.nombre)}</b><span class="o">${md(f.origen)}</span><span class="s">${esc(f.sube)}</span>`)));
fin.appendChild(files);
const tabs = el('div', 'tabs'); tabs.setAttribute('role', 'tablist');
const lv = el('div', 'levels'); lv.setAttribute('aria-live', 'polite');
const qq = el('p', 'hint'); qq.style.marginBottom = '10px';
const NIV = ['1 · Empezado', '2 · Mínimo', '3 · Estándar', '4 · Extra'];
function criterio(k){
  tabs.querySelectorAll('.tab').forEach((t, j) => t.setAttribute('aria-selected', String(j === k)));
  const c = D.rubrica[k]; qq.textContent = c.pregunta;
  lv.innerHTML = c.niveles.map((t, j) => `<div class="lv${j === 1 ? ' min' : ''}"><h3>${NIV[j]}</h3><p>${md(t)}</p></div>`).join('');
}
D.rubrica.forEach((c, k) => { const t = el('button', 'tab', esc(c.criterio)); t.type = 'button'; t.setAttribute('role', 'tab'); t.addEventListener('click', () => criterio(k)); tabs.appendChild(t); });
fin.append(tabs, qq, lv);
fin.appendChild(el('p', 'hint', 'Orientación: lo que pide el nivel mínimo sale en un <b>2</b>, el estándar en un <b>3</b> y los extras en un <b>4</b>. Sin una frase de prueba escrita, el nivel no vale.'));
criterio(0);
app.appendChild(fin);

const pie = el('footer');
pie.innerHTML = sh('DÓNDE SEGUIR') + `<div class="links">${D.enlaces.map(e => `<a class="btn" href="${esc(e.url)}">${esc(e.t)}</a>`).join('')}</div><p class="foot" style="margin-top:14px">${md(D.pie)}</p>`;
app.appendChild(pie);
})();
</script>
</body>
</html>
