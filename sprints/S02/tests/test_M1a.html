<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test corto de M1a · Fundamentos de IA</title>
<style>
:root{--bg:#f7f7fb;--fg:#1c1c28;--card:#fff;--mut:#5b5b70;--ac:#4f46e5;--ok:#15803d;--ko:#b91c1c;--bd:#d9d9e6}
@media (prefers-color-scheme:dark){:root{--bg:#14141c;--fg:#ececf4;--card:#1e1e2a;--mut:#a3a3b8;--ac:#8b85ff;--ok:#4ade80;--ko:#f87171;--bd:#34344a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}h1{font-size:1.4rem;margin:.2em 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:14px 0}
.mut{color:var(--mut)}.tag{font-size:.8rem;color:var(--ac);font-weight:600}
label.o{display:block;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;margin:6px 0;cursor:pointer}
label.o:hover{border-color:var(--ac)}input[type=radio]{margin-right:8px}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:1rem;cursor:pointer}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
input[type=text]{width:100%;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:1rem}
.ok{border-color:var(--ok)}.ko{border-color:var(--ko)}.res-ok{color:var(--ok);font-weight:600}.res-ko{color:var(--ko);font-weight:600}
.big{font-size:2rem;font-weight:700}
</style></head><body><main>
<h1 id="t"></h1><div id="app"></div>
<script>
const C={"titulo": "Test corto de M1a · Fundamentos de IA", "salt": "cfcf9b9a1d0612b3", "qs": [{"id": 1, "tag": "UD 1a.1", "q": "¿Cuál es la relación correcta entre estos conceptos?", "o": ["IA ⊂ Machine learning ⊂ Deep learning", "Deep learning ⊂ Machine learning ⊂ IA", "Machine learning ⊂ IA ⊂ Deep learning", "Son tres campos sin relación"], "h": "98a8d0b557ffa2952819706ba62dea87561401e3279621019bfe0ec9ae7ca7dd"}, {"id": 2, "tag": "UD 1a.1", "q": "Una empresa quiere que un sistema transcriba llamadas de reserva a texto. ¿Qué modalidad de la IA es?", "o": ["Visión por computador", "Voz (reconocimiento del habla)", "Sistemas de recomendación", "Robótica"], "h": "db75dc2a998e67aaa33bb8250de31703e93b2081bdc023ca1af215d4ccde9a07"}, {"id": 3, "tag": "UD 1a.2", "q": "Quieres predecir el precio por noche (un número) de un alojamiento a partir de sus características. ¿Qué tipo de problema es?", "o": ["Clasificación", "Agrupación (clustering)", "Regresión", "Detección de anomalías"], "h": "200c1cca3fe387a72e65a03a716d704f1c5058c2e69e5efaaf4015a98f1a926a"}, {"id": 4, "tag": "UD 1a.3", "q": "TurisData quiere descubrir grupos de huéspedes con hábitos parecidos, sin categorías definidas de antemano. Es un problema de aprendizaje:", "o": ["supervisado", "por refuerzo", "no supervisado", "de regresión lineal"], "h": "ecd8d54f9e4cbfcd519c1bf810afec9f14ae6ae96462b4268687b99c2fea4a3b"}, {"id": 5, "tag": "UD 1a.3", "q": "Un modelo acierta el 98 % en los datos de entrenamiento y solo el 65 % en los de test. Lo más probable es que:", "o": ["esté sobreajustado", "tenga infraajuste", "sea un modelo perfecto", "el test sea demasiado fácil"], "h": "11bf2d961e831910ea9f95267378b79fce8962ef5627e3ad2e7d6bd4db04a1d2"}, {"id": 6, "tag": "UD 1a.4", "q": "El producto escalar de (1, 2, 3) y (4, 0, −1) es:", "o": ["1", "7", "0", "(4, 0, −3)"], "h": "c55973e8985847406b81cea7e46e0a39d872ee90270a333157cac854422028f5"}, {"id": 7, "tag": "UD 1a.4", "q": "Multiplicamos una matriz de 2 filas y 3 columnas por otra de 3 filas y 4 columnas. El resultado tiene:", "o": ["2 filas y 4 columnas", "3 filas y 3 columnas", "4 filas y 2 columnas", "No se puede multiplicar"], "h": "3fb88d6b495fab10c9dd74541f12e407ff43d5165d681d489d1b7dbaf254b874"}, {"id": 8, "tag": "UD 1a.4", "q": "En el descenso del gradiente, si el paso (learning rate) es demasiado grande, lo más probable es que:", "o": ["el modelo converja más rápido siempre", "se pase del mínimo, oscile o incluso diverja", "el gradiente sea siempre cero", "el modelo se quede exactamente en el mismo punto"], "h": "6d0af5deeb7c547704d011f8b3155b09eae95dbc51acdbcc0a47ae8813ed5eda"}, {"id": 9, "tag": "UD 1a.5", "q": "Las ganancias por reserva son 90, 95, 100, 100, 105, 110, 120 y 480 €. Para describir \"una reserva normal\" conviene usar:", "o": ["la media (150 €), porque incluye todos los valores", "la mediana (102,5 €), porque es robusta ante el valor atípico", "el máximo (480 €)", "la suma total"], "h": "da0d304b7a9d3c3d90e359c9415b29acf05f62e157015f2b756ecaaea08d77b4"}, {"id": 10, "tag": "UD 1a.5", "q": "El 0,5 % de los documentos de identidad que revisa un hotel son falsos. Una prueba da positivo en el 98 % de los falsos y también en el 2 % de los auténticos. Si una prueba da positivo, la probabilidad de que el documento sea falso es aproximadamente:", "o": ["98 %", "50 %", "20 %", "0,5 %"], "h": "45a344cea8cbe14767b4d0666d4d9d1c6aab5306daab5aaee8164c4f3814ce94"}, {"id": 11, "tag": "UD 1a.5", "q": "Se envía una encuesta de satisfacción solo a los clientes que dejaron su correo en la web. El principal problema es:", "o": ["un error de cálculo de la media", "un sesgo de selección: la muestra no representa a todos los clientes", "que la encuesta es demasiado larga", "ninguno, con muchos correos siempre vale"], "h": "98b24dd9edabaf5403d530dab33539c9dd2e69f343dc9f5c3cadf46bed015970"}, {"id": 12, "tag": "UD 1a.5", "q": "La paradoja de Simpson consiste en que:", "o": ["la media siempre es mayor que la mediana", "una tendencia observada en el conjunto total puede invertirse al separar los datos por subgrupos", "dos variables no correlacionadas siempre son independientes", "una muestra grande siempre corrige el sesgo"], "h": "4b19c1b5033c2d58e4b4318b7bf9cc49b3b4b42d020c208343718cb1e0f66e38"}], "minutos": 20, "sprint": "S02"};
const $=s=>document.querySelector(s);
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const hoy=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Atlantic/Canary'}).format(new Date());
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
$('#t').textContent=C.titulo;
start();
function start(){
 const qs=C.qs.map(q=>({...q,idx:shuffle(q.o.map((_,i)=>i))}));
 let html=`<div class="card"><p class="mut">${C.qs.length} preguntas · unos ${C.minutos} minutos · una respuesta correcta por pregunta. Sin penalización por fallo.</p><label>Tu nombre<input type="text" id="nom" placeholder="Nombre y apellidos" autocomplete="off"></label></div><form id="f">`;
 qs.forEach((q,i)=>{html+=`<div class="card" id="q${i}"><div class="tag">${i+1}${q.tag?' · '+q.tag:''}</div><p><b>${esc(q.q)}</b></p>`+q.idx.map((k,j)=>`<label class="o"><input type="radio" name="q${i}" value="${k}">${esc(q.o[k])}</label>`).join('')+`<div class="r mut"></div></div>`});
 html+=`<button type="submit">Terminar y ver mi nota</button></form><div id="res"></div>`;
 $('#app').innerHTML=html;
 $('#f').onsubmit=async e=>{e.preventDefault();
  const sin=qs.filter((q,i)=>!document.querySelector(`input[name=q${i}]:checked`)).length;
  if(sin&&!confirm(`Te quedan ${sin} sin responder. ¿Terminar igualmente?`))return;
  let ok=0;
  for(let i=0;i<qs.length;i++){const q=qs[i];const sel=document.querySelector(`input[name=q${i}]:checked`);
   let corr=-1;for(let k=0;k<4;k++){if(await sha(`${C.salt}|${q.id}|${q.o[k]}`)===q.h)corr=k}
   const acierto=sel&&+sel.value===corr;if(acierto)ok++;
   const box=$('#q'+i);box.classList.add(acierto?'ok':'ko');
   box.querySelector('.r').innerHTML=acierto?'<span class="res-ok">✔ Correcta</span>':`<span class="res-ko">✘ ${sel?'Incorrecta':'Sin responder'}.</span> Correcta: ${esc(q.o[corr])}`;}
  document.querySelectorAll('input[type=radio]').forEach(x=>x.disabled=true);$('#f button').remove();
  const n=qs.length,p=Math.round(ok/n*100),nom=($('#nom').value||'(sin nombre)').trim();
  const txt=`${nom} · ${C.titulo} · ${ok}/${n} (${p} %) · ${h()}`;
  $('#res').innerHTML=`<div class="card"><p class="big">${ok} / ${n}</p><p>${p>=50?'✅ Apto':'⚠️ Por debajo del 50 %'} (se aprueba con el 50 %).</p><p class="mut">Copia tu resultado y envíaselo al docente:</p><input type="text" readonly value="${esc(txt)}" id="cp"><p><button class="sec" id="cb" type="button">Copiar resultado</button></p></div>`;
  $('#cb').onclick=()=>{$('#cp').select();navigator.clipboard&&navigator.clipboard.writeText(txt);$('#cb').textContent='¡Copiado!'};
  scrollTo({top:document.body.scrollHeight,behavior:'smooth'});};
 function h(){return hoy()}
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
</script></main></body></html>
