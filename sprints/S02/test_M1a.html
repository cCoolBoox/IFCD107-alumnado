<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test corto de M1a · Fundamentos de IA</title>
<style>
:root{--bg:#f7f7fb;--fg:#1c1c28;--card:#fff;--mut:#5b5b70;--ac:#4f46e5;--ok:#15803d;--ko:#b91c1c;--bd:#d9d9e6}
@media (prefers-color-scheme:dark){:root{--bg:#14141c;--fg:#ececf4;--card:#1e1e2a;--mut:#a3a3b8;--ac:#8b85ff;--ok:#4ade80;--ko:#f87171;--bd:#34344a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}h1{font-size:1.4rem;margin:.2em 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:14px 0}
.mut{color:var(--mut)}.tag{font-size:.8rem;color:var(--ac);font-weight:600}
label.o{display:block;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;margin:6px 0;cursor:pointer}
label.o:hover{border-color:var(--ac)}input[type=radio]{margin-right:8px}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:1rem;cursor:pointer}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
input[type=text]{width:100%;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:1rem}
.ok{border-color:var(--ok)}.ko{border-color:var(--ko)}.res-ok{color:var(--ok);font-weight:600}.res-ko{color:var(--ko);font-weight:600}
.big{font-size:2rem;font-weight:700}
</style></head><body><main>
<h1 id="t"></h1><div id="app"></div>
<script>
const C={"titulo": "Test corto de M1a · Fundamentos de IA", "fecha": "2026-10-23", "salt": "37ad682834699c35", "tok": "ac307b762b9096f94e2118ca7773ee311a4594042eaa1fbe8a31ddf4173880c5", "qs": [{"id": 1, "tag": "UD 1a.1", "q": "¿Cuál es la relación correcta entre estos conceptos?", "o": ["IA ⊂ Machine learning ⊂ Deep learning", "Deep learning ⊂ Machine learning ⊂ IA", "Machine learning ⊂ IA ⊂ Deep learning", "Son tres campos sin relación"], "h": "bade24a468162c30e21e9b3660579c8907702e347f7023c5188b6208d18b1165"}, {"id": 2, "tag": "UD 1a.1", "q": "Una empresa quiere que un sistema transcriba llamadas de reserva a texto. ¿Qué modalidad de la IA es?", "o": ["Visión por computador", "Voz (reconocimiento del habla)", "Sistemas de recomendación", "Robótica"], "h": "4b8137dffe6381a497abe52041f366c57ed8b718861df4d9091d2114ab35156c"}, {"id": 3, "tag": "UD 1a.2", "q": "Quieres predecir el precio por noche (un número) de un alojamiento a partir de sus características. ¿Qué tipo de problema es?", "o": ["Clasificación", "Agrupación (clustering)", "Regresión", "Detección de anomalías"], "h": "53d8f10d31b286b8fc1175444068254c2d2b67eb8ff16fceda275b1d6a4b8ff0"}, {"id": 4, "tag": "UD 1a.3", "q": "TurisData quiere descubrir grupos de huéspedes con hábitos parecidos, sin categorías definidas de antemano. Es un problema de aprendizaje:", "o": ["supervisado", "por refuerzo", "no supervisado", "de regresión lineal"], "h": "a0c18da7d95d3b56c9f1f027b31b85f73cf5473d1129b0c65463824b8c5fc0d3"}, {"id": 5, "tag": "UD 1a.3", "q": "Un modelo acierta el 98 % en los datos de entrenamiento y solo el 65 % en los de test. Lo más probable es que:", "o": ["esté sobreajustado", "tenga infraajuste", "sea un modelo perfecto", "el test sea demasiado fácil"], "h": "3ff1633a7df27feb6a09a30313e8b30ec4cb7be4f11fdf5921d31fb6be04d18e"}, {"id": 6, "tag": "UD 1a.4", "q": "El producto escalar de (1, 2, 3) y (4, 0, −1) es:", "o": ["1", "7", "0", "(4, 0, −3)"], "h": "3d4f7fb95c70c24281e08789ebb6c5516be55af36cf5fd8107533185bf233a15"}, {"id": 7, "tag": "UD 1a.4", "q": "Multiplicamos una matriz de 2 filas y 3 columnas por otra de 3 filas y 4 columnas. El resultado tiene:", "o": ["2 filas y 4 columnas", "3 filas y 3 columnas", "4 filas y 2 columnas", "No se puede multiplicar"], "h": "41544e99509907acb945bc58a2e2a452638cd6603fff1ba022a101ee1eba6302"}, {"id": 8, "tag": "UD 1a.4", "q": "En el descenso del gradiente, si el paso (*learning rate*) es demasiado grande, lo más probable es que:", "o": ["el modelo converja más rápido siempre", "se pase del mínimo, oscile o incluso diverja", "el gradiente sea siempre cero", "el modelo se quede exactamente en el mismo punto"], "h": "6acc635698d442b92d5930b9ffbcce8da4b32362a045f48ce08b23285531ffb1"}, {"id": 9, "tag": "UD 1a.5", "q": "Las ganancias por reserva son 90, 95, 100, 100, 105, 110, 120 y 480 €. Para describir \"una reserva normal\" conviene usar:", "o": ["la media (150 €), porque incluye todos los valores", "la mediana (102,5 €), porque es robusta ante el valor atípico", "el máximo (480 €)", "la suma total"], "h": "caab90fc3a6e72a5c3cde5d056d262f3ac4bc14c21d8bdfdf6230deb17dbeebb"}, {"id": 10, "tag": "UD 1a.5", "q": "En una población, el 1 % de las reservas son fraudulentas. Un detector avisa en el 90 % de las fraudulentas y en el 5 % de las honestas. Si salta una alarma, la probabilidad de que sea fraude es aproximadamente:", "o": ["90 %", "50 %", "15 %", "1 %"], "h": "f3cc3eb31aeae56ff6759964537bf7fc3013ae18be5cbfa759520505266ca476"}, {"id": 11, "tag": "UD 1a.5", "q": "Se envía una encuesta de satisfacción solo a los clientes que dejaron su correo en la web. El principal problema es:", "o": ["un error de cálculo de la media", "un sesgo de selección: la muestra no representa a todos los clientes", "que la encuesta es demasiado larga", "ninguno, con muchos correos siempre vale"], "h": "de53b62680723c3d22f542b6c0e596ba53773fd42ce805727884e11f5e2eb506"}, {"id": 12, "tag": "UD 1a.5", "q": "La paradoja de Simpson consiste en que:", "o": ["la media siempre es mayor que la mediana", "una tendencia observada en el conjunto total puede invertirse al separar los datos por subgrupos", "dos variables no correlacionadas siempre son independientes", "una muestra grande siempre corrige el sesgo"], "h": "5b2e916b7914cb2428816fb79b225ff1268340792dd4844765700c090c50bce3"}], "minutos": 20, "sprint": "S02"};
const $=s=>document.querySelector(s);
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const hoy=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Atlantic/Canary'}).format(new Date());
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
$('#t').textContent=C.titulo;
(async()=>{
 const abrir=new URLSearchParams(location.search).get('abrir');
 const docente=abrir&&(await sha(abrir))===C.tok;
 const h=hoy();
 if(!docente&&h!==C.fecha){
  $('#app').innerHTML=`<div class="card"><p class="big">🔒</p><p>${h<C.fecha?'Este test todavía no está abierto.':'Este test ya no está abierto.'}</p><p class="mut">Solo se puede hacer el <b>${fmt(C.fecha)}</b>, en clase. Si te lo perdiste, díselo al docente.</p></div>`;return}
 start(docente)})();
function start(docente){
 const qs=C.qs.map(q=>({...q,idx:shuffle(q.o.map((_,i)=>i))}));
 let html=`<div class="card"><p class="mut">${C.qs.length} preguntas · unos ${C.minutos} minutos · una respuesta correcta por pregunta. Sin penalización por fallo. ${docente?'<b>(modo docente)</b>':''}</p><label>Tu nombre<input type="text" id="nom" placeholder="Nombre y apellidos" autocomplete="off"></label></div><form id="f">`;
 qs.forEach((q,i)=>{html+=`<div class="card" id="q${i}"><div class="tag">${i+1}${q.tag?' · '+q.tag:''}</div><p><b>${esc(q.q)}</b></p>`+q.idx.map((k,j)=>`<label class="o"><input type="radio" name="q${i}" value="${k}">${esc(q.o[k])}</label>`).join('')+`<div class="r mut"></div></div>`});
 html+=`<button type="submit">Terminar y ver mi nota</button></form><div id="res"></div>`;
 $('#app').innerHTML=html;
 $('#f').onsubmit=async e=>{e.preventDefault();
  const sin=qs.filter((q,i)=>!document.querySelector(`input[name=q${i}]:checked`)).length;
  if(sin&&!confirm(`Te quedan ${sin} sin responder. ¿Terminar igualmente?`))return;
  let ok=0;
  for(let i=0;i<qs.length;i++){const q=qs[i];const sel=document.querySelector(`input[name=q${i}]:checked`);
   let corr=-1;for(let k=0;k<4;k++){if(await sha(`${C.salt}|${q.id}|${q.o[k]}`)===q.h)corr=k}
   const acierto=sel&&+sel.value===corr;if(acierto)ok++;
   const box=$('#q'+i);box.classList.add(acierto?'ok':'ko');
   box.querySelector('.r').innerHTML=acierto?'<span class="res-ok">✔ Correcta</span>':`<span class="res-ko">✘ ${sel?'Incorrecta':'Sin responder'}.</span> Correcta: ${esc(q.o[corr])}`;}
  document.querySelectorAll('input[type=radio]').forEach(x=>x.disabled=true);$('#f button').remove();
  const n=qs.length,p=Math.round(ok/n*100),nom=($('#nom').value||'(sin nombre)').trim();
  const txt=`${nom} · ${C.titulo} · ${ok}/${n} (${p} %) · ${h()}`;
  $('#res').innerHTML=`<div class="card"><p class="big">${ok} / ${n}</p><p>${p>=60?'✅ Apto':'⚠️ Por debajo del 60 %'} (se aprueba con el 60 %).</p><p class="mut">Copia tu resultado y envíaselo al docente:</p><input type="text" readonly value="${esc(txt)}" id="cp"><p><button class="sec" id="cb" type="button">Copiar resultado</button></p></div>`;
  $('#cb').onclick=()=>{$('#cp').select();navigator.clipboard&&navigator.clipboard.writeText(txt);$('#cb').textContent='¡Copiado!'};
  scrollTo({top:document.body.scrollHeight,behavior:'smooth'});};
 function h(){return hoy()}
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
</script></main></body></html>
