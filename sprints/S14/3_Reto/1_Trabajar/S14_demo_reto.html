<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Demo interactiva del reto del Sprint 14 (IFCD107): la ficha de proyecto, el brief, la fuente con licencia, el EDA, la partición y el baseline, los riesgos, el backlog y la entrega.">
<title>Proyecto final: definir, tener datos y un punto de partida · demo interactiva</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Maqueta común de las demos del reto (IFCD107): hero → «el producto funcionando» con un selector de pasos
   → qué se sube y cómo se evalúa. Identidad: la de las infografías del curso (tinta azulada, óxido, verde azulado, crema). */
:root{
  --bg:#F5F1E8; --surface:#FFFFFF; --ink:#1D2433; --muted:#566073; --line:#D9D2C0; --soft:#EFE7D2;
  --accent:#C23B1F; --accent-soft:#F7DDD4; --teal:#0F7F7F; --teal-soft:#D5ECEA; --sky:#DCE6F5; --blue:#3D5F96;
  --ok:#1B7F4B; --ok-soft:#D9F0E3; --bad:#B42318; --bad-soft:#FBE0DC; --warn:#8A5A00; --warn-soft:#F6E7C4;
  --code-bg:rgba(29,36,51,.08); --focus:#1D2433; --pt:rgba(61,95,150,.42); --grid:#E4DDCB;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161F; --surface:#1B2230; --ink:#F1ECE0; --muted:#A3ADC0; --line:#2E3748; --soft:#232C3C;
    --accent:#F08A6C; --accent-soft:#3A2620; --teal:#58C7BE; --teal-soft:#16302F; --sky:#1F2C44; --blue:#8FB0E6;
    --ok:#6FD3A0; --ok-soft:#173226; --bad:#FF8D78; --bad-soft:#3A1E1A; --warn:#E9C46A; --warn-soft:#3A2F14;
    --code-bg:rgba(241,236,224,.1); --focus:#F1ECE0; --pt:rgba(143,176,230,.5); --grid:#2A3345; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161F; --surface:#1B2230; --ink:#F1ECE0; --muted:#A3ADC0; --line:#2E3748; --soft:#232C3C;
  --accent:#F08A6C; --accent-soft:#3A2620; --teal:#58C7BE; --teal-soft:#16302F; --sky:#1F2C44; --blue:#8FB0E6;
  --ok:#6FD3A0; --ok-soft:#173226; --bad:#FF8D78; --bad-soft:#3A1E1A; --warn:#E9C46A; --warn-soft:#3A2F14;
  --code-bg:rgba(241,236,224,.1); --focus:#F1ECE0; --pt:rgba(143,176,230,.5); --grid:#2A3345; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:44px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:clamp(30px,5.2vw,52px);line-height:1.05;font-weight:800;letter-spacing:-.02em;margin-top:8px}
h2{font-size:clamp(22px,3vw,28px);line-height:1.15;font-weight:800;letter-spacing:-.01em}
h3{font-size:17px;line-height:1.2;font-weight:800}
p{margin:0}
code{font-family:var(--f-mono);font-size:.86em;background:var(--code-bg);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
a{color:var(--accent);font-weight:700;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
button{font:inherit;color:inherit;cursor:pointer}
.kicker{font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--accent)}
.lead{font-size:clamp(17px,2vw,20px);color:var(--muted);max-width:62ch;margin-top:10px}
.hint{font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:5px 13px;font-size:14px;font-weight:700}
.btn{border:2px solid var(--ink);background:transparent;border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.small{padding:5px 11px;font-size:13px}
.btn.on{background:var(--ink);color:var(--bg)}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sh .st{font-family:var(--f-display);font-weight:800;font-size:14px;color:var(--accent);letter-spacing:.12em;white-space:nowrap}
.sh .ln{flex:1;height:2px;background:var(--line)}
.sec-intro{color:var(--muted);max-width:68ch;margin:-4px 0 16px}

/* selector de pasos */
.steps{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.step{display:flex;align-items:center;gap:9px;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 13px 7px 8px;text-align:left;font-weight:700;font-size:14px;line-height:1.2}
.step .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:14px}
.step small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.step[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.step[aria-pressed="true"] small{color:var(--bg);opacity:.8}
.aqui{background:var(--teal-soft);border-radius:12px;padding:11px 16px;margin-bottom:16px;font-size:15.5px;min-height:3.2em}
.aqui b{color:var(--teal)}

/* piezas del producto */
.stage{display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row2>*{min-width:0}
@media (max-width:860px){.row2{grid-template-columns:1fr}}
.pieza{background:var(--surface);border:2px solid var(--line);border-radius:14px;overflow:hidden;min-width:0;transition:opacity .2s,box-shadow .2s,border-color .2s}
.pieza>.bh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;border-bottom:2px solid var(--line);font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.pieza>.bb{padding:12px 14px}
.stage.sel .pieza{opacity:.5}
.stage.sel .pieza.hl{opacity:1;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.stage.sel .pieza.hl>.bh{color:var(--accent)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.duo>*{min-width:0}
@media (max-width:700px){.duo{grid-template-columns:1fr}}
.cap{font-size:13.5px;color:var(--muted);margin-top:6px}
.cap b{color:var(--ink)}

/* gráficos */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.chart .tl{font-size:11.5px;font-weight:700;fill:var(--ink)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ax{stroke:var(--muted);stroke-width:1.2}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.legend i.ln{width:18px;height:3px;border-radius:2px;vertical-align:3px}

/* mandos */
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-top:12px;padding-top:12px;border-top:2px solid var(--line)}
.ctl label{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.ctl input[type=range]{width:170px;accent-color:var(--accent)}
.ctl input[type=number],.ctl select{font-family:var(--f-mono);font-size:14px;padding:5px 8px;border:2px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.ctl input[type=number]{width:6em}
.ctl input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.read{font-family:var(--f-mono);font-size:13px;color:var(--ink);background:var(--soft);border-radius:8px;padding:6px 10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-weight:800;font-size:12.5px;letter-spacing:.04em}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.msg{margin-top:8px;font-size:14.5px;padding:8px 12px;border-radius:10px;background:var(--soft)}
.msg.ok{background:var(--ok-soft);color:var(--ok)} .msg.bad{background:var(--bad-soft);color:var(--bad)} .msg.warn{background:var(--warn-soft);color:var(--warn)}

/* tablas */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;text-align:left}
th{font-size:12.5px;font-weight:800;letter-spacing:.04em;color:var(--muted);border-bottom:2px solid var(--line)}
td{border-bottom:1px solid var(--line)}
td.num,th.num{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.sql{font-family:var(--f-mono);font-size:13px;background:var(--code-bg);border-radius:8px;padding:8px 12px;margin-bottom:10px;overflow-wrap:anywhere}

/* lista de comprobaciones */
.checks{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:5px}
.checks li{display:flex;gap:9px;align-items:baseline;font-size:14.5px}
.checks .m{flex:none;width:1.3em;text-align:center;font-weight:800}
.checks li.ok .m{color:var(--ok)} .checks li.no .m{color:var(--muted)} .checks li.bad .m{color:var(--bad)}
textarea{width:100%;min-height:130px;font:inherit;font-size:15px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);resize:vertical}

/* qué se sube y rúbrica */
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:22px}
.file{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:11px 14px}
.file b{font-family:var(--f-mono);font-size:13.5px;overflow-wrap:anywhere}
.file .o{display:block;font-size:13.5px;color:var(--muted);margin-top:3px}
.file .s{display:block;font-size:12.5px;font-weight:800;color:var(--teal);margin-top:6px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-weight:700;font-size:14.5px}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:900px){.levels{grid-template-columns:1fr 1fr}}
@media (max-width:540px){.levels{grid-template-columns:1fr}}
.lv{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 13px;font-size:14px}
.lv h3{font-size:14px;margin-bottom:5px;color:var(--muted)}
.lv.min{border-color:var(--teal)} .lv.min h3{color:var(--teal)}
.links{display:flex;flex-wrap:wrap;gap:10px}
.foot{font-size:13.5px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

<script>
const DEMO = {"kicker":"IFCD107 · SPRINT 14 · DEMO DEL RETO","titulo":"Proyecto final: definir, tener datos y un punto de partida","lead":"Sois una consultora de IA y el docente es el cliente y Product Owner.","aviso":"Es una demo para entender adónde vamos: **no se entrega nada desde aquí** y no se guarda nada. El EDA, la partición y el baseline están calculados de verdad con los datos de práctica (sintéticos, TurisData no existe); la ficha, los riesgos, el backlog y los nombres del equipo son un ejemplo inventado. Vuestro proyecto tendrá otros datos y otras cifras.","widget":"proyecto","widget_titulo":"Un proyecto de IA antes de entrenar nada","intro":"Esto es lo que tendréis al acabar el reto, con los datos de práctica de TurisData. **Tocad los mandos:** estropead la pregunta de la ficha y mirad qué pruebas fallan, descartad una fuente sin licencia, subid el múltiplo del IQR, bajad el porcentaje de cancelaciones hasta que la exactitud engañe y escribid un riesgo genérico. Después, elegid un paso para ver qué pieza construís en él.","aqui_todo":"Elegid un paso del reto y se ilumina **la pieza que construís en él**. Pulsad otra vez el mismo paso para verlo todo.","pasos":[{"n":"1","titulo":"Planning, píldora y taller","corto":"Planning y taller","min":75,"piezas":["ficha"],"aqui":"Aquí repartís los cuatro roles y rellenáis el *canvas*: pregunta, quién usa el resultado, decisión que mejora, datos y métrica. En la ficha se ven esas casillas y las pruebas que pasa una buena pregunta."},{"n":"2","titulo":"Elegir el brief","corto":"Elegir el brief","min":15,"piezas":["brief"],"aqui":"Aquí puntuáis cada brief de 1 a 5 en datos, interés y tiempo; gana el que más suma y, si empatan, el que tiene más nota en datos."},{"n":"3","titulo":"Buscar y validar datos","corto":"Datos con licencia","min":60,"piezas":["fuentes"],"aqui":"Aquí respondéis a las cinco preguntas de cada fuente y rellenáis su fila del inventario; sin licencia clara, la fuente no se usa."},{"n":"4","titulo":"Ficha del proyecto y entrega","corto":"Ficha del proyecto","min":50,"piezas":["ficha"],"aqui":"Aquí copiáis la plantilla y la rellenáis en una página; la métrica y el umbral se escriben ya, antes de ver ningún resultado."},{"n":"5","titulo":"Go / no-go, EDA, calidad del dato y baseline","corto":"EDA y baseline","min":200,"piezas":["eda","baseline"],"aqui":"Aquí miráis los datos (nulos, duplicados, raros, sesgo y fuga), fijáis la partición y la métrica antes de calcular y construís el baseline, el suelo que habrá que superar."},{"n":"6","titulo":"Backlog, plan ético y repositorio","corto":"Backlog y riesgos","min":140,"piezas":["riesgos","backlog"],"aqui":"Aquí adaptáis las historias del backlog, escribís al menos cinco riesgos específicos de vuestros datos y clasificáis el sistema en el AI Act."},{"n":"7","titulo":"Revisión, entrega, review y retro","corto":"Revisión y entrega","min":60,"piezas":["entrega"],"aqui":"Aquí comprobáis que en `sprint-14/` están los 6 ficheros del equipo y una hoja por persona, y que el README y el `requirements.txt` van en la raíz."}],"ficheros":[{"nombre":"ficha_proyecto.md","origen":"Lo creáis a partir de una plantilla.","sube":"Sí · sprint-14/. El día 1 antes de las 14:30; si el go / no-"},{"nombre":"plan_datos_licencias.md","origen":"Lo creáis a partir de una plantilla.","sube":"Sí · sprint-14/"},{"nombre":"01_eda.ipynb","origen":"Lo creáis.","sube":"Sí · sprint-14/"},{"nombre":"02_baseline.ipynb","origen":"Lo creáis.","sube":"Sí · sprint-14/"},{"nombre":"backlog_y_sprints.md","origen":"Lo creáis a partir de una plantilla.","sube":"Sí · sprint-14/"},{"nombre":"riesgos_eticos.md","origen":"Lo creáis a partir de una plantilla.","sube":"Sí · sprint-14/"},{"nombre":"README.md","origen":"Lo creáis a partir de una plantilla.","sube":"Sí · raíz del repositorio (no en sprint-14/)"},{"nombre":"requirements.txt","origen":"Lo creáis.","sube":"Sí · raíz del repositorio"},{"nombre":"Datos descargados","origen":"Ya hecho.","sube":"Solo si la licencia permite redistribuirlos y pesan poco · d"},{"nombre":"descargar_datos.py","origen":"Lo creáis.","sube":"Solo si no subís los datos · sprint-14/"},{"nombre":"autoevaluacion_nombre.md","origen":"Ya hecha, en blanco","sube":"Sí, una por persona (no una por equipo) · sprint-14/"}],"sube_resumen":"8 ficheros + 1 hoja por persona","carpeta_entrega":"sprint-14/","rubrica":[{"criterio":"Corrección técnica","pregunta":"¿está bien hecho?","niveles":["Hay documentos, pero falta la pregunta o la métrica, o los cuadernos no se ejecutan","La ficha tiene pregunta, decisión y las dos métricas; 01_eda.ipynb y 02_baseline.ipynb se ejecutan de arriba abajo y el baseline da una métrica","La métrica y la partición se escribieron antes de ver resultados y no hay fuga (temporal si hay series); el informe de calidad tiene nulos, duplicados, valores raros y sesgos; el baseline es lo más simple posible","Además, un EDA por subgrupos con un hallazgo que cambia el enfoque y aparece en la ficha"]},{"criterio":"Reproducibilidad","pregunta":"¿lo puede repetir otra persona?","niveles":["No se sabe de dónde salen los datos o los cuadernos solo funcionan en un ordenador","El plan de datos tiene fuente, enlace y licencia, pero el README no dice cómo descargarlos o ejecutar los cuadernos en orden","Otra persona descarga los datos y obtiene la misma métrica del baseline siguiendo solo el README; hay requirements.txt y commits de todas las personas, sin claves ni datos personales","Además, el linaje está completo (descarga, limpieza, partición), el README indica versión de Python y semilla, y el script de descarga funciona desde cero"]},{"criterio":"Análisis y comunicación al cliente","pregunta":"¿lo entiende quien no programa?","niveles":["La pregunta es vaga («analizar el turismo») y no dice qué decisión apoya","La pregunta cabe en una frase y hay cliente, pero la decisión o la métrica de negocio no están claras","La ficha dice qué decisión mejora y qué pasa hoy sin el modelo, con un umbral de éxito en términos del cliente; en la review se explica el hallazgo del EDA y el baseline sin jerga","Además, cuantifica el valor para el cliente (euros, horas o errores evitados) y explica qué cambió de la ficha tras el go / no-go o el EDA"]},{"criterio":"IA responsable","pregunta":"¿se sabe qué hizo la IA y qué riesgos hay?","niveles":["No dice si se ha usado IA ni hay riesgos","Dice que se ha usado IA sin detalle; la ficha tiene tres riesgos y una clasificación AI Act, aunque sean genéricos","Dice qué se pidió, qué se comprobó a mano y qué se cambió; el registro tiene al menos 5 riesgos específicos de vuestros datos con probabilidad, impacto, medida y responsable, y la clasificación RGPD / AI Act está justificada","Además, cada riesgo alto tiene una medida enlazada a una historia del backlog y se cuenta un caso concreto en que la IA inventó o falló en algo y cómo lo detectasteis"]}],"enlaces":[{"t":"Reto en una página","url":"https://github.com/cCoolBoox/IFCD107-alumnado/blob/main/sprints/S14/3_Reto/1_Trabajar/Reto_Sprint_14_una_pagina.md"},{"t":"Qué se sube y la rúbrica","url":"https://github.com/cCoolBoox/IFCD107-alumnado/blob/main/sprints/S14/3_Reto/2_Entregar/entrega_y_rubrica.md"},{"t":"Ficha completa del reto","url":"https://github.com/cCoolBoox/IFCD107-alumnado/blob/main/sprints/S14/3_Reto/3_Consultar/Reto_Sprint_14.md"},{"t":"README del Sprint 14","url":"https://github.com/cCoolBoox/IFCD107-alumnado/blob/main/sprints/S14/README.md"}],"pie":"El reto se hace en vuestro repositorio y en dos cuadernos de Colab nuevos (`01_eda.ipynb` y `02_baseline.ipynb`), no en esta página. Si algo de aquí no se entiende, está explicado paso a paso en la ficha del reto.","datos":{"forma":[6000,18],"ficheros":[{"nombre":"reservas_turisdata.csv","kb":648,"filas":6000,"cols":18,"desde":"2024-01-01","hasta":"2025-12-30"},{"nombre":"ocupacion_diaria.csv","kb":31,"filas":1096,"cols":5,"desde":"2023-01-01","hasta":"2025-12-31"}],"calidad":[["id_reserva","int64",0,0.0,6000],["fecha_rese   $(b, '#w14-rg2').addEventListener('click', () => { RG[0] = {r: 'Cuidado con los sesgos.', t: 'modelo', p: 3, i: 3, m: 'Proteger los datos.', rs: ROLES[0], e: 'abierto'}; riesgosPintar(); });
  $(b, '#w14-rr2').addEventListener('click', () => { RG = RK.map(x => Object.assign({}, x)); riesgosPintar(); });
  riesgosPintar();
  const IA = {min: ['mínimo', 'ok', 'Un sistema que solo predice demanda agregada suele ser de riesgo <b>mínimo<\/b>. Aun así: documentad límites y usos no permitidos en la <i>model card<\/i>.'],
    lim: ['limitado', 'warn', 'Un chatbot que informa a personas tiene obligaciones de <b>transparencia<\/b>: quien lo usa debe saber que habla con una IA.'],
    alto: ['alto', 'bad', 'Un sistema que decide sobre el acceso de personas a educación, empleo o servicios esenciales entra en <b>alto riesgo<\/b>: transparencia, supervisión humana y documentación reforzadas.']};
  const im = live($(b, '#w14-im'));
  function aiact(){ const x = IA[$(b, '#w14-ia').value]; const p = $(b, '#w14-ip'); p.className = 'pill ' + x[1]; p.textContent = 'riesgo ' + x[0]; msg(im, x[1], x[2] + ' <i>Es una orientación: verificad el texto vigente con el docente antes de fijarla.<\/i>'); }
  $(b, '#w14-ia').addEventListener('change', aiact); aiact();

  /* ───────────── 7 · backlog ───────────── */
  }
  {
  const b = pieza(host, 'backlog', 'BACKLOG · backlog_y_sprints.md');
  const HIS = [
    ['Como cliente quiero una pregunta con métrica para saber si el proyecto vale la pena', 'Ficha aprobada (go)', 'S', 14], ['Como responsable de datos quiero documentar fuente y licencia', 'Plan de datos completo', 'S', 14],
    ['Como equipo queremos un EDA para conocer los datos', 'Informe de calidad + 3 hallazgos', 'M', 14], ['Como equipo queremos un baseline para poder comparar', 'Métrica y partición definidas', 'S', 14],
    ['Como equipo queremos ≥ 3 modelos comparados con validación correcta', 'Registro de experimentos', 'L', 15], ['Como equipo queremos un modelo de red neuronal (o LLM/RAG)', 'Entrenado y registrado', 'L', 15],
    ['Como cliente quiero gráficos claros del error', 'Curvas, matriz, importancia', 'M', 16], ['Como responsable ético quiero analizar sesgos y mitigarlos', 'Métricas por subgrupo + medida', 'M', 16],
    ['Como usuario quiero probar el modelo en un demostrador', 'Demo estable y plan B', 'L', 16], ['Como cliente quiero una memoria técnica', '10-15 páginas', 'L', 16],
    ['Como equipo queremos una presentación de máx. 12 diapositivas', 'Ensayo general hecho', 'M', 17], ['Como equipo queremos repartir preguntas de defensa', 'Todos hablan', 'S', 17]].map(h => ({h: h[0], c: h[1], t: h[2], s: h[3], on: true}));
  const HITOS = {14: '3 días · día 1 brief y ficha · día 2 go / no-go', 15: '3 días · último día: modelo candidato', 16: '3 días · último día, 14:30: congelación', 17: '2 días · día 1 ensayo · día 2 defensa'};
  b.innerHTML = `<p class="cap" style="margin:0 0 8px">Las doce historias de ejemplo de la plantilla. <b>Quitad o cambiad<\/b> alguna y añadid la vuestra (H13…): hacen falta entre 10 y 15, cada una con su criterio de aceptación.<\/p>
    <div class="scroll"><table class="w14-bk"><thead><tr><th><\/th><th>ID<\/th><th>Historia<\/th><th>Criterio de aceptación<\/th><th>Tam.<\/th><th>Sprint<\/th><\/tr><\/thead><tbody id="w14-bt"><\/tbody><\/table><\/div>
    <div class="w14-g" style="margin-top:10px"><label class="w14-f"><span>Nueva historia: «Como … quiero … para …»<\/span><input type="text" id="w14-nh" placeholder="Como cliente quiero ver el error por país para saber cuándo no fiarme"><\/label>
      <div class="w14-g" style="grid-template-columns:1fr auto auto"><label class="w14-f"><span>Criterio de aceptación<\/span><input type="text" id="w14-nc" placeholder="Gráfico del error por país"><\/label><label class="w14-f"><span>Tam.<\/span><select id="w14-nt">${opts(['S', 'M', 'L'], 'M')}<\/select><\/label><label class="w14-f"><span>Sprint<\/span><select id="w14-ns">${opts([14, 15, 16, 17], 16)}<\/select><\/label><\/div><\/div>
    <div class="ctl w14-t" style="margin-top:6px"><button type="button" class="btn small" id="w14-na" disabled>+ Añadir historia<\/button><span class="read" id="w14-nr"><\/span><\/div>
    <div class="w14-bars" id="w14-bb" style="margin-top:10px"><\/div><div class="msg" id="w14-bm2"><\/div>`;
  const bt = $(b, '#w14-bt'), bm2 = live($(b, '#w14-bm2'));
  const FORMATO = /^\s*como\s+.{3,}\s+quiero\s+.{3,}\s+para\s+.{3,}/i;
  function backlogPintar(){
    bt.innerHTML = HIS.map((x, k) => `<tr data-k="${k}"><td><input type="checkbox" data-c="on" ${x.on ? 'checked' : ''} aria-label="Incluir H${k + 1}"><\/td><td>H${k + 1}<\/td><td>${esc(x.h)}<\/td><td>${esc(x.c)}<\/td>
      <td><select data-c="t" aria-label="Tamaño de H${k + 1}">${opts(['S', 'M', 'L'], x.t)}<\/select><\/td><td><select data-c="s" aria-label="Sprint de H${k + 1}">${opts([14, 15, 16, 17], x.s)}<\/select><\/td><\/tr>`).join('');
    backlogCuenta();
  }
  function backlogCuenta(){
    const act = HIS.filter(x => x.on), n = act.length, por = [14, 15, 16, 17].map(s => act.filter(x => x.s === s).length), mx = Math.max(...por, 1);
    $$(bt, 'tr').forEach((tr, k) => { tr.style.opacity = HIS[k].on ? 1 : .45; });
    $(b, '#w14-bb').innerHTML = [14, 15, 16, 17].map((s, i) => `<div class="w14-br" style="grid-template-columns:minmax(0,11em) 1fr 2.4em"><span class="l">Sprint ${s}<\/span><div class="w14-tr"><div class="w14-fl${por[i] ? '' : ' x'}" style="width:${por[i] / mx * 100}%"><\/div><\/div><span class="v">${por[i]}<\/span><\/div><div class="cap" style="margin:-2px 0 4px">${HITOS[s]}<\/div>`).join('');
    const vacio = por.findIndex(v => v === 0);
    if (n < 10) msg(bm2, 'bad', `<b>${n} historias: faltan ${10 - n}.<\/b> La rúbrica estándar pide entre 10 y 15.`);
    else if (n > 15) msg(bm2, 'bad', `<b>${n} historias: sobran ${n - 15}.<\/b> Juntad las muy pequeñas: un backlog de 40 tareas vagas no sirve.`);
    else if (vacio >= 0) msg(bm2, 'warn', `<b>${n} historias, pero el sprint ${14 + vacio} se queda sin ninguna.<\/b> Cada sprint necesita su objetivo y sus historias.`);
    else msg(bm2, 'ok', `<b>${n} historias<\/b> repartidas en los cuatro sprints. Falta lo más importante: que cada una se pueda comprobar con su criterio.`);
  }
  bt.addEventListener('change', ev => { const c = ev.target.closest('[data-c]'); if (!c) return; const k = +c.closest('tr').dataset.k; HIS[k][c.dataset.c] = c.dataset.c === 'on' ? c.checked : c.dataset.c === 's' ? +c.value : c.value; backlogCuenta(); });
  const nh = $(b, '#w14-nh'), nc = $(b, '#w14-nc'), na = $(b, '#w14-na'), nr = live($(b, '#w14-nr'));
  function nueva(){
    const f = FORMATO.test(nh.value), c = palabras(nc.value) >= 2, lleno = HIS.length >= 20;
    na.disabled = !(f && c) || lleno;
    nr.textContent = !nh.value.trim() ? 'Escribid una historia y su criterio' : !f ? '✗ le falta «Como … quiero … para …»' : !c ? '✗ falta el criterio de aceptación' : lleno ? 'ya no caben más' : '✓ lista para añadir';
  }
  nh.addEventListener('input', nueva); nc.addEventListener('input', nueva);
  na.addEventListener('click', () => { HIS.push({h: nh.value.trim(), c: nc.value.trim(), t: $(b, '#w14-nt').value, s: +$(b, '#w14-ns').value, on: true}); nh.value = ''; nc.value = ''; backlogPintar(); nueva(); });
  backlogPintar(); nueva();

  /* ───────────── 8 · qué se sube y dónde ───────────── */
  }
  {
  const b = pieza(host, 'entrega', 'ENTREGA · 6 ficheros del equipo + 1 hoja por persona');
  const GENTE = ['marta', 'luis', 'ana', 'pablo'];
  const EQ = ['ficha_proyecto.md', 'plan_datos_licencias.md', '01_eda.ipynb', '02_baseline.ipynb', 'backlog_y_sprints.md', 'riesgos_eticos.md'];
  const DONDE = [['sprint', 'sprint-14/'], ['raiz', 'raíz del repositorio'], ['no', 'no se sube']];
  b.innerHTML = `<div class="ctl w14-t" style="margin-top:0;padding-top:0;border:0"><label>Personas en el equipo <select id="w14-np">${opts([3, 4], 3)}<\/select><\/label><span class="pill" id="w14-ep"><\/span><\/div>
    <div id="w14-el"><\/div><div class="msg" id="w14-em"><\/div>`;
  const POS = {};   // fichero → dónde está ahora
  EQ.forEach(f => POS[f] = 'sprint'); GENTE.forEach(g => POS[`autoevaluacion_${g}.md`] = 'sprint');
  POS['README.md'] = 'sprint'; POS['requirements.txt'] = 'raiz'; POS['canvas borrador (papel o pizarra)'] = 'no';
  const BUENO = f => /^README|^requirements/.test(f) ? 'raiz' : /^canvas/.test(f) ? 'no' : 'sprint';
  const AYUDA = {'README.md': 'va a la <b>raíz<\/b>, no a <code>sprint-14/<\/code>', 'requirements.txt': 'va a la <b>raíz<\/b>', 'canvas borrador (papel o pizarra)': 'no se sube (es solo para decidir)'};
  const em = live($(b, '#w14-em'));
  function entrega(foco){
    const n = +$(b, '#w14-np').value, lista = [...EQ, ...GENTE.slice(0, n).map(g => `autoevaluacion_${g}.md`), 'README.md', 'requirements.txt', 'canvas borrador (papel o pizarra)'];
    $(b, '#w14-el').innerHTML = lista.map((f, i) => { const ok = POS[f] === BUENO(f); return `<div class="w14-row ${ok ? 'ok' : 'bad'}"><span class="m" aria-hidden="true">${ok ? '✓' : '✗'}<\/span><span class="nm">${esc(f)}<\/span><select data-f="${i}" aria-label="Dónde está ${esc(f)}">${opts(DONDE, POS[f])}<\/select><\/div>`; }).join('');
    $$(b, '#w14-el select').forEach((s, i) => s.addEventListener('change', () => { POS[lista[i]] = s.value; entrega(i); }));
    if (foco != null) $$(b, '#w14-el select')[foco].focus();
    const enS = lista.filter(f => POS[f] === 'sprint').length, buenos = lista.filter(f => POS[f] === BUENO(f)).length, meta = 6 + n;
    const p = $(b, '#w14-ep'); p.className = 'pill ' + (buenos === lista.length ? 'ok' : 'warn'); p.textContent = `6 + ${n} = ${meta} ficheros en sprint-14/`;
    const mal = lista.filter(f => POS[f] !== BUENO(f));
    if (!mal.length) msg(em, 'ok', `<b>Todo en su sitio:<\/b> ${meta} ficheros en <code>sprint-14/<\/code> (los 6 del equipo y una autoevaluación por persona), y el README y el <code>requirements.txt<\/code> en la raíz.`);
    else msg(em, 'bad', `<b>${enS} en <code>sprint-14/<\/code>, deberían ser ${meta}.<\/b> ` + mal.slice(0, 3).map(f => `<code>${esc(f)}<\/code>: ${/^autoev/.test(f) ? 'cada persona sube la suya' : AYUDA[f] || 'se sube a <code>sprint-14/<\/code>'}`).join('; ') + '.');
  }
  $(b, '#w14-np').addEventListener('change', () => entrega()); entrega();
  }
  return {};
};

/* ───────── marco común ───────── */
const app = document.getElementById('app');
const sh = (t) => `<div class="sh"><span class="st">${esc(t)}</span><span class="ln"></span></div>`;

const hero = el('header');
const totalMin = D.pasos.reduce((s, p) => s + (p.min || 0), 0);
hero.innerHTML = `<div class="kicker">${esc(D.kicker)}</div><h1>${esc(D.titulo)}</h1><p class="lead">${md(D.lead)}</p>
  <div class="chips"><span class="chip">${D.pasos.length} pasos</span><span class="chip">≈ ${totalMin} min de reto</span><span class="chip">${esc(D.sube_resumen)}</span></div>
  <p class="hint" style="margin-top:14px">${md(D.aviso)}</p>`;
app.appendChild(hero);

const play = el('section');
play.innerHTML = sh('EL PRODUCTO FUNCIONANDO') + `<h2>${esc(D.widget_titulo)}</h2><p class="sec-intro">${md(D.intro)}</p>`;
const steps = el('div', 'steps'); steps.setAttribute('role', 'group'); steps.setAttribute('aria-label', 'Pasos del reto');
const aqui = el('div', 'aqui'); aqui.setAttribute('aria-live', 'polite');
const stage = el('div', 'stage');
play.append(steps, aqui, stage);
app.appendChild(play);
const widget = W[D.widget](stage, D);

function elegir(i){
  const btns = steps.querySelectorAll('.step');
  btns.forEach((b, k) => b.setAttribute('aria-pressed', String(k === i)));
  const panels = stage.querySelectorAll('[data-pieza]');
  if (i < 0) { stage.classList.remove('sel'); panels.forEach(p => p.classList.remove('hl')); aqui.innerHTML = md(D.aqui_todo); return; }
  const p = D.pasos[i];
  stage.classList.add('sel');
  panels.forEach(pn => pn.classList.toggle('hl', pn.dataset.pieza.split(' ').some(x => (p.piezas || []).includes(x))));
  aqui.innerHTML = `<b>Paso ${esc(p.n)} · ${esc(p.titulo)}</b> (${p.min} min). ${md(p.aqui || '')}`;
  const first = stage.querySelector('.pieza.hl'); if (first && first.getBoundingClientRect().top > window.innerHeight * .8) first.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center'});
}
D.pasos.forEach((p, i) => {
  const b = el('button', 'step', `<span class="n">${esc(p.n)}</span><span>${esc(p.corto || p.titulo)}<small>${p.min} min</small></span>`);
  b.type = 'button'; b.setAttribute('aria-pressed', 'false'); b.addEventListener('click', () => elegir(steps.querySelector('.step[aria-pressed="true"]') === b ? -1 : i));
  steps.appendChild(b);
});
elegir(-1);

/* qué se sube y cómo se evalúa */
const fin = el('section');
fin.innerHTML = sh('QUÉ SE SUBE Y CÓMO SE EVALÚA') + `<h2>Lo que entregáis y con qué se puntúa</h2><p class="sec-intro">Todo va al repositorio del equipo, en la carpeta <code>${esc(D.carpeta_entrega)}</code>. La rúbrica es la misma que usáis para revisar vuestro propio trabajo antes de subirlo.</p>`;
const files = el('div', 'files');
D.ficheros.forEach(f => files.appendChild(el('div', 'file', `<b>${esc(f.nombre)}</b><span class="o">${md(f.origen)}</span><span class="s">${esc(f.sube)}</span>`)));
fin.appendChild(files);
const tabs = el('div', 'tabs'); tabs.setAttribute('role', 'tablist');
const lv = el('div', 'levels'); lv.setAttribute('aria-live', 'polite');
const qq = el('p', 'hint'); qq.style.marginBottom = '10px';
const NIV = ['1 · Empezado', '2 · Mínimo', '3 · Estándar', '4 · Extra'];
function criterio(k){
  tabs.querySelectorAll('.tab').forEach((t, j) => t.setAttribute('aria-selected', String(j === k)));
  const c = D.rubrica[k]; qq.textContent = c.pregunta;
  lv.innerHTML = c.niveles.map((t, j) => `<div class="lv${j === 1 ? ' min' : ''}"><h3>${NIV[j]}</h3><p>${md(t)}</p></div>`).join('');
}
D.rubrica.forEach((c, k) => { const t = el('button', 'tab', esc(c.criterio)); t.type = 'button'; t.setAttribute('role', 'tab'); t.addEventListener('click', () => criterio(k)); tabs.appendChild(t); });
fin.append(tabs, qq, lv);
fin.appendChild(el('p', 'hint', 'Orientación: lo que pide el nivel mínimo sale en un <b>2</b>, el estándar en un <b>3</b> y los extras en un <b>4</b>. Sin una frase de prueba escrita, el nivel no vale.'));
criterio(0);
app.appendChild(fin);

const pie = el('footer');
pie.innerHTML = sh('DÓNDE SEGUIR') + `<div class="links">${D.enlaces.map(e => `<a class="btn" href="${esc(e.url)}">${esc(e.t)}</a>`).join('')}</div><p class="foot" style="margin-top:14px">${md(D.pie)}</p>`;
app.appendChild(pie);
})();
