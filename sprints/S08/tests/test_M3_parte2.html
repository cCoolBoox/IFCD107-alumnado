<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test de M3 · parte 2 (UD 3.5 a 3.8)</title>
<style>
:root{--bg:#f7f7fb;--fg:#1c1c28;--card:#fff;--mut:#5b5b70;--ac:#4f46e5;--ok:#15803d;--ko:#b91c1c;--bd:#d9d9e6}
@media (prefers-color-scheme:dark){:root{--bg:#14141c;--fg:#ececf4;--card:#1e1e2a;--mut:#a3a3b8;--ac:#8b85ff;--ok:#4ade80;--ko:#f87171;--bd:#34344a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}h1{font-size:1.4rem;margin:.2em 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:14px 0}
.mut{color:var(--mut)}.tag{font-size:.8rem;color:var(--ac);font-weight:600}
label.o{display:block;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;margin:6px 0;cursor:pointer}
label.o:hover{border-color:var(--ac)}input[type=radio]{margin-right:8px}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:1rem;cursor:pointer}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
input[type=text]{width:100%;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:1rem}
.ok{border-color:var(--ok)}.ko{border-color:var(--ko)}.res-ok{color:var(--ok);font-weight:600}.res-ko{color:var(--ko);font-weight:600}
.big{font-size:2rem;font-weight:700}
</style></head><body><main>
<h1 id="t"></h1><div id="app"></div>
<script>
const C={"titulo": "Test de M3 · parte 2 (UD 3.5 a 3.8)", "salt": "ec303f76bc31c059", "qs": [{"id": 1, "tag": "UD 3.5", "q": "¿Por qué es imprescindible escalar las variables antes de usar k-NN?", "o": ["Porque k-NN solo admite valores entre 0 y 1.", "Para que el modelo se ajuste más rápido.", "Porque elimina los nulos.", "Porque usa distancias: una variable con valores grandes dominaría a las demás."], "h": "58b1b87dfa7a024021a2d1e7428f728d0341b80136657d4d86e837e052a1602b"}, {"id": 2, "tag": "UD 3.5", "q": "¿Qué significa que Naive Bayes sea «ingenuo»?", "o": ["Que solo funciona con datos sin ruido.", "Que ignora la probabilidad a priori de cada clase.", "Que supone que las variables son independientes entre sí dada la clase.", "Que no usa el teorema de Bayes."], "h": "1cb8dfbbefb5ac2db947d0937b386ec86a32399c15078913ff3f96a6d8b7d69c"}, {"id": 3, "tag": "UD 3.6", "q": "¿Qué indica que un árbol de decisión tenga AUC 1,00 en entrenamiento y 0,58 en test?", "o": ["Que el árbol es excelente.", "Que hay un error en las etiquetas.", "Que hay sobreajuste: ha memorizado el entrenamiento y no generaliza.", "Que hay que añadir más profundidad."], "h": "6fe632a4754e0cc22b1b5ba700794cf7713db620aa8f30a26ad2abfcdd6edb0e"}, {"id": 4, "tag": "UD 3.6", "q": "¿Qué ventaja principal tiene un árbol de decisión pequeño frente a otros modelos?", "o": ["Es el más preciso siempre.", "Sus reglas «si… entonces…» se pueden leer y explicar a un gerente.", "No necesita datos de entrenamiento.", "No se sobreajusta nunca."], "h": "e811282aca67d97642e64af82924b49f3121870834958821d076876dc89c270c"}, {"id": 5, "tag": "UD 3.7", "q": "¿Qué diferencia esencial hay entre Random Forest y Gradient Boosting?", "o": ["El bosque entrena árboles independientes y promedia; el boosting los entrena en cadena, cada uno corrigiendo los errores del anterior.", "El bosque solo sirve para regresión.", "El boosting entrena árboles en paralelo sin relación entre ellos.", "No hay diferencia, son sinónimos."], "h": "dc41dda02a7550d03b9e1312d56ec936b671422755bbd000e2e55eb363bb9b3b"}, {"id": 6, "tag": "UD 3.7", "q": "En XGBoost o LightGBM, ¿qué efecto tiene bajar la tasa de aprendizaje (`learning_rate`) manteniendo el resto?", "o": ["Cada árbol aporta menos, así que suelen hacer falta más árboles y el modelo es más difícil de sobreajustar.", "El modelo entrena más rápido y siempre mejora.", "Se eliminan las variables poco útiles.", "No tiene efecto si hay parada temprana."], "h": "79e8a25e0e20c89e197602101c628a3587c1f83b820d770e55f865d6fc803a06"}, {"id": 7, "tag": "UD 3.7", "q": "¿Qué es la importancia de variables por permutación?", "o": ["El número de veces que una variable aparece en el árbol.", "La caída del rendimiento al desordenar al azar los valores de una variable; mide cuánto usa el modelo esa variable.", "La correlación de la variable con la etiqueta.", "El coeficiente de una regresión lineal."], "h": "b0028a732de4bc599d4ffcc54b46ae7b25702786123b0e85f7c6e03b7842452c"}, {"id": 8, "tag": "UD 3.8", "q": "¿Qué significa el hiperparámetro `C` en una SVM?", "o": ["El número de variables.", "La cantidad de vecinos.", "La profundidad del árbol.", "La penalización por errores de clasificación: `C` alto ajusta más al entrenamiento (riesgo de sobreajuste); `C` bajo da un margen más amplio y tolerante."], "h": "1297c3b4db75c5dcdb1a83e25fdccb931b7ef17cba6f18058c0dac4b80e1591f"}, {"id": 9, "tag": "UD 3.8", "q": "¿Por qué hay que escalar las variables antes de una SVM con kernel RBF y por qué una SVM se descarta con muchos millones de filas?", "o": ["Porque usa distancias entre puntos y su coste crece casi cuadráticamente con el número de filas.", "Porque solo admite variables entre 0 y 1 y ocupa mucho disco.", "Porque las SVM no admiten variables categóricas y tardan poco.", "Porque no es un modelo supervisado."], "h": "560cc32cd1a19632ef8258903c207bdbb0f0f45cc6c5d574a7abffa2d4b38022"}, {"id": 10, "tag": "Búsqueda de hiperparámetros, UD 3.6–3.8", "q": "Se ha hecho una búsqueda con `GridSearchCV` sobre train y se ha elegido el mejor modelo. ¿Cuál es el uso correcto del conjunto de test?", "o": ["Usarlo para comparar todas las combinaciones y elegir la mejor.", "Usarlo una sola vez, al final, con el modelo elegido, para estimar su rendimiento real.", "No usarlo nunca.", "Añadirlo a la búsqueda para tener más datos."], "h": "44aaba248aa7cfec4d98b3b64b15ad73335cd437befc9faea87f80c4828ad618"}], "minutos": 17, "sprint": "S08"};
const $=s=>document.querySelector(s);
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const hoy=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Atlantic/Canary'}).format(new Date());
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
$('#t').textContent=C.titulo;
start();
function start(){
 const qs=C.qs.map(q=>({...q,idx:shuffle(q.o.map((_,i)=>i))}));
 let html=`<div class="card"><p class="mut">${C.qs.length} preguntas · unos ${C.minutos} minutos · una respuesta correcta por pregunta. Sin penalización por fallo.</p><label>Tu nombre<input type="text" id="nom" placeholder="Nombre y apellidos" autocomplete="off"></label></div><form id="f">`;
 qs.forEach((q,i)=>{html+=`<div class="card" id="q${i}"><div class="tag">${i+1}${q.tag?' · '+q.tag:''}</div><p><b>${esc(q.q)}</b></p>`+q.idx.map((k,j)=>`<label class="o"><input type="radio" name="q${i}" value="${k}">${esc(q.o[k])}</label>`).join('')+`<div class="r mut"></div></div>`});
 html+=`<button type="submit">Terminar y ver mi nota</button></form><div id="res"></div>`;
 $('#app').innerHTML=html;
 $('#f').onsubmit=async e=>{e.preventDefault();
  const sin=qs.filter((q,i)=>!document.querySelector(`input[name=q${i}]:checked`)).length;
  if(sin&&!confirm(`Te quedan ${sin} sin responder. ¿Terminar igualmente?`))return;
  let ok=0;
  for(let i=0;i<qs.length;i++){const q=qs[i];const sel=document.querySelector(`input[name=q${i}]:checked`);
   let corr=-1;for(let k=0;k<4;k++){if(await sha(`${C.salt}|${q.id}|${q.o[k]}`)===q.h)corr=k}
   const acierto=sel&&+sel.value===corr;if(acierto)ok++;
   const box=$('#q'+i);box.classList.add(acierto?'ok':'ko');
   box.querySelector('.r').innerHTML=acierto?'<span class="res-ok">✔ Correcta</span>':`<span class="res-ko">✘ ${sel?'Incorrecta':'Sin responder'}.</span> Correcta: ${esc(q.o[corr])}`;}
  document.querySelectorAll('input[type=radio]').forEach(x=>x.disabled=true);$('#f button').remove();
  const n=qs.length,p=Math.round(ok/n*100),nom=($('#nom').value||'(sin nombre)').trim();
  const txt=`${nom} · ${C.titulo} · ${ok}/${n} (${p} %) · ${h()}`;
  $('#res').innerHTML=`<div class="card"><p class="big">${ok} / ${n}</p><p>${p>=50?'✅ Apto':'⚠️ Por debajo del 50 %'} (se aprueba con el 50 %).</p><p class="mut">Copia tu resultado y envíaselo al docente:</p><input type="text" readonly value="${esc(txt)}" id="cp"><p><button class="sec" id="cb" type="button">Copiar resultado</button></p></div>`;
  $('#cb').onclick=()=>{$('#cp').select();navigator.clipboard&&navigator.clipboard.writeText(txt);$('#cb').textContent='¡Copiado!'};
  scrollTo({top:document.body.scrollHeight,behavior:'smooth'});};
 function h(){return hoy()}
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
</script></main></body></html>
