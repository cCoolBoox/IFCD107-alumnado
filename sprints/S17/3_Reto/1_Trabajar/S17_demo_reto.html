<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Demo interactiva del reto del Sprint 17 (IFCD107): audiencia y mensaje único, pirámide, arco y pitch, storyboard con tiempos y voces según el turno, preguntas con el método RESPONDE, comprobación del PDF y revisión con la rúbrica.">
<title>La defensa · demo interactiva</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Maqueta común de las demos del reto (IFCD107): hero → «el producto funcionando» con un selector de pasos
   → qué se sube y cómo se evalúa. Identidad: la de las infografías del curso (tinta azulada, óxido, verde azulado, crema). */
:root{
  --bg:#F5F1E8; --surface:#FFFFFF; --ink:#1D2433; --muted:#566073; --line:#D9D2C0; --soft:#EFE7D2;
  --accent:#C23B1F; --accent-soft:#F7DDD4; --teal:#0F7F7F; --teal-soft:#D5ECEA; --sky:#DCE6F5; --blue:#3D5F96;
  --ok:#1B7F4B; --ok-soft:#D9F0E3; --bad:#B42318; --bad-soft:#FBE0DC; --warn:#8A5A00; --warn-soft:#F6E7C4;
  --code-bg:rgba(29,36,51,.08); --focus:#1D2433; --pt:rgba(61,95,150,.42); --grid:#E4DDCB;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161F; --surface:#1B2230; --ink:#F1ECE0; --muted:#A3ADC0; --line:#2E3748; --soft:#232C3C;
    --accent:#F08A6C; --accent-soft:#3A2620; --teal:#58C7BE; --teal-soft:#16302F; --sky:#1F2C44; --blue:#8FB0E6;
    --ok:#6FD3A0; --ok-soft:#173226; --bad:#FF8D78; --bad-soft:#3A1E1A; --warn:#E9C46A; --warn-soft:#3A2F14;
    --code-bg:rgba(241,236,224,.1); --focus:#F1ECE0; --pt:rgba(143,176,230,.5); --grid:#2A3345; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161F; --surface:#1B2230; --ink:#F1ECE0; --muted:#A3ADC0; --line:#2E3748; --soft:#232C3C;
  --accent:#F08A6C; --accent-soft:#3A2620; --teal:#58C7BE; --teal-soft:#16302F; --sky:#1F2C44; --blue:#8FB0E6;
  --ok:#6FD3A0; --ok-soft:#173226; --bad:#FF8D78; --bad-soft:#3A1E1A; --warn:#E9C46A; --warn-soft:#3A2F14;
  --code-bg:rgba(241,236,224,.1); --focus:#F1ECE0; --pt:rgba(143,176,230,.5); --grid:#2A3345; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:44px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:clamp(30px,5.2vw,52px);line-height:1.05;font-weight:800;letter-spacing:-.02em;margin-top:8px}
h2{font-size:clamp(22px,3vw,28px);line-height:1.15;font-weight:800;letter-spacing:-.01em}
h3{font-size:17px;line-height:1.2;font-weight:800}
p{margin:0}
code{font-family:var(--f-mono);font-size:.86em;background:var(--code-bg);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
a{color:var(--accent);font-weight:700;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
button{font:inherit;color:inherit;cursor:pointer}
.kicker{font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--accent)}
.lead{font-size:clamp(17px,2vw,20px);color:var(--muted);max-width:62ch;margin-top:10px}
.hint{font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:5px 13px;font-size:14px;font-weight:700}
.btn{border:2px solid var(--ink);background:transparent;border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.small{padding:5px 11px;font-size:13px}
.btn.on{background:var(--ink);color:var(--bg)}
.sh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sh .st{font-family:var(--f-display);font-weight:800;font-size:14px;color:var(--accent);letter-spacing:.12em;white-space:nowrap}
.sh .ln{flex:1;height:2px;background:var(--line)}
.sec-intro{color:var(--muted);max-width:68ch;margin:-4px 0 16px}

/* selector de pasos */
.steps{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.step{display:flex;align-items:center;gap:9px;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 13px 7px 8px;text-align:left;font-weight:700;font-size:14px;line-height:1.2}
.step .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:14px}
.step small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.step[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.step[aria-pressed="true"] small{color:var(--bg);opacity:.8}
.aqui{background:var(--teal-soft);border-radius:12px;padding:11px 16px;margin-bottom:16px;font-size:15.5px;min-height:3.2em}
.aqui b{color:var(--teal)}

/* piezas del producto */
.stage{display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row2>*{min-width:0}
@media (max-width:860px){.row2{grid-template-columns:1fr}}
.pieza{background:var(--surface);border:2px solid var(--line);border-radius:14px;overflow:hidden;min-width:0;transition:opacity .2s,box-shadow .2s,border-color .2s}
.pieza>.bh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;border-bottom:2px solid var(--line);font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.pieza>.bb{padding:12px 14px}
.stage.sel .pieza{opacity:.5}
.stage.sel .pieza.hl{opacity:1;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.stage.sel .pieza.hl>.bh{color:var(--accent)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.duo>*{min-width:0}
@media (max-width:700px){.duo{grid-template-columns:1fr}}
.cap{font-size:13.5px;color:var(--muted);margin-top:6px}
.cap b{color:var(--ink)}

/* gráficos */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.chart .tl{font-size:11.5px;font-weight:700;fill:var(--ink)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ax{stroke:var(--muted);stroke-width:1.2}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.legend i.ln{width:18px;height:3px;border-radius:2px;vertical-align:3px}

/* mandos */
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-top:12px;padding-top:12px;border-top:2px solid var(--line)}
.ctl label{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.ctl input[type=range]{width:170px;accent-color:var(--accent)}
.ctl input[type=number],.ctl select{font-family:var(--f-mono);font-size:14px;padding:5px 8px;border:2px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.ctl input[type=number]{width:6em}
.ctl input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.read{font-family:var(--f-mono);font-size:13px;color:var(--ink);background:var(--soft);border-radius:8px;padding:6px 10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-weight:800;font-size:12.5px;letter-spacing:.04em}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.msg{margin-top:8px;font-size:14.5px;padding:8px 12px;border-radius:10px;background:var(--soft)}
.msg.ok{background:var(--ok-soft);color:var(--ok)} .msg.bad{background:var(--bad-soft);color:var(--bad)} .msg.warn{background:var(--warn-soft);color:var(--warn)}

/* tablas */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;text-align:left}
th{font-size:12.5px;font-weight:800;letter-spacing:.04em;color:var(--muted);border-bottom:2px solid var(--line)}
td{border-bottom:1px solid var(--line)}
td.num,th.num{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.sql{font-family:var(--f-mono);font-size:13px;background:var(--code-bg);border-radius:8px;padding:8px 12px;margin-bottom:10px;overflow-wrap:anywhere}

/* lista de comprobaciones */
.checks{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:5px}
.checks li{display:flex;gap:9px;align-items:baseline;font-size:14.5px}
.checks .m{flex:none;width:1.3em;text-align:center;font-weight:800}
.checks li.ok .m{color:var(--ok)} .checks li.no .m{color:var(--muted)} .checks li.bad .m{color:var(--bad)}
textarea{width:100%;min-height:130px;font:inherit;font-size:15px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);resize:vertical}

/* qué se sube y rúbrica */
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:22px}
.file{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:11px 14px}
.file b{font-family:var(--f-mono);font-size:13.5px;overflow-wrap:anywhere}
.file .o{display:block;font-size:13.5px;color:var(--muted);margin-top:3px}
.file .s{display:block;font-size:12.5px;font-weight:800;color:var(--teal);margin-top:6px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-weight:700;font-size:14.5px}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:900px){.levels{grid-template-columns:1fr 1fr}}
@media (max-width:540px){.levels{grid-template-columns:1fr}}
.lv{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 13px;font-size:14px}
.lv h3{font-size:14px;margin-bottom:5px;color:var(--muted)}
.lv.min{border-color:var(--teal)} .lv.min h3{color:var(--teal)}
.links{display:flex;flex-wrap:wrap;gap:10px}
.foot{font-size:13.5px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

cada diapositiva."},{"n":"3","titulo":"Rondas de ensayo","corto":"Rondas de ensayo","min":145,"piezas":["turno","preguntas"],"aqui":"Aquí ensayáis con el tiempo real de vuestro turno y con las diez preguntas: subid a 8 equipos y mirad cuántas diapositivas sobran, y repartid las preguntas para que todas las personas respondan."},{"n":"4","titulo":"Subir la presentación en PDF","corto":"Subir el PDF","min":15,"piezas":["pdf"],"aqui":"Aquí exportáis el PDF con su nombre exacto, comprobáis que no pasa de 12 páginas y que cada cifra la mira alguien que no hizo esa diapositiva."},{"n":"5","titulo":"La defensa y la revisión con la rúbrica","corto":"La defensa y la rúbrica","min":120,"piezas":["turno","preguntas","rubrica"],"aqui":"Aquí defendéis en vuestro turno (se corta cuando se agota), contestáis con RESPONDE y revisáis con la rúbrica: el nivel lo pone quien no preparó esa parte y siempre con una frase de prueba."}],"ficheros":[{"nombre":"presentacion_defensa.pdf","origen":"Lo creáis","sube":"Sí · sprint-17/ (la final sustituye a la del ensayo)"},{"nombre":"plantilla_storytelling.md","origen":"Lo modificáis.","sube":"Sí · sprint-17/"},{"nombre":"autoevaluacion_nombre.md","origen":"Ya hecha, en blanco","sube":"Sí, una por persona (no una por equipo) · sprint-17/"},{"nombre":"guion_defensa.md","origen":"Lo modificáis.","sube":"Solo si lo hacéis · sprint-17/"},{"nombre":"presentacion_reserva.pdf","origen":"Lo creáis.","sube":"Solo si lo hacéis · sprint-17/"}],"sube_resumen":"2 ficheros + 1 hoja por persona","carpeta_entrega":"sprint-17/","rubrica":[{"criterio":"Corrección técnica","pregunta":"¿funciona?","niveles":["El PDF pasa de 12 diapositivas o llega tarde; la demo falla y no hay plan B; hay cifras que no están en la memoria","PDF de 12 diapositivas o menos, subido antes de las 8:30; hay vídeo de plan B; las cifras principales coinciden con la memoria","La demo funciona en directo (con una entrada normal y una errónea) o se pasa al plan B sin perder el hilo; todas las cifras coinciden con la memoria; el ensayo general cabe en el turno","Además, diapositivas de reserva en un PDF aparte y cada cifra de la presentación se puede localizar en una figura o sección de la memoria"]},{"criterio":"Reproducibilidad","pregunta":"¿lo puede repetir otra persona?","niveles":["Solo una persona sabe lanzar la demo y hablar de cada parte","Hay un reparto de voces escrito y la plantilla tiene mensaje único y pirámide","Una persona que no preparó la demo la lanza siguiendo los pasos escritos y sale lo mismo; el storyboard dice quién habla en cada diapositiva y todas las personas hablan; cualquiera puede retomar la parte de otra","Además, el guion subido tiene las 10 respuestas con quién contesta, el dato y la sección de la memoria, y otra persona podría dar el relato solo con él"]},{"criterio":"Análisis y comunicación al cliente","pregunta":"¿lo entiende quien no programa?","niveles":["Cuenta todo en orden cronológico («primero hicimos…») y con jerga sin explicar","Hay mensaje único y se cuentan el problema, lo encontrado y la recomendación, con alguna palabra técnica sin traducir","La conclusión va primero; el mensaje único está en la diapositiva 1 y en el cierre; títulos-conclusión de una idea; al menos 4 términos traducidos; recomendación de 3 acciones y límites dichos con claridad","Además, un relato memorable: gancho de apertura, una cifra grande por diapositiva y comparación con lo que hace el cliente hoy; alguien ajeno repite el mensaje con sus palabras"]},{"criterio":"IA responsable","pregunta":"¿se sabe de qué no fiarse y qué hizo la IA?","niveles":["No se dice dónde falla el modelo ni qué riesgos tiene; no se dice si se usó IA","Se dice al menos un límite o un riesgo, y si se usó IA para preparar la defensa, sin detalle","Se dice dónde falla y para quién, con tres riesgos y sus medidas; se declara qué se pidió a la IA y qué se revisó; ante lo que no se sabe se responde «no lo hemos medido»","Además, se cuenta un fallo concreto (de la IA o .w17-arc{list-style:none;margin:6px 0;padding:0;display:grid;gap:7px}
.w17-arc li{border:2px solid var(--line);border-radius:10px;padding:7px 11px;font-size:13.5px}
.w17-arc li b{font-size:14px}
.w17-arc li em{display:block;color:var(--muted);font-size:12.5px}
.w17-arc li .t{float:right;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}

.w17-st{width:100%;border-collapse:collapse;font-size:14px}
.w17-st th{text-align:left;font-size:12.5px;color:var(--muted);padding:5px 6px;border-bottom:2px solid var(--line)}
.w17-st td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}

.w17-st tr.fuera td.tm,.w17-st tr.fuera td.n{opacity:.45;text-decoration:line-through}
.w17-sl{font-size:12px;font-weight:700;color:var(--muted);margin:0 4px 0 6px}
.w17-st select+.w17-sl{margin-left:10px}
@media (max-width:620px){
 .w17-st thead{display:none}
 .w17-st tr{display:flex;flex-wrap:wrap;align-items:center;gap:3px 10px;padding:7px 0;border-bottom:1px solid var(--line)}
 .w17-st td{border:0;padding:0}
 .w17-st td.tm{flex:1 1 calc(100% - 40px);min-width:0}
 .w17-st td.vz,.w17-st td.tp,.w17-st td.rs{display:flex;align-items:center;gap:6px}
 .w17-st td.vz{min-width:0}
 .w17-st td.vz::before,.w17-st td.tp::before,.w17-st td.rs::before{content:attr(data-l);font-size:12px;font-weight:700;color:var(--muted)}

.w17-per span.n{font-weight:800}
.w17-per span.v{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.w17-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}

.w17-pre,textarea.w17-pre{font-family:var(--f-mono);font-size:12.5px;min-height:250px}
.w17-rs[hidden],.w17-q[hidden]{display:none!important}
.w17-lb,.ctl label.w17-lb{display:grid;gap:3px;flex:1 1 240px;min-width:0;align-items:stretch}
.w17-lst{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}

    <p class="cap" style="margin:0 0 6px">Las comprueba <b>una persona que no hizo esa diapositiva<\/b>. Son los ejemplos del hotel: las cifras de vuestra presentación serán otras.<\/p><div id="w17-pc" class="w17-lst"><\/div><div id="w17-pcm"><\/div>`;
  const accion = {si: 'Coincide: no se toca nada.', no: 'No coincide: se corrige <b>la diapositiva<\/b> y se exporta otra vez. <b>No se cambia la memoria.<\/b>', fuera: 'No está en la memoria: la cifra se <b>quita<\/b>. No se presentan resultados nuevos.'};
  const pcm = msg(); q(PB, '#w17-pcm').appendChild(pcm);
  const cif = d.pdf.cifras.map((c, i) => {
    const w = el('div', 'w17-fz', `<b>Diapositiva ${c.d}<\/b> · «${esc(c.c)}»<br><small>En la memoria: ${esc(c.donde)}<\/small>
      <div class="ctl" style="margin-top:6px;padding-top:6px"><label>¿Coincide? <select class="w17-in" style="width:auto"><option value="si">sí<\/option><option value="no">no coincide<\/option><option value="fuera">no está en la memoria<\/option><\/select><\/label>
      <label>La comprueba <select class="w17-in" style="width:auto"><\/select><\/label><\/div><div class="cap"><\/div>`);
    q(PB, '#w17-pc').appendChild(w); const [se, sr] = w.querySelectorAll('select'); se.value = c.est; se.addEventListener('change', pintaCif); sr.addEventListener('change', pintaCif);
    return {se, sr, c, cap: q(w, '.cap')};
  });
  function pordefecto(){ cif.forEach(f => { rellena(f.sr, '', ''); const h = (ultimo.voz || voz)[f.c.d - 1], k = +h.slice(1); f.sr.value = 'P' + (k === 1 ? E.n : k - 1); }); }
  function pintaCif(){
    let bad = 0, own = 0;
    cif.forEach(f => { const h = (ultimo.voz || voz)[f.c.d - 1], propia = f.sr.value === h; own += propia; bad += f.se.value !== 'si';
      f.cap.innerHTML = accion[f.se.value] + (propia ? ` <b class="w17-malx" style="color:var(--bad)">Pero ${h} habla y hace esa diapositiva: que la compruebe otra persona.<\/b>` : ''); });
    poneMsg(pcm, own || bad ? 'warn' : 'ok', `${cif.length - bad} de ${cif.length} cifras coinciden.${bad ? ' <b>Una cifra distinta basta para bajar el nivel de «Corrección técnica»<\/b> en la rúbrica: se corrige la diapositiva.' : ''}${own ? ' Nadie revisa su propia diapositiva.' : ''}`);
  }
  oyentes.push(que => { if (que !== 'eq') pordefecto(); pintaCif(); });
  pasan.push(pintaCif);

  /* ═════════ 6 · LA REVISIÓN CON LA RÚBRICA ═════════ */
  const bR = pieza(host, 'rubrica', 'LA REVISIÓN CON LA RÚBRICA · QUIEN NO LO PREPARÓ, CON PRUEBA');
  const PARTES = ['Diapositivas', 'Demo', 'Plantilla y relato', 'Límites y riesgos'];
  bR.innerHTML = `<p class="cap" style="margin:0 0 8px">Después de defender, la revisión la hace <b>quien no escribió esa parte<\/b>. El nivel es el de la columna cuyo texto <b>se cumple entero<\/b>; si se cumple a medias, el de abajo. Sin una frase de prueba, el nivel no vale. Cada criterio se mira con su parte (el de Reproducibilidad lo pone quien no preparó la demo; el resto, en el mismo orden).<\/p>
    <div class="ctl" id="w17-rpp" style="margin-top:0;padding-top:0;border:0"><\/div>
    <div class="w17-ok" id="w17-rcr"><\/div><div id="w17-rrm"><\/div>
    <div class="ctl"><label class="w17-lb">Uso de IA en la preparación de la defensa <input class="w17-in" id="w17-ria" type="text" placeholder="qué le pedisteis y qué revisasteis a mano; si no la usasteis, escribidlo"><\/label><label class="w17-lb">Lo primero que mejoraríamos <input class="w17-in" id="w17-rme" type="text" placeholder="una cosa concreta"><\/label><\/div>
    <h4 class="w17-h w17-blk"><i>▸<\/i>Así quedaría al final de <code>plantilla_storytelling.md<\/code><\/h4>
    <textarea class="w17-in w17-pre" id="w17-rmd" readonly aria-label="Texto de la revisión con la rúbrica, para copiar en la plantilla"><\/textarea><div class="ctl" id="w17-rcp" style="margin-top:6px;padding-top:6px;border:0"><\/div>`;
  const prep = PARTES.map((p, i) => { const l = el('label', '', `${esc(p)} lo preparó <select class="w17-in" style="width:auto" aria-label="Quién preparó: ${esc(p)}"><\/select>`); q(bR, '#w17-rpp').appendChild(l); const s = q(l, 'select'); s.addEventListener('change', pintaRub); return s; });
  const defPrep = ['P2', 'P3', 'P1', 'P4'];
  let rubNivel = d.rubrica.map(() => 0);
  const rcr = d.rubrica.map((r, i) => {
    const c = el('div', 'w17-cr'); q(bR, '#w17-rcr').appendChild(c);
    c.innerHTML = `<h5>${esc(r.criterio)}<\/h5><p class="p">${esc(r.pregunta)} · parte: <b>${esc(PARTES[i])}<\/b><\/p>
      <div class="niv"><\/div><div class="txt" aria-live="polite">Elegid un nivel y leed si se cumple <b>entero<\/b>.<\/div>
      <label>Pone el nivel <select class="w17-in" style="width:auto" aria-label="Quién pone el nivel de ${esc(r.criterio)}"><\/select><\/label>
      <textarea class="w17-in" rows="2" style="margin-top:6px" aria-label="Frase de prueba de ${esc(r.criterio)}" placeholder="${esc(r.ph)}"><\/textarea><div class="cap est"><\/div>`;
    const g = grupo([[1, '1'], [2, '2'], [3, '3'], [4, '4']], 0, v => { rubNivel[i] = v; q(c, '.txt').innerHTML = `<b>Nivel ${v}:<\/b> ${esc(r.niveles[v - 1])}`; pintaRub(); }, `Nivel de ${r.criterio}`);
    q(c, '.niv').appendChild(g.el);
    const sel = q(c, 'select'); sel.addEventListener('change', pintaRub); q(c, 'textarea').addEventListener('input', pintaRub);
    return {c, sel, ta: q(c, 'textarea'), est: q(c, '.est')};
  });
  const rrm = msg(); q(bR, '#w17-rrm').appendChild(rrm);
  const rmd = q(bR, '#w17-rmd'), ria = q(bR, '#w17-ria'), rme = q(bR, '#w17-rme');
  ria.addEventListener('input', pintaRub); rme.addEventListener('input', pintaRub);
  function pintaRub(){
    let validos = 0;
    rcr.forEach((f, i) => {
      const prepara = prep[i].value, razones = [];
      if (!rubNivel[i]) razones.push('falta el nivel');
      if (pal(f.ta.value) < 3) razones.push('falta la frase de prueba (sin prueba, el nivel no vale)');
      if (f.sel.value === prepara) razones.push(`${prepara} preparó esa parte y no puede poner su nivel`);
      f.c.classList.toggle('bien', !razones.length); f.c.classList.toggle('mal', razones.length > 0 && !!(rubNivel[i] || f.ta.value));
      f.est.innerHTML = razones.length ? `<span class="pill ${rubNivel[i] || f.ta.value ? 'bad' : 'warn'}">NO VALE TODAVÍA<\/span> ${razones.join('; ')}.` : '<span class="pill ok">VÁLIDO<\/span> nivel, prueba y quien lo pone.';
      validos += !razones.length;
    });
    poneMsg(rrm, validos === rcr.length ? 'ok' : 'warn', `<b>${validos} de ${rcr.length} criterios con un nivel que vale.<\/b> ${validos === rcr.length ? 'Falta solo copiar el resultado a la plantilla.' : 'Cada uno necesita nivel, frase de prueba y que lo ponga quien no preparó esa parte.'}`);
    const quien = [...new Set(rcr.map(f => f.sel.value))].join(' y ');
    rmd.value = `**Revisado por:** ${quien} · **Fecha:** dd/mm/aaaa\n\n**Uso de IA en la preparación de la defensa:** ${ria.value.trim() || '…'}\n\n| Criterio | Nivel (1–4) | Prueba: una frase de lo que has comprobado |\n|---|---|---|\n` +
      d.rubrica.map((r, i) => `| ${r.criterio} | ${rubNivel[i] || '…'} | ${rcr[i].ta.value.trim().replace(/\|/g, '/') || '…'} |`).join('\n') + `\n\n**Lo primero que mejoraríamos:** ${rme.value.trim() || '…'}\n`;
  }
  q(bR, '#w17-rcp').append(boton('Copiar el texto', () => { rmd.select(); const viejo = () => { try { document.execCommand('copy'); } catch (e2) {} }; try { navigator.clipboard.writeText(rmd.value).catch(viejo); } catch (e) { viejo(); } }), el('span', 'cap', 'Solo es un borrador: lo que se entrega es el archivo de vuestro repositorio.'));
  oyentes.push(que => {
    prep.forEach((s, i) => rellena(s, que === 'eq' ? s.value : defPrep[i]));
    rcr.forEach((f, i) => { if (que !== 'eq') { rellena(f.sel, ''); f.sel.value = P(E.n).find(p => p !== prep[i].value); } }); pintaRub(); });

  emite();
};

/* ───────── marco común ───────── */
const app = document.getElementById('app');
const sh = (t) => `<div class="sh"><span class="st">${esc(t)}</span><span class="ln"></span></div>`;

const hero = el('header');
const totalMin = D.pasos.reduce((s, p) => s + (p.min || 0), 0);
hero.innerHTML = `<div class="kicker">${esc(D.kicker)}</div><h1>${esc(D.titulo)}</h1><p class="lead">${md(D.lead)}</p>
  <div class="chips"><span class="chip">${D.pasos.length} pasos</span><span class="chip">≈ ${totalMin} min de reto</span><span class="chip">${esc(D.sube_resumen)}</span></div>
  <p class="hint" style="margin-top:14px">${md(D.aviso)}</p>`;
app.appendChild(hero);

const play = el('section');
play.innerHTML = sh('EL PRODUCTO FUNCIONANDO') + `<h2>${esc(D.widget_titulo)}</h2><p class="sec-intro">${md(D.intro)}</p>`;
const steps = el('div', 'steps'); steps.setAttribute('role', 'group'); steps.setAttribute('aria-label', 'Pasos del reto');
const aqui = el('div', 'aqui'); aqui.setAttribute('aria-live', 'polite');
const stage = el('div', 'stage');
play.append(steps, aqui, stage);
app.appendChild(play);
const widget = W[D.widget](stage, D);

function elegir(i){
  const btns = steps.querySelectorAll('.step');
  btns.forEach((b, k) => b.setAttribute('aria-pressed', String(k === i)));
  const panels = stage.querySelectorAll('[data-pieza]');
  if (i < 0) { stage.classList.remove('sel'); panels.forEach(p => p.classList.remove('hl')); aqui.innerHTML = md(D.aqui_todo); return; }
  const p = D.pasos[i];
  stage.classList.add('sel');
  panels.forEach(pn => pn.classList.toggle('hl', pn.dataset.pieza.split(' ').some(x => (p.piezas || []).includes(x))));
  aqui.innerHTML = `<b>Paso ${esc(p.n)} · ${esc(p.titulo)}</b> (${p.min} min). ${md(p.aqui || '')}`;
  const first = stage.querySelector('.pieza.hl'); if (first && first.getBoundingClientRect().top > window.innerHeight * .8) first.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center'});
}
D.pasos.forEach((p, i) => {
  const b = el('button', 'step', `<span class="n">${esc(p.n)}</span><span>${esc(p.corto || p.titulo)}<small>${p.min} min</small></span>`);
  b.type = 'button'; b.setAttribute('aria-pressed', 'false'); b.addEventListener('click', () => elegir(steps.querySelector('.step[aria-pressed="true"]') === b ? -1 : i));
  steps.appendChild(b);
});
elegir(-1);

/* qué se sube y cómo se evalúa */
const fin = el('section');
fin.innerHTML = sh('QUÉ SE SUBE Y CÓMO SE EVALÚA') + `<h2>Lo que entregáis y con qué se puntúa</h2><p class="sec-intro">Todo va al repositorio del equipo, en la carpeta <code>${esc(D.carpeta_entrega)}</code>. La rúbrica es la misma que usáis para revisar vuestro propio trabajo antes de subirlo.</p>`;
const files = el('div', 'files');
D.ficheros.forEach(f => files.appendChild(el('div', 'file', `<b>${esc(f.nombre)}</b><span class="o">${md(f.origen)}</span><span class="s">${esc(f.sube)}</span>`)));
fin.appendChild(files);
const tabs = el('div', 'tabs'); tabs.setAttribute('role', 'tablist');
const lv = el('div', 'levels'); lv.setAttribute('aria-live', 'polite');
const qq = el('p', 'hint'); qq.style.marginBottom = '10px';
const NIV = ['1 · Empezado', '2 · Mínimo', '3 · Estándar', '4 · Extra'];
function criterio(k){
  tabs.querySelectorAll('.tab').forEach((t, j) => t.setAttribute('aria-selected', String(j === k)));
  const c = D.rubrica[k]; qq.textContent = c.pregunta;
  lv.innerHTML = c.niveles.map((t, j) => `<div class="lv${j === 1 ? ' min' : ''}"><h3>${NIV[j]}</h3><p>${md(t)}</p></div>`).join('');
}
D.rubrica.forEach((c, k) => { const t = el('button', 'tab', esc(c.criterio)); t.type = 'button'; t.setAttribute('role', 'tab'); t.addEventListener('click', () => criterio(k)); tabs.appendChild(t); });
fin.append(tabs, qq, lv);
fin.appendChild(el('p', 'hint', 'Orientación: lo que pide el nivel mínimo sale en un <b>2</b>, el estándar en un <b>3</b> y los extras en un <b>4</b>. Sin una frase de prueba escrita, el nivel no vale.'));
criterio(0);
app.appendChild(fin);

const pie = el('footer');
pie.innerHTML = sh('DÓNDE SEGUIR') + `<div class="links">${D.enlaces.map(e => `<a class="btn" href="${esc(e.url)}">${esc(e.t)}</a>`).join('')}</div><p class="foot" style="margin-top:14px">${md(D.pie)}</p>`;
app.appendChild(pie);
})();
</script>
</body>
